function buildRefuerzo(o, meta){
  const g = grp(o.item); const E = gEst(g); const L = gSes(g.id).filter(r=>r.fecha>=o.desde && r.fecha<=o.hasta).reverse();
  let h = rHead('Informe de reforzamiento', `${esc(g.nombre)}<br>Período: ${fmt(o.desde)} al ${fmt(o.hasta)}`, meta);
  h += `<h2>Datos del grupo</h2>${rkv([['Asignatura',g.asignatura],['Profesional a cargo',profName(g.profesional)],['Docente colaborador',g.docente],['Horario',(g.dias||[]).join(', ')+(g.hora?' · '+g.hora:'')+(g.duracion?' · '+g.duracion+' min':'')],['Lugar',g.sala],['Objetivo',g.objetivo,1]])}`;
  h += `<div class="tiles"><div class="tile"><b>${L.length}</b><span>sesiones realizadas</span></div><div class="tile"><b>${E.length}</b><span>estudiantes</span></div><div class="tile"><b>${(()=>{ const s = E.map(e=>gStats(g,e.id,o.desde,o.hasta)); const t = s.reduce((a,x)=>a+x.tot,0); return t?Math.round(s.reduce((a,x)=>a+x.P,0)/t*100)+'%':'—'; })()}</b><span>asistencia promedio</span></div></div>`;
  h += `<h2>Asistencia y logro por estudiante</h2><table><thead><tr><th>Estudiante</th><th>Curso</th><th>Presente</th><th>Ausente</th><th>Justificado</th><th>Asistencia</th><th>Logros</th></tr></thead><tbody>${E.map(e=>{ const st = gStats(g,e.id,o.desde,o.hasta); const lg = LOGROS.map(l=>st.L.filter(r=>r.asis[e.id].l===l).length); return `<tr><td>${esc(e.nombre)}${e.uaa?' <span class="muted">(UAA)</span>':''}</td><td>${esc(e.curso||'')}</td><td>${st.P}</td><td>${st.A}</td><td>${st.J}</td><td>${st.pct==null?'—':st.pct+'%'}</td><td>${lg[0]} L · ${lg[1]} ED · ${lg[2]} NL</td></tr>`; }).join('')}</tbody></table><p class="muted">L: logrado · ED: en desarrollo · NL: no logrado.</p>`;
  h += `<h2>Registro de sesiones</h2>${L.length?`<table><thead><tr><th>Fecha</th><th>Contenido</th><th>Actividades</th><th>Asistencia</th></tr></thead><tbody>${L.map(r=>{ const v = Object.values(r.asis||{}); return `<tr><td>${fmtShort(r.fecha)}</td><td>${esc(r.contenido||'')}</td><td>${esc(r.actividades||'')}${r.obs?'<br><i>'+esc(r.obs)+'</i>':''}</td><td>${v.filter(x=>x.a==='P').length} de ${v.length}</td></tr>`; }).join('')}</tbody></table>`:'<p class="muted">Sin sesiones en el período.</p>'}`;
  h += signs([[profName(g.profesional),'Profesional a cargo'],['Coordinación UAA',''],['Jefatura técnica','']]);
  return `<div class="rpt">${h}${rFoot(meta)}</div>`;
}
function buildBitacora(o, meta){
  const [prof, mon] = String(o.item).split('|'); const W = weekSummary(prof, mon); const b = W.b; const p = S.data.equipo.find(x=>x.id===prof)||{};
  let h = rHead('Bitácora semanal', `${esc(p.nombre||'')} · ${esc(p.cargo||'')}<br>Semana del ${weekLbl(mon)}`, meta);
  h += `<div class="tiles"><div class="tile"><b>${hrs(W.dir)}</b><span>atención directa y reforzamiento</span></div><div class="tile"><b>${hrs(W.total)}</b><span>total registrado${W.contr?' de '+W.contr+' h contratadas':''}</span></div><div class="tile"><b>${W.est}</b><span>estudiantes atendidos · ${W.fam} contactos con familias</span></div></div>`;
  const rows = [...W.auto.map(a=>({...a, origen:'Automático'})), ...W.man.map(i=>({fecha:i.fecha, tipo:i.tipo, desc:i.descripcion+(i.sid&&stu(i.sid)?' · '+stu(i.sid).nombre:''), min:+i.minutos||0, origen:'Manual'}))].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  h += `<h2>Actividades</h2>${rows.length?`<table><thead><tr><th>Fecha</th><th>Tipo</th><th>Descripción</th><th>Tiempo</th><th>Origen</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${fmtShort(r.fecha)}</td><td>${esc(r.tipo)}</td><td>${esc(r.desc)}</td><td>${r.min?hrs(r.min):'—'}</td><td>${r.origen}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">Sin actividades.</p>'}`;
  h += `<h2>Síntesis</h2>${rkv([['Logros y avances',b?.logros,1],['Dificultades',b?.dificultades,1],['Pendientes para la próxima semana',b?.pendientes,1]])}`;
  h += `<p class="note">${b?.estado==='Cerrada'?`Bitácora cerrada el ${esc(fmtTs(b.cerradaEn))} por ${esc(whoName(b.cerradaPor))}.`:'Bitácora en borrador: aún no ha sido cerrada por la profesional.'} Las actividades de origen automático provienen de los registros de la app.</p>`;
  h += signs([[p.nombre||'Profesional', p.cargo||''],['Coordinación UAA','Toma conocimiento']]);
  return `<div class="rpt">${h}${rFoot(meta)}</div>`;
}

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if(!el) return; const a = el.dataset.act;
  const rerender = () => keepScroll(render);
  switch(a){
    case 'tv': S.tv = el.dataset.v; rerender(); break;
    case 'open-grupo': S.gid = el.dataset.id; render(); window.scrollTo(0,0); break;
    case 'close-grupo': S.gid = null; rerender(); break;
    case 'add-grupo': openForm({kind:'grupo', schema:'grupo', where:'modal', draft:{profesional:S.data.usuario, dias:[], uaa:[], otros:[], fechaInicio:D(0), duracion:60}, isNew:true, title:'Nuevo grupo de reforzamiento'}); break;
    case 'edit-grupo': openForm({kind:'grupo', schema:'grupo', where:'modal', draft:grupoDraft(grp(S.gid)), title:'Editar grupo'}); break;
    case 'rep-grupo': openReport('refuerzo', null, S.gid); break;
    case 'rs-new': { const g = grp(S.gid); S.rs = {gid:g.id, draft:{fecha:D(0), hora:g.hora||'', duracion:g.duracion||'', profesional:g.profesional, asis:{}}}; renderModal(); break; }
    case 'rs-edit': { const r = S.data.refSesiones.find(x=>x.id===el.dataset.id); S.rs = {gid:r.gid, draft:clone(r)}; renderModal(); break; }
    case 'rs-close': S.rs = null; renderModal(); break;
    case 'rs-asis': { const k = el.dataset.k; S.rs.draft.asis[k] = {...(S.rs.draft.asis[k]||{}), a:el.dataset.v}; if(el.dataset.v!=='P') S.rs.draft.asis[k].l = ''; renderModal(); break; }
    case 'rs-save': { const r = S.rs, d = r.draft; if(!d.fecha || !d.contenido){ r.err = 'Completa la fecha y el contenido.'; renderModal(); break; }
      const g = grp(r.gid); const valid = new Set(gEst(g).map(x=>x.id)); Object.keys(d.asis).forEach(k=>{ if(!valid.has(k)) delete d.asis[k]; });
      S.data.refSesiones = S.data.refSesiones||[];
      if(d.id){ const i = S.data.refSesiones.findIndex(x=>x.id===d.id); S.data.refSesiones[i] = stamp({...d, gid:r.gid}); }
      else S.data.refSesiones.push(stamp({...d, gid:r.gid, id:uid()}, true));
      gEst(g).filter(x=>x.uaa).forEach(x=>logEv(x.sid, d.id?'Editó':'Registró', `sesión de reforzamiento del ${fmt(d.fecha)} · ${g.nombre} · ${({P:'presente',A:'ausente',J:'justificado'})[d.asis[x.id]?.a]||''}`));
      S.rs = null; persist(); rerender(); toast('Sesión de reforzamiento guardada'); break; }
    case 'rs-del': { const id = el.dataset.id; if(S.arm!=='rsdel-'+id){ S.arm = 'rsdel-'+id; rerender(); break; } const r = S.data.refSesiones.find(x=>x.id===id); const g = grp(r.gid);
      gEst(g).filter(x=>x.uaa).forEach(x=>logEv(x.sid,'Eliminó',`sesión de reforzamiento del ${fmt(r.fecha)} · ${g.nombre}`));
      S.data.refSesiones = S.data.refSesiones.filter(x=>x.id!==id); S.arm = null; persist(); rerender(); toast('Sesión eliminada'); break; }
    case 'bw': S.bweek = +el.dataset.d===0 ? monday(D(0)) : addDays(S.bweek, +el.dataset.d); S.arm = null; rerender(); break;
    case 'go-bit': S.view = 'trabajo'; S.tv = 'bit'; S.bprof = S.data.usuario; S.bweek = el.dataset.w; render(); window.scrollTo(0,0); break;
    case 'bit-add': { const f = (D(0)>=S.bweek && D(0)<=addDays(S.bweek,6)) ? D(0) : S.bweek; openForm({kind:'bitItem', schema:'bitItem', where:'modal', draft:{fecha:f}, isNew:true, title:'Agregar actividad a la bitácora'}); break; }
    case 'bit-edit': { const b = bitRec(S.bprof, S.bweek); openForm({kind:'bitItem', schema:'bitItem', where:'modal', draft:clone(b.items.find(i=>i.id===el.dataset.id)), title:'Editar actividad'}); break; }
    case 'bit-del': { const id = el.dataset.id; if(S.arm!=='bdel-'+id){ S.arm = 'bdel-'+id; rerender(); break; } const b = bitRec(S.bprof, S.bweek); const it = b.items.find(i=>i.id===id); b.items = b.items.filter(i=>i.id!==id); stamp(b); logEv(it?.sid||'','Eliminó',`bitácora: ${it?.tipo}`); S.arm = null; persist(); rerender(); break; }
    case 'bit-save': { const b = bitEnsure(S.bprof, S.bweek); b.logros = document.getElementById('bt-logros').value; b.dificultades = document.getElementById('bt-dif').value; b.pendientes = document.getElementById('bt-pend').value; stamp(b); logEv('','Editó',`bitácora de ${profName(S.bprof)} · semana del ${weekLbl(S.bweek)}`); persist(); rerender(); toast('Síntesis guardada'); break; }
    case 'bit-close': { if(S.arm!=='bclose'){ const keep = ['bt-logros','bt-dif','bt-pend'].map(i=>document.getElementById(i).value); S.arm = 'bclose'; rerender(); ['bt-logros','bt-dif','bt-pend'].forEach((i,n)=>{ document.getElementById(i).value = keep[n]; }); break; }
      const b = bitEnsure(S.bprof, S.bweek); b.logros = document.getElementById('bt-logros').value; b.dificultades = document.getElementById('bt-dif').value; b.pendientes = document.getElementById('bt-pend').value;
      b.estado = 'Cerrada'; b.cerradaEn = nowIso(); b.cerradaPor = S.data.usuario||''; stamp(b); logEv('','Cerró bitácora',`${profName(S.bprof)} · semana del ${weekLbl(S.bweek)}`); S.arm = null; persist(); rerender(); toast('Semana cerrada'); break; }
    case 'bit-reopen': { if(S.arm!=='bopen'){ S.arm = 'bopen'; rerender(); break; } const b = bitRec(S.bprof, S.bweek); b.estado = 'Borrador'; b.reabiertaEn = nowIso(); stamp(b); logEv('','Reabrió bitácora',`${profName(S.bprof)} · semana del ${weekLbl(S.bweek)}`); S.arm = null; persist(); rerender(); break; }
    case 'rep-bit': openReport('bitacora', null, S.bprof+'|'+S.bweek); break;
  }
});
function onRSField(e){
  const el = e.target; if(!S.rs) return false; const d = S.rs.draft;
  if(el.dataset.rs){ d[el.dataset.rs] = el.type==='number' ? (el.value===''?'':Number(el.value)) : el.value; return true; }

const COORD_CARGOS = ['Coordinación UAA','Equipo de gestión'];
const isCoord = pid => COORD_CARGOS.includes((S.data.equipo.find(p=>p.id===pid)||{}).cargo);
function myStudents(pid){
  const set = new Set(); if(!pid) return set;
  S.data.students.forEach(s=>{
    if(s.referente===pid || s.pai?.responsable===pid || s.paci?.responsable===pid || (s.pai?.objetivos||[]).some(o=>o.responsable===pid) || (s.paec?.equipo||[]).some(e=>e.prof===pid)
      || (s.sesiones||[]).some(x=>x.profesional===pid && diffDays(x.fecha)>=-90) || (s.adaptadas||[]).some(x=>x.adaptadaPor===pid && diffDays(x.fecha)>=-90)) set.add(s.id);
  });
  (S.data.grupos||[]).filter(g=>g.profesional===pid).forEach(g=>(g.estudiantes||[]).forEach(e=>{ if(e.sid) set.add(e.sid); }));
  return set;
}
const wdName = f => DIAS[(parse(f).getDay()+6)%7];
function daySchedule(pid, f){
  const out = [];
  S.data.students.forEach(s=>{
    (s.sesiones||[]).forEach(x=>{ if(x.profesional===pid && x.fecha===f) out.push({hora:x.hora||'', t:s.nombre, d:x.modalidad||'Sesión', estado:x.estado, act:`data-act="open" data-sid="${s.id}" data-tab="sesiones"`, ic:'activity', av:AREA_AV(s.nombre), ini:initials(s.nombre)}); });
    (s.adaptadas||[]).forEach(x=>{ if(x.adaptadaPor===pid && x.fecha===f) out.push({hora:'', t:`Evaluación adaptada: ${x.asignatura}`, d:s.nombre, estado:x.estado, act:`data-act="open" data-sid="${s.id}" data-tab="adaptadas"`, ic:'layers', av:'av2'}); });
  });
  (S.data.grupos||[]).forEach(g=>{ const wd = wdName(f);
    if(g.profesional===pid && (g.dias||[]).includes(wd) && (!g.fechaInicio || f>=g.fechaInicio) && (!g.fechaFin || f<=g.fechaFin)){
      const done = (S.data.refSesiones||[]).some(r=>r.gid===g.id && r.fecha===f);
      out.push({hora:g.hora||'', t:g.nombre, d:`Reforzamiento · ${gEst(g).length} estudiantes${g.sala?' · '+g.sala:''}`, estado: done?'Registrada':'Programada', act:`data-act="go-grupo" data-id="${g.id}"`, ic:'users', av:'av3'}); } });
  return out.sort((a,b)=>(a.hora||'99').localeCompare(b.hora||'99'));
}
function myTasks(pid, mine){
  const T = [];
  const al = allAlerts().filter(a=>mine.has(a.sid));
  S.data.students.forEach(s=>(s.sesiones||[]).forEach(x=>{ if(x.profesional===pid && x.estado==='Programada' && diffDays(x.fecha)<0) T.push({lvl:'warn', t:`Actualizar la sesión del ${fmtShort(x.fecha)}`, d:`${s.nombre} · sigue como programada. Márcala como realizada, suspendida o ausente.`, act:`data-act="open" data-sid="${s.id}" data-tab="sesiones"`}); }));
  (S.data.grupos||[]).filter(g=>g.profesional===pid).forEach(g=>{ for(let i=-7;i<0;i++){ const f = D(i); const wd = (parse(f).getDay()+6)%7; if(wd<5 && (g.dias||[]).includes(DIAS[wd]) && (!g.fechaInicio||f>=g.fechaInicio) && !(S.data.refSesiones||[]).some(r=>r.gid===g.id && r.fecha===f)) T.push({lvl:'warn', t:`Registrar el reforzamiento del ${fmtShort(f)}`, d:`${g.nombre}: no hay asistencia registrada para esa sesión.`, act:`data-act="go-grupo" data-id="${g.id}"`}); } });
  S.data.students.forEach(s=>(s.adaptadas||[]).forEach(x=>{ const d = diffDays(x.fecha); if(x.adaptadaPor===pid && x.estado==='Por adaptar' && d>3 && d<=10) T.push({lvl:'info', t:`Adaptar la evaluación de ${x.asignatura}`, d:`${s.nombre} · se aplica el ${fmt(x.fecha)}.`, act:`data-act="open" data-sid="${s.id}" data-tab="adaptadas"`}); }));
  acuerdosDe(pid).filter(a=>a.estado!=='Cumplido' && a.r.estado==='Realizada' && (!a.plazo || diffDays(a.plazo)<=7)).forEach(a=>{ const late = a.plazo && diffDays(a.plazo)<0; T.push({lvl: late?'crit':'info', t:`Acuerdo de reunión: ${trunc(a.acuerdo,70)}`, d:`${a.r.tipo} del ${fmt(a.r.fecha)}${a.plazo?(late?' · venció el ':' · plazo ')+fmt(a.plazo):''}.`, act:`data-act="go-reu"`}); });
  const prev = addDays(monday(D(0)),-7); const b = bitRec(pid, prev);
  if(b?.estado!=='Cerrada') T.push({lvl:'info', t:`Cerrar la bitácora del ${weekLbl(prev)}`, d: b ? 'Está en borrador.' : 'No tiene registros.', act:`data-act="go-bit" data-w="${prev}"`});
  const ord = {crit:0, warn:1, info:2};
  return {al, T: T.sort((a,b)=>ord[a.lvl]-ord[b.lvl])};
}
const taskRow = t => `<li class="rowi click lv-${t.lvl}" ${t.act}><span class="icw">${ic(t.lvl==='info'?'calendar':'clock')}</span><div class="main"><span class="t"><span class="lvl">${t.lvl==='crit'?'Urgente':t.lvl==='warn'?'Pendiente':'Por hacer'}</span>${esc(t.t)}</span><span class="d">${esc(t.d)}</span></div><span class="end">${ic('arrow','sm')}</span></li>`;
const schedRow = x => `<li class="rowi click" ${x.act}><span class="icw ${x.av}">${x.ini?`<b style="font-size:.8rem">${x.ini}</b>`:ic(x.ic)}</span><div class="main"><span class="t">${esc(x.t)}</span><div class="meta">${x.hora?`<span class="chip ico">${ic('clock')}${esc(x.hora)}</span>`:''}<span class="chip">${esc(x.d)}</span></div></div><span class="pill ${x.estado==='Realizada'||x.estado==='Registrada'||x.estado==='Aplicada'?'ok':x.estado==='Por adaptar'?'crit':'info'}">${esc(x.estado||'')}</span></li>`;

function vPanelPro(pid){
  const p = S.data.equipo.find(x=>x.id===pid) || {}; const mine = myStudents(pid);
  const {al, T} = myTasks(pid, mine);
  const W = weekSummary(pid, monday(D(0)));
  let hoy = D(0), sched = daySchedule(pid, hoy), when = 'Hoy';

function kpiRange(){
  const p = S.kper || 'mes';
  if(p==='semana') return {p, from:monday(D(0)), to:D(0), lbl:'Semana del '+weekLbl(monday(D(0)))};
  if(p==='anio') return {p, from:TODAY.getFullYear()+'-01-01', to:D(0), lbl:'Año '+TODAY.getFullYear()};
  const d = new Date(TODAY); d.setDate(1); return {p, from:isoOf(d), to:D(0), lbl:cap(TODAY.toLocaleDateString('es-CL',{month:'long', year:'numeric'}))};
}
const pctOf = (a,b) => b ? Math.round(a/b*100) : null;
const semaf = (v, hi=85, lo=60) => v==null ? 'none' : v>=hi ? 'ok' : v>=lo ? 'warn' : 'crit';
const SEM_TXT = {ok:'Bien', warn:'Atención', crit:'Crítico', none:'Sin datos'};
function kpiFor(pid, R){
  const inR = f => f && f>=R.from && f<=R.to;
  const mine = myStudents(pid); const studs = S.data.students.filter(s=>mine.has(s.id));
  const ses = S.data.students.flatMap(s=>(s.sesiones||[]).filter(x=>x.profesional===pid && inR(x.fecha)));
  const real = ses.filter(x=>x.estado==='Realizada');
  const agendadas = ses.filter(x=>x.estado!=='Programada' || diffDays(x.fecha)<0);
  const refs = (S.data.refSesiones||[]).filter(r=>inR(r.fecha) && (r.profesional||grp(r.gid)?.profesional)===pid);
  const minDir = real.reduce((t,x)=>t+(+x.duracion||0),0) + refs.reduce((t,r)=>t+(+(r.duracion||grp(r.gid)?.duracion)||0),0);
  const calidad = real.filter(x=>x.objetivo!=='' && x.objetivo!=null && x.respuesta).length;
  const coms = S.data.students.flatMap(s=>(s.comunicaciones||[]).filter(c=>c.profesional===pid && inR(c.fecha)));
  const comOk = coms.filter(c=>ACUSE_OK.includes(c.respuesta)).length;
  const resp = studs.length ? Math.round(studs.reduce((t,s)=>t+respaldo(s).pct,0)/studs.length) : null;
  const adap = S.data.students.flatMap(s=>(s.adaptadas||[]).filter(x=>x.adaptadaPor===pid && inR(x.fecha) && x.estado==='Aplicada'));
  const adapOk = adap.filter(x=>x.cumplimiento==='Se aplicó según lo acordado').length;
  const porAdaptar = S.data.students.flatMap(s=>(s.adaptadas||[]).filter(x=>x.adaptadaPor===pid && x.estado==='Por adaptar' && diffDays(x.fecha)<=3)).length;
  const decs = studs.flatMap(s=>(s.dec||[]).filter(x=>inR(x.fecha)));
  const decAn = decs.filter(x=>x.analisis).length;
  const weeks = [1,2,3,4].map(i=>addDays(monday(D(0)), -7*i));
  const bitOk = weeks.filter(w=>bitRec(pid,w)?.estado==='Cerrada').length;
  const W = weekSummary(pid, monday(D(0)));
  const horasPct = W.contr ? Math.round(W.total/60/W.contr*100) : null;
  const G = (S.data.grupos||[]).filter(g=>g.profesional===pid);
  const gst = G.flatMap(g=>gEst(g).map(e=>gStats(g,e.id,R.from,R.to)));
  const gTot = gst.reduce((t,x)=>t+x.tot,0), gP = gst.reduce((t,x)=>t+x.P,0);
  const RR = (S.data.reuniones||[]).filter(r=>r.estado==='Realizada' && inR(r.fecha));
  const reuPct = pctOf(RR.filter(r=>(r.asistentes||[]).includes(pid)).length, RR.length);
  const ACU = acuerdosDe(pid).filter(a=>a.r.estado==='Realizada'); const acuDue = ACU.filter(a=>a.estado==='Cumplido' || (a.plazo && diffDays(a.plazo)<0));
  const acuPct = pctOf(ACU.filter(a=>a.estado==='Cumplido').length, acuDue.length);
  const {al, T} = myTasks(pid, mine);
  const urg = al.filter(a=>a.lvl==='crit').length + T.filter(t=>t.lvl==='crit').length;
  const pend = al.filter(a=>a.lvl!=='info').length + T.filter(t=>t.lvl!=='info').length;
  return {pid, mine, studs, real:real.length, minDir, agendaPct:pctOf(real.length, agendadas.length), agendadas:agendadas.length,
    calidadPct:pctOf(calidad, real.length), coms:coms.length, comPct:pctOf(comOk, coms.length), resp,
    adap:adap.length, adapPct:pctOf(adapOk, adap.length), porAdaptar, decs:decs.length, decPct:pctOf(decAn, decs.length),
    bitOk, horasPct, W, reuPct, reuN:RR.length, acuPct, acuN:ACU.length, acuOk:ACU.filter(a=>a.estado==='Cumplido').length, refPct:pctOf(gP, gTot), grupos:G.length, urg, pend, al, T};
}
function weeklySeries(pid){
  return [7,6,5,4,3,2,1,0].map(i=>{ const mon = addDays(monday(D(0)), -7*i); const W = weekSummary(pid, mon); return {mon, min:W.dir, n:W.auto.filter(a=>a.directa).length}; });
}

function autRecs(s, k){ return (s.autorizaciones||[]).filter(x=>x.tipo===k).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha))); }
function autVigente(x, en){
  if(!x || x.decision==='No autoriza') return false;
  const f = en || D(0);
  if(x.fecha > f) return false;
  if(x.revocada && (!x.fechaRevocacion || x.fechaRevocacion <= f)) return false;
  if(x.vigencia!=='Hasta que la familia la revoque' && String(x.fecha).slice(0,4) !== String(f).slice(0,4)) return false;
  return true;
}
function autState(s, k, en){
  const L = autRecs(s, k).filter(x=>!en || x.fecha<=en); const x = L[0];
  if(!x) return {st:'none', lbl:'Sin registrar', x:null};
  if(x.revocada && (!x.fechaRevocacion || x.fechaRevocacion <= (en||D(0)))) return {st:'crit', lbl:'Revocada', x};
  if(x.decision==='No autoriza') return {st:'crit', lbl:'No autoriza', x};
  if(!autVigente(x, en)) return {st:'warn', lbl:'Vencida', x};
  return {st:'ok', lbl: x.decision==='Autoriza con condiciones' ? 'Vigente con condiciones' : 'Vigente', x};
}
const needsCont = s => !!(teaDate(s) || s.paec?.fechaElaboracion);
function autAlerts(s){
  const out = []; const push = (lvl,t,d) => out.push({lvl, t, d, tab:'autorizaciones', sid:s.id, nombre:s.nombre});
  const ing = autState(s,'ingreso');
  if(ing.st==='none') push('warn','Falta la autorización de ingreso a la unidad','Imprime el formulario y regístralo firmado por el apoderado.');
  else if(ing.st==='warn') push('warn','Autorización de ingreso vencida', `La última es del ${fmt(ing.x.fecha)}. Renuévala para este año escolar.`);
  else if(ing.st==='crit') push('crit', ing.lbl==='Revocada' ? 'La familia revocó el ingreso a la unidad' : 'La familia no autorizó el ingreso a la unidad', 'Solo corresponden los apoyos generales del aula. Revisa con la coordinación las sesiones y registros vigentes.');
  const propias = (s.evaluaciones||[]).filter(e=>e.tipo!=='Informe externo recibido');
  const sinAut = propias.filter(e=>!autRecs(s,'evaluacion').some(a=>a.decision!=='No autoriza' && a.fecha<=e.fecha && autVigente(a, e.fecha)));
  if(sinAut.length) push('warn', sinAut.length===1 ? 'Evaluación sin autorización previa de la familia' : `${sinAut.length} evaluaciones sin autorización previa`, 'Evaluación del '+sinAut.map(e=>fmt(e.fecha)).join(', ')+'. Registra la autorización firmada antes de evaluar.');
  const ev = autState(s,'evaluacion'); if(ev.st==='crit') push('crit', 'La familia no autorizó evaluar al estudiante', 'No se deben aplicar evaluaciones propias de la unidad sin una nueva autorización.');
  const co = autState(s,'contencion');
  if(needsCont(s) && co.st==='none') push('info','Sin consentimiento informado sobre contención física','Recomendado para estudiantes con PAEC: informa el protocolo y registra la decisión de la familia.');
  if(co.x && !co.x.informadoProtocolo && co.st!=='none') push('warn','Contención física: falta registrar que se explicó el protocolo','Marca que se informó a la familia en qué casos procede según el Reglamento Interno.');
  (s.dec||[]).filter(x=>x.contencion).forEach(x=>{
    const c = autState(s,'contencion', x.fecha);
    if(c.st==='crit') push('crit','Contención física sin autorización de la familia', `Episodio del ${fmt(x.fecha)}: la familia no la había autorizado. Revisar con dirección, dejar constancia del riesgo que la justificó e informar a la familia.`);
    else if(c.st!=='ok') push('warn','Contención física sin consentimiento informado vigente', `Episodio del ${fmt(x.fecha)}: registra el riesgo que la justificó, confirma el aviso a la familia y regulariza el consentimiento.`);
  });
  return out;
}

  const it = String(o.item||''); const x = it.startsWith('blank:') ? null : (s.autorizaciones||[]).find(a=>a.id===it);
  const k = x ? x.tipo : it.slice(6); const A = AUT[k] || AUT.ingreso;
  const ap = (s.apoderados||[]).find(a=>a.tipo==='Titular') || (s.apoderados||[])[0] || {};
  const L = (v, w) => v ? `<b>${esc(v)}</b>` : `<span class="line" style="min-width:${w||180}px">&nbsp;</span>`;
  const chk = (on, txt) => `<div class="opt"><i>${on?'✓':''}</i><span>${txt}</span></div>`;
  const E = S.data.estab; const coord = S.data.equipo.find(p=>isCoord(p.id));
  const title = k==='contencion' ? 'Consentimiento informado sobre contención física en situaciones de riesgo' : 'Autorización de '+(k==='ingreso'?'ingreso a la Unidad de Apoyo al Aprendizaje':'evaluación del estudiante');
  let h = rHead(title, x ? `Registro de la decisión de la familia · ${fmt(x.fecha)}` : 'Formulario para firma del apoderado', meta);
  h += `<h2>Identificación</h2>${rkv([['Estudiante', s.nombre],['RUN', s.rut],['Curso', cursoOf(s)],['Fecha de nacimiento', s.fnac?fmt(s.fnac):''],['Profesional referente', profName(s.referente)]])}`;
  h += `<div class="aut-txt"><p>Yo, ${L(x?.firmante||ap.nombre, 220)}, RUN ${L(x?.rutFirmante, 110)}, en calidad de ${L(x?.parentesco||ap.parentesco, 110)} del estudiante individualizado, declaro haber recibido la siguiente información de parte de ${esc(E.nombre)} y manifiesto mi decisión:</p></div>`;
  const dec = v => x ? x.decision===v : false;
  if(k==='ingreso'){
    h += `<h2>Qué es la Unidad de Apoyo al Aprendizaje</h2><div class="aut-txt"><p>Es un servicio de apoyo propio del establecimiento, que no corresponde al Programa de Integración Escolar (Decreto 170/2009). Su propósito es acompañar el aprendizaje, la participación y el bienestar de estudiantes que requieren apoyos adicionales, en coordinación con la familia y los docentes.</p><p>El trabajo de la unidad puede incluir:</p></div>`;
    h += AUT_APOYOS.map(a=>chk(x ? (x.apoyos||[]).includes(a) : false, esc(a))).join('');
    h += `<div class="aut-txt"><p>Las evaluaciones y la contención física en situaciones de riesgo requieren autorizaciones separadas.</p></div>`;
    h += `<h2>Tratamiento de datos personales y de salud</h2><div class="aut-txt"><p>Para planificar y entregar los apoyos, la unidad registrará datos personales y de salud del estudiante (diagnósticos, informes, evaluaciones y registros de intervención). Estos datos son sensibles según la Ley 19.628, reformada por la Ley 21.719. Solo los conocerá el equipo de la unidad y los docentes que lo requieran para aplicar los apoyos; la dirección del colegio solo recibe información agregada, sin identificar a los estudiantes. Se guardan con acceso restringido mientras el estudiante pertenezca al colegio y por el plazo que exija la normativa.</p><p>La familia puede solicitar por escrito a la coordinación de la unidad el acceso, la rectificación o la supresión de estos datos, u oponerse a su tratamiento.</p></div>`;
    h += `<h2>Decisión de la familia</h2>` + chk(dec('Autoriza')||dec('Autoriza con condiciones'), '<b>Autorizo</b> el ingreso del estudiante a la Unidad de Apoyo al Aprendizaje.') + chk(dec('No autoriza'), '<b>No autorizo</b> el ingreso del estudiante a la unidad.') + chk(x?.datos, 'Autorizo el tratamiento de los datos personales y de salud del estudiante para los fines descritos.') + chk(x?.salud, `Autorizo intercambiar información con los profesionales de salud tratantes: ${L(x?.saludDetalle, 240)}`);
  } else if(k==='evaluacion'){
    h += `<h2>Evaluación que se propone</h2><div class="aut-txt"><p>El objetivo es conocer las fortalezas y necesidades de apoyo del estudiante para planificar las ayudas que requiere. La evaluación no constituye un diagnóstico médico.</p></div>`;
    h += AUT_EVALS.map(a=>chk(x ? (x.evaluaciones||[]).includes(a) : false, 'Evaluación '+esc(a.toLowerCase()))).join('');
    h += `<h3>Motivo</h3><div class="box">${esc(x?.motivo||'')}</div><h3>Profesionales que evaluarán</h3><div class="box" style="min-height:28px">${esc(x?.profesionales||'')}</div>`;
    h += `<div class="aut-txt"><p>La evaluación se realiza durante la jornada escolar y puede incluir pruebas estandarizadas o informales, observación en aula, revisión de trabajos y entrevistas con docentes y con la familia. La familia recibirá una devolución de los resultados por escrito, en entrevista, dentro de los 15 días siguientes a su término (Decreto 67/2018, art. 18).</p></div>`;
    h += `<h2>Decisión de la familia</h2>` + chk(dec('Autoriza')||dec('Autoriza con condiciones'), '<b>Autorizo</b> la evaluación del estudiante en los términos descritos.') + chk(dec('No autoriza'), '<b>No autorizo</b> la evaluación del estudiante.');
  } else {
    h += `<h2>Qué establece el Reglamento Interno</h2><div class="aut-txt"><p>El Protocolo de Desregulación Emocional y Conductual del Reglamento Interno establece que la contención física, entendida como una restricción de movimiento tutelada, procede únicamente en casos de extremo riesgo para el estudiante o para otras personas de la comunidad educativa, cuando pueda evitar daños a su integridad física o a la de terceros. No es una medida disciplinaria ni de uso habitual, y no reemplaza los apoyos del Plan de Acompañamiento Emocional y Conductual (PAEC).</p></div>`;
    h += `<h2>Compromisos del colegio si fuera necesaria</h2><ul><li>Se usará solo cuando las etapas anteriores del protocolo no hayan sido suficientes y exista un riesgo inminente.</li><li>La realizará personal del establecimiento, en lo posible dos adultos, con el menor contacto y por el menor tiempo posibles, sin maniobras que causen dolor ni comprometan la respiración.</li><li>Se suspenderá apenas cese el riesgo y se acompañará al estudiante hasta que recupere la calma.</li><li>Se informará a la familia de inmediato por la vía acordada y, a más tardar, al término de la jornada, dejando constancia de la hora y de la persona contactada.</li><li>Se registrará en la bitácora del episodio, se activará el protocolo de accidentes escolares cuando corresponda y se revisará el PAEC junto a la familia.</li></ul>`;
    h += `<h2>Información que entrega la familia</h2><h3>Condiciones de salud, sensoriales o experiencias previas a considerar</h3><div class="box">${esc(x?.contraindicaciones||'')}</div><h3>Lo que ayuda a calmarlo y formas de contacto que acepta</h3><div class="box">${esc(x?.calma||'')}</div><h3>Formas de contacto o maniobras que se deben evitar</h3><div class="box">${esc(x?.evitar||'')}</div><h3>A quién avisar de inmediato y por qué medio</h3><div class="box" style="min-height:28px">${esc(x?.aviso||'')}</div>`;
    h += `<h2>Decisión de la familia</h2>` + chk(x?.informadoProtocolo, 'Declaro que se me explicó el protocolo y en qué casos procede la contención física.') + chk(dec('Autoriza')||dec('Autoriza con condiciones'), '<b>Autorizo</b> la contención física del estudiante solo en las condiciones descritas.') + chk(dec('No autoriza'), '<b>No autorizo</b> la contención física. Solicito que se me contacte de inmediato ante una situación de riesgo.');
    h += `<p class="note">Aun sin autorización, el colegio mantiene su deber de proteger la vida y la integridad del estudiante y de las demás personas ante un peligro inminente. Si llegara a ser necesario, se informará de inmediato a la familia.</p>`;
  }
  h += `<h3>Condiciones u observaciones de la familia</h3><div class="box">${esc(x?.condiciones||'')}</div>`;
  h += `<h2>Vigencia y revocación</h2><div class="aut-txt"><p>${x?.vigencia==='Hasta que la familia la revoque' ? 'Esta decisión se mantiene vigente hasta que la familia la revoque.' : 'Esta decisión rige durante el año escolar en curso y se renueva cada año.'} La familia puede revocarla en cualquier momento, por escrito, ante la coordinación de la unidad. Revocarla o no autorizar no afecta los derechos del estudiante ni su permanencia en el colegio, y se mantienen los apoyos generales del aula (Decreto 83/2015).</p></div>`;
  h += `<p>Fecha: ${L(x?fmt(x.fecha):'', 140)}</p>`;
  h += signs([[x?.firmante||ap.nombre||'','Apoderado/a · firma y RUN'],[x?.recibe?profName(x.recibe):'','Profesional que recibe'],[coord?coord.nombre:'','Coordinación UAA']]);
  return `<div class="rpt">${h}${rFoot(meta)}</div>`;
}

function vAgenda(){
  const all = S.data.students.flatMap(s=>(s.sesiones||[]).map(x=>({...x, s}))).filter(x=>!S.fprof || x.profesional===S.fprof);
  const start = new Date(TODAY); const wd = (start.getDay()+6)%7; start.setDate(start.getDate()-wd-7);
  const days = Array.from({length:28},(_,i)=>{ const d = new Date(start); d.setDate(d.getDate()+i); return isoOf(d); });
  const count = f => all.filter(x=>x.fecha===f).length;
  let rows;
  if(S.fday) rows = all.filter(x=>x.fecha===S.fday);
  else rows = all.filter(x=>{ const d = diffDays(x.fecha); return S.frange==='proximas' ? d>=0 : S.frange==='pasadas' ? (d<0 && d>=-30) : true; });
  rows.sort((a,b)=> (S.frange==='pasadas'&&!S.fday) ? (b.fecha+(b.hora||'')).localeCompare(a.fecha+(a.hora||'')) : (a.fecha+(a.hora||'')).localeCompare(b.fecha+(b.hora||'')));
  const byDay = []; rows.forEach(x=>{ let g = byDay.find(g=>g.f===x.fecha); if(!g){ g = {f:x.fecha, items:[]}; byDay.push(g); } g.items.push(x); });
  const monthLbl = TODAY.toLocaleDateString('es-CL',{month:'long', year:'numeric'});
  return `${demoBanner()}<header class="pagehead"><div><p class="eyebrow">${cap(monthLbl)}</p><h1>Agenda del <b>equipo</b></h1></div><div class="actions"><select id="fprof" class="selpill" aria-label="Profesional"><option value="">Todo el equipo</option>${S.data.equipo.map(p=>`<option value="${p.id}" ${S.fprof===p.id?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select><button class="btn primary" data-act="new-session">${ic('plus')} Nueva sesión</button></div></header>
  <section class="glass card" style="margin-bottom:18px"><header><h2>Calendario</h2>${S.fday?`<button class="btn sm" data-act="day" data-d="">${ic('x','sm')} Quitar filtro de día</button>`:''}</header>
  <div class="days" id="daystrip">${days.map(f=>{ const d = parse(f), n = count(f); return `<button class="daypill ${f===isoOf(TODAY)?'today':''}" data-act="day" data-d="${f}" aria-pressed="${S.fday===f}" ${f===isoOf(TODAY)?'id="today-pill"':''}><small>${d.toLocaleDateString('es-CL',{weekday:'short'}).replace('.','')}</small><b>${d.getDate()}</b><span class="dots">${'<i></i>'.repeat(Math.min(n,3))}</span></button>`; }).join('')}</div></section>
  <section class="glass card"><header><h2>${S.fday?'Línea de tiempo':'Sesiones'}</h2>${S.fday?`<span class="chip">${cap(parse(S.fday).toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'}))}</span>`:`<div class="seg"><button aria-selected="${S.frange==='proximas'}" data-act="range" data-r="proximas">Próximas</button><button aria-selected="${S.frange==='pasadas'}" data-act="range" data-r="pasadas">Últimos 30 días</button><button aria-selected="${S.frange==='todas'}" data-act="range" data-r="todas">Todas</button></div>`}</header>
  ${byDay.length?`<div class="timeline">${byDay.map(g=>`<div class="tday">${S.fday?'':`<h3>${relDay(g.f)} · ${parse(g.f).toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'short'})}</h3>`}${g.items.map(x=>`<div class="tslot"><span class="h">${esc(x.hora||'—')}</span><div class="tchip"><span class="icw ${AREA_AV(x.s.nombre)}">${initials(x.s.nombre)}</span><div class="main"><button class="t" data-act="open" data-sid="${x.s.id}" data-tab="sesiones">${esc(x.s.nombre)}</button><div class="d">${esc(x.modalidad||'Sesión')} · ${esc(profName(x.profesional))}${x.duracion?' · '+esc(x.duracion)+' min':''}</div></div><span class="pill ${estadoCls(x.estado)}">${esc(x.estado||'—')}</span>${x.estado==='Programada'?`<button class="btn sm" data-act="mark-done" data-sid="${x.s.id}" data-id="${x.id}">${ic('check','sm')} Realizada</button>`:''}</div></div>`).join('')}</div>`).join('')}</div>`:'<p class="empty">No hay sesiones en este período.</p>'}</section>`;
}

function vNormativa(){
  const N = [
    {code:'Ley 21.545 · Circular SIE 586/2023', t:'Ley TEA', li:['PAEC anual, individual y específico para cada estudiante autista, elaborado con la familia.','Protocolo de respuesta ante desregulaciones incluido en el Reglamento Interno.','No se sancionan conductas asociadas a la condición sin haber aplicado antes los apoyos del plan.','Capacitación de todo el personal al menos una vez al año, y circular a las familias en los dos primeros meses del año escolar.'], app:'Módulo PAEC, alerta de plazo de dos semanas desde que el colegio recibe el diagnóstico y Registro DEC con aviso cuando la familia no ha sido informada.', link:['Implementación Ley 21.545 · Mineduc','https://especial.mineduc.cl/implementacion-ley-n21-545/']},
    {code:'Orientaciones Mineduc · abril 2025', t:'Estructura del PAEC', li:['Identificación del estudiante (nombre civil y social), apoderados y contactos de emergencia.','Equipo de apoyo con roles y responsabilidades.','Eje preventivo: apoyos, intereses, experiencias de disfrute, habilidades a desarrollar.','Eje reactivo: gatillantes, señales tempranas, formas de malestar, resguardo y respuestas.','Fechas de elaboración y revisión, y firmas del equipo de gestión y la familia (suplente con poder simple).','Documento confidencial. Se recomienda usarlo también con estudiantes no autistas que lo necesiten.'], app:'El formulario PAEC sigue estos apartados y agrega una respuesta por etapa del protocolo DEC.', link:['Orientaciones PAEC (PDF)','https://especial.mineduc.cl/wp-content/uploads/sites/31/2025/05/Orientaciones-PAECOK.pdf']},
    {code:'Decreto 83/2015', t:'Diversificación de la enseñanza', li:['Criterios de adecuación curricular para educación parvularia y básica.','Adecuaciones de acceso: presentación de la información, formas de respuesta, entorno, organización del tiempo.','Adecuaciones en objetivos: graduación, priorización, temporalización, enriquecimiento, eliminación.','Las decisiones se registran en un PACI.'], app:'Módulo PACI con los tipos de adecuación del decreto y justificación por asignatura.'},
    {code:'Decreto 67/2018', t:'Evaluación, calificación y promoción', li:['Los estudiantes con adecuaciones se evalúan según lo establecido en su PACI.','El reglamento de evaluación del colegio debe recoger la diversificación.'], app:'Sección de evaluación y promoción dentro del PACI.'},
    {code:'Decreto 170/2009', t:'Programa de Integración Escolar', li:['Regula la subvención de educación especial y el PIE, con sus formularios (FUDEI) y plazos.','Como la unidad no funciona bajo PIE, este decreto no rige su operación. El PAI se usa como buena práctica de planificación.'], app:'La app no genera formularios PIE. Si en el futuro se postula a PIE, habría que agregar ese módulo.'},
    {code:'Ley 19.628 reformada por Ley 21.719', t:'Protección de datos personales', li:['Los datos de salud de niñas, niños y adolescentes son datos sensibles y requieren autorización de padres o tutores.','Plena vigencia prevista para el 1 de diciembre de 2026. Hay un proyecto en el Senado que propone postergarla a 2027.','Exige medidas de seguridad, acceso restringido y responder solicitudes de acceso o rectificación.'], app:'Registro de autorización en la anamnesis y en el PAEC, con alerta si falta. Este prototipo guarda los datos solo en el navegador; la versión real necesita usuarios, permisos por rol, cifrado y respaldo en servidor.'},
    {code:'Información a la familia', t:'Qué debe recibir la familia y cuándo', li:['Al ingresar: autorización escrita para tratar datos personales y de salud, y para evaluar.','Tras cada evaluación: devolución de resultados con acta (Decreto 67, art. 18 m; plazo interno sugerido de 15 días).','Estudiantes autistas: circular sobre la Ley TEA en los dos primeros meses del año, y PAEC entregado y firmado dentro de dos semanas desde el diagnóstico (Circular 586).','Cada modificación del PAEC, PAI o PACI: informarla y dejar acuse.','Cada episodio de desregulación: aviso el mismo día y entrevista de seguimiento según el Reglamento Interno.','Al cierre de cada semestre: informe de avance (Decreto 67, art. 18 m).','Promoción o repitencia: considerar la visión de la familia; las medidas de acompañamiento requieren su autorización (Decreto 67, arts. 11 y 12).'], app:'La pestaña Familia de cada estudiante calcula estas entregas, sus plazos y si tienen acuse. Las vencidas aparecen como alertas.', wide:1},
    {code:'Evidencia', t:'Qué evidencia conviene conservar', li:['Actas de entrevista firmadas por la familia, con fecha, asistentes, temas y acuerdos.','Citaciones enviadas aunque la familia no asista, y los intentos de contacto telefónico.','Si el apoderado se niega a firmar: dejar constancia con un testigo del colegio.','Registro de cada sesión con objetivo trabajado y respuesta del estudiante.','Registro de cada episodio DEC: gatillante, etapa, adultos que intervinieron, medidas y aviso a la familia.','Informes emitidos con folio, y la copia firmada que devuelve la familia.'], app:'Cada registro guarda quién lo creó y cuándo. Los informes llevan folio y quedan anotados en la ficha. El expediente reúne todo en un solo documento.', wide:1},
    {code:'Ley 20.845 · Ley 20.422', t:'Inclusión escolar y no discriminación', li:['Prohíben discriminar por condición o discapacidad y obligan a realizar ajustes razonables.','Las medidas como reducción de jornada o salida anticipada permanente no pueden usarse para excluir.'], app:'Referencia para los acuerdos del PAEC y del PAI.', wide:1}
  ];
  return `<header class="pagehead"><div><p class="eyebrow">Marco normativo considerado</p><h1>Normativa <b>vigente</b></h1></div></header>
  <p class="muted" style="max-width:70ch;margin:-8px 0 18px">Resumen de las normas que ordenan cada módulo. Revisa siempre el texto oficial y las actualizaciones de la Superintendencia de Educación antes de aplicarlas al Reglamento Interno.</p>

}

function openForm(o){ S.form = {err:null, ...o}; render(); const el = document.querySelector(o.where==='modal' ? '#modal input, #modal select, #modal textarea' : '#tabbody input, #tabbody select, #tabbody textarea'); if(el) el.focus({preventScroll: o.where!=='modal'}); }
function saveForm(){
  const f = S.form, sch = SCHEMA[f.schema], d = f.draft;
  const miss = missingReq(sch, d); if(miss.length){ f.err = miss; render(); return; }
  const s = f.sid ? stu(f.sid) : null;
  switch(f.kind){
    case 'student': if(f.isNew){ const id = uid(); S.data.students.push(stamp({id, sesiones:[], dec:[], evaluaciones:[], comunicaciones:[], ...d}, true)); S.sid = id; S.view = 'ficha'; S.tab = 'resumen'; logEv(id,'Creó','Ficha del estudiante'); } else { Object.assign(s, stamp(d)); logEv(s.id,'Editó','Datos del estudiante'); } break;

/* ================= Versión compartida: Supabase + inicio de sesión con Google ================= */
const CFG = window.UAA_CONFIG || {};
const LOCAL_KEYS = ['usuario','guiaOculta','guiaHecha','log','folio','students'];
const COLL_KEYS = ['bitacora','grupos','refSesiones','reuniones','inst'];
const TEAM_ROLES = ['coordinacion','profesional'];
let sb = null;
const C = {rows:{}, dirty:new Set(), saving:false, timer:null, perfil:null, sent:new WeakSet(), ready:false, status:'ok', warned:false};
S.cloud = true;

/* ---- reparto de los datos en filas ---- */
function splitData(d){
  const out = {core:{}};
  Object.keys(d).forEach(k=>{ if(!LOCAL_KEYS.includes(k) && !COLL_KEYS.includes(k)) out.core[k] = d[k]; });
  COLL_KEYS.forEach(k=>{ out[k] = d[k] ?? (k==='inst' ? {} : []); });
  (d.students||[]).forEach(s=>{ out['st:'+s.id] = s; });
  return out;
}
function applyRow(k, data){
  if(k==='dir_snapshot'){ S.snap = data; return; }
  if(k==='core'){ Object.keys(data||{}).forEach(x=>{ if(!LOCAL_KEYS.includes(x)) S.data[x] = data[x]; }); return; }
  if(COLL_KEYS.includes(k)){ S.data[k] = data ?? (k==='inst' ? {} : []); return; }
  if(k.startsWith('st:')){ const id = k.slice(3), L = S.data.students, i = L.findIndex(s=>s.id===id);
    if(data==null){ if(i>=0) L.splice(i,1); if(S.sid===id && S.view==='ficha'){ S.view = 'estudiantes'; } }
    else if(i>=0) L[i] = data; else L.push(data); }
}
const myRol = () => C.perfil?.rol;
const canWrite = k => myRol()==='coordinacion' || (myRol()==='profesional' && k!=='core');
const isTeam = () => TEAM_ROLES.includes(myRol());

/* ---- combinación de cambios simultáneos ---- */
function mergeVal(r, l){
  if(Array.isArray(r) && Array.isArray(l)){
    const byId = a => a.every(x=>x && typeof x==='object' && x.id);
    if(byId(r) && byId(l)){ const m = new Map(); r.forEach(x=>m.set(x.id, x)); l.forEach(x=>{ const o = m.get(x.id); m.set(x.id, o ? mergeVal(o, x) : x); }); return [...m.values()]; }
    return l;
  }
  if(r && l && typeof r==='object' && typeof l==='object'){
    const newer = String(l._mod||'') >= String(r._mod||'') ? l : r; const out = {};
    new Set([...Object.keys(r), ...Object.keys(l)]).forEach(k=>{ const a = r[k], b = l[k];
      out[k] = (a && b && typeof a==='object' && typeof b==='object') ? mergeVal(a, b) : (k in newer ? newer[k] : (b !== undefined ? b : a)); });
    return out;
  }
  return l;
}

/* ---- resumen anónimo para Dirección ---- */
function computeSnap(){
  const keep = S.kper; const p = {};
  ['semana','mes','anio'].forEach(x=>{ S.kper = x; p[x] = _dirDataC(kpiRange()); });
  S.kper = keep; return {p, inst: _instItemsC().map(i=>({t:i.t, norma:i.norma, st:i.st, d:i.d, id:i.id}))};
}

/* ---- guardado ---- */
function cloudPersist(){
  savePrefs();
  if(!C.ready) return;
  const parts = splitData(S.data);
  if(isTeam()){ try{ parts.dir_snapshot = computeSnap(); }catch(e){ console.warn('resumen', e); } }
  Object.entries(parts).forEach(([k, v])=>{ const j = JSON.stringify(v); if(C.rows[k]?.json === j) return; if(canWrite(k)) C.dirty.add(k); });
  if(myRol()==='coordinacion') Object.keys(C.rows).filter(k=>k.startsWith('st:') && !(k in parts)).forEach(k=>C.dirty.add(k));
  schedule(300);
}
function schedule(ms){ clearTimeout(C.timer); C.timer = setTimeout(flush, ms); if(C.dirty.size) setStatus('saving'); }
async function flush(){
  if(C.saving) return schedule(400);
  C.saving = true;
  try{
    const nl = (S.data.log||[]).filter(l=>!C.sent.has(l));
    for(let i=0; i<nl.length; i+=400){ const chunk = nl.slice(i, i+400);
      const {error} = await sb.from('auditoria').insert(chunk.map(l=>({sid:l.sid||null, accion:String(l.accion||''), detalle:String(l.detalle||''), ts_cliente:l.ts||null})));
      if(error) throw error; chunk.forEach(l=>C.sent.add(l)); }
    const parts = splitData(S.data); if(isTeam()){ try{ parts.dir_snapshot = computeSnap(); }catch(e){} }
    for(const k of [...C.dirty]) await saveKey(k, parts);
    setStatus(C.dirty.size ? 'saving' : 'ok');
  }catch(e){ console.error(e); setStatus('error'); C.saving = false; return schedule(8000); }
  C.saving = false; if(C.dirty.size) schedule(300);
}
async function saveKey(k, parts){
  const cur = parts[k], row = C.rows[k];
  if(cur === undefined){
    if(row){ const {error} = await sb.from('app_data').delete().eq('key', k); if(error) throw error; delete C.rows[k]; }
    C.dirty.delete(k); return;
  }
  const json = JSON.stringify(cur);
  if(row && row.json === json){ C.dirty.delete(k); return; }
  if(!row){
    const {data, error} = await sb.from('app_data').insert({key:k, data:cur}).select('version').single();
    if(error){ if(error.code==='23505') return resolveConflict(k); if(error.code==='42501') return denied(k); throw error; }
    C.rows[k] = {version:data.version, json}; C.dirty.delete(k); return;
  }
  const {data, error} = await sb.from('app_data').update({data:cur, version:row.version+1}).eq('key', k).eq('version', row.version).select('version');
  if(error){ if(error.code==='42501') return denied(k); if(error.code==='40001') return resolveConflict(k); throw error; }
  if(!data.length) return resolveConflict(k);
  C.rows[k] = {version:data[0].version, json}; C.dirty.delete(k);
}
async function resolveConflict(k){
  const {data, error} = await sb.from('app_data').select('data,version').eq('key', k).maybeSingle();
  if(error) throw error;
  if(!data){ // otra persona lo eliminó
    if(k.startsWith('st:')){ applyRow(k, null); delete C.rows[k]; C.dirty.delete(k); toast('La coordinación eliminó este estudiante. Se quitó de tu vista.', true); refreshSoon(); return; }
    delete C.rows[k]; return; }
  if(C.rows[k] && C.rows[k].version === data.version) return denied(k);
  const local = splitData(S.data)[k];
  C.rows[k] = {version:data.version, json:JSON.stringify(data.data)};
  if(k==='dir_snapshot') return; // se recalcula en el siguiente guardado
  applyRow(k, local === undefined ? data.data : mergeVal(data.data, local));
  toast('Otro integrante editó lo mismo al mismo tiempo. Se combinaron ambos cambios.');
  refreshSoon();
}
function denied(k){
  C.dirty.delete(k);
  sb.from('app_data').select('data,version').eq('key', k).maybeSingle().then(({data})=>{ if(data){ C.rows[k] = {version:data.version, json:JSON.stringify(data.data)}; applyRow(k, data.data); } else { delete C.rows[k]; applyRow(k, null); } refreshSoon(); });
  toast('Tu perfil no tiene permiso para modificar esto. Se restauró la versión guardada.', true);
}
function setStatus(s){ C.status = s; const el = document.getElementById('syncst'); if(el) el.outerHTML = syncChip(); }
const SYNC_TXT = {ok:['Guardado','check'], saving:['Guardando…','clock'], error:['Sin conexión, reintentando','alert']};
const syncChip = () => { const [t, i] = SYNC_TXT[C.status]; return `<span id="syncst" class="syncst st-${C.status}" role="status" title="${t}">${ic(i,'sm')}<span>${t}</span></span>`; };
window.addEventListener('beforeunload', e=>{ if(C.dirty.size || C.saving){ e.preventDefault(); e.returnValue = ''; } });

/* ---- cambios de otros integrantes en tiempo real ---- */
function onRemote(p){
  const k = p.new?.key || p.old?.key; if(!k || C.dirty.has(k)) return;
  if(p.eventType==='DELETE'){ if(!C.rows[k]) return; delete C.rows[k]; applyRow(k, null); }
  else { const v = p.new.version; if(C.rows[k] && C.rows[k].version >= v) return; C.rows[k] = {version:v, json:JSON.stringify(p.new.data)}; applyRow(k, p.new.data); if(k==='dir_snapshot') C.snapTs = p.new.updated_at; }
  refreshSoon();
}
let refT; function refreshSoon(){ clearTimeout(refT); refT = setTimeout(()=>{ if(S.form || S.modal || S.rep || S.an) return; keepScroll(render); }, 250); }

/* ---- preferencias locales de cada persona (no sensibles) ---- */
const prefKey = () => 'uaa-pref-'+(C.perfil?.email||'');
function savePrefs(){ try{ localStorage.setItem(prefKey(), JSON.stringify({guiaOculta:S.data.guiaOculta, guiaHecha:S.data.guiaHecha})); }catch(e){} }
function loadPrefs(){ try{ return JSON.parse(localStorage.getItem(prefKey())||'{}'); }catch(e){ return {}; } }

/* ---- ajustes sobre los módulos existentes ---- */
persist = cloudPersist;
const _migrateC = migrate;
migrate = function(){ _migrateC(); if(C.perfil) S.data.usuario = C.perfil.equipo_id; S.data.demo = false; };
const _dirDataC = dirData;
dirData = function(R){ return (isDir(S.data.usuario) && !S.data.students.length) ? (S.snap?.p?.[R.p] || EMPTY_DIR) : _dirDataC(R); };
const EMPTY_DIR = {nSt:0, critN:0, warnN:0, cats:{}, inst:[], instLate:0, instPart:0, status:'ok', tea:0, real:0, minDir:0, agendaPct:null, resp:null, decs:0, decInf:null, decAn:null, reu:0, acuPct:null, team:[]};
const _instItemsC = instItems;
instItems = function(){ return (isDir(S.data.usuario) && !S.data.students.length) ? (S.snap?.inst || []) : _instItemsC(); };
const _vDireccionC = vDireccion;
vDireccion = function(){ const h = _vDireccionC(); return C.snapTs ? h.replace('<div class="ktiles">', `<p class="small muted" style="margin:-8px 0 14px">Cifras calculadas con el último registro del equipo: ${esc(fmtTs(C.snapTs))}.</p><div class="ktiles">`) : h; };
const _emitC = emitReport;
emitReport = async function(mode){
  try{ const {data, error} = await sb.rpc('siguiente_folio'); if(error) throw error; S.data.folio = Number(data) - 1; }
  catch(e){ toast('No se pudo asignar el folio. Revisa la conexión e intenta de nuevo.', true); return; }
  return _emitC(mode);
};
const _renderChromeC = renderChrome;
renderChrome = function(){ _renderChromeC(); const ta = document.getElementById('topactions'); if(ta && C.ready) ta.insertAdjacentHTML('afterbegin', syncChip()); };
const _vRespaldoC = vRespaldo;
vRespaldo = function(){
  let h = _vRespaldoC().replaceAll('Datos guardados en este navegador', 'Base de datos del colegio');
  h = h.replace(/<section class="glass card"><header><h2>Empezar de cero<\/h2>[\s\S]*?<\/section>/, '');
  h = h.replace('Reemplaza todos los datos actuales.', 'Sirve para traer los datos registrados en la versión de prueba. Reemplaza los datos actuales de la base del colegio.');
  return h;
};
SCHEMA.equipo[0].fields.push({k:'correo', l:'Correo institucional (para ingresar)', t:'text', w:2});
const _saveFormC = saveForm;
saveForm = function(){ const k = S.form?.kind; const r = _saveFormC.apply(this, arguments); if(k==='equipo') syncPerfiles(); return r; };
async function syncPerfiles(){
  if(myRol()!=='coordinacion') return;
  const rows = S.data.equipo.filter(p=>p.correo && /@/.test(p.correo)).map(p=>({email:String(p.correo).trim().toLowerCase(), nombre:p.nombre, rol:isCoord(p.id)?'coordinacion':'profesional', equipo_id:p.id, activo:true}));
  if(!rows.length) return;
  const {error} = await sb.from('perfiles').upsert(rows, {onConflict:'equipo_id'});
  if(error){ console.error(error); toast('El integrante quedó guardado, pero no se pudo habilitar su acceso: '+(error.code==='23505'?'ese correo ya está en uso.':'revisa el correo.'), true); }
  else { const k = S.form===null && rows.length; toast(rows.length===1 ? 'Acceso habilitado para '+rows[0].email : 'Accesos del equipo actualizados ('+rows.length+' correos)'); }
}

/* ---- capacidades fuera de claude.ai ---- */
function initCloudCaps(){
  S.dl = {save: async ({filename, data})=>{ const blob = new Blob([data], {type:'text/html;charset=utf-8'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500); }};
  if(!isTeam()) return;
  fetch('/api/claude').then(r=>r.ok?r.json():null).then(j=>{ if(!j?.enabled) return;
    const call = async (messages, signal) => { const {data:{session}} = await sb.auth.getSession();
      const r = await fetch('/api/claude', {method:'POST', signal, headers:{'Content-Type':'application/json', Authorization:'Bearer '+(session?.access_token||'')}, body:JSON.stringify({messages})});
      if(r.status===429) throw {code:'rate_limited'}; if(r.status===403 || r.status===401) throw {code:'not_granted'}; if(!r.ok) throw {code:'error'};
      return (await r.json()).text || ''; };
    const sm = async (turns, o={}) => { try{ const t = await call(turns, o.signal); o.onText?.({text:t}); return {text:t}; } catch(e){ if(e?.name==='AbortError') throw {code:'cancelled', text:''}; throw e; } };
    sm.json = async (prompt) => { const t = await call([{role:'user', content:prompt}]); const m = t.match(/\{[\s\S]*\}/); try{ return JSON.parse(m ? m[0] : t); }catch(e){ throw {code:'invalid_json'}; } };
    S.sm = sm; if(S.an) renderModal();
  }).catch(()=>{});
}

/* ---- sesión ---- */
(()=>{ const st = document.createElement('style'); st.textContent = `
.syncst{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:99px;font-size:.78rem;font-weight:700;background:var(--solid);color:var(--muted);margin-right:4px}
.syncst.st-ok .ic{color:var(--ok)} .syncst.st-saving .ic{color:var(--warn)} .syncst.st-error{color:var(--crit)}
@media (max-width:760px){ .syncst span{display:none} .syncst{padding:0 10px} }
.login{max-width:460px;margin:8vh auto 0;padding:28px;border-radius:28px;text-align:left}
.login h1{font-size:1.7rem;margin:6px 0 10px}
.login .gbtn{display:inline-flex;align-items:center;gap:10px;margin-top:18px}
.login .small{display:block;margin-top:14px}
body.prelogin .dock{display:none}
`; document.head.appendChild(st); })();
const G_ICON = '<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';
function screen(title, body, btns){
  document.body.classList.add('prelogin');
  document.getElementById('dock').innerHTML = ''; document.getElementById('topactions').innerHTML = '';
  document.getElementById('main').innerHTML = `<section class="glass login"><p class="eyebrow">${esc(CFG.colegio||'Colegio Particular EDUCENTER')}</p><h1>${title}</h1><p class="muted">${body}</p>${btns||''}</section>`;
}
function showLogin(msg){
  screen('Unidad de Apoyo al <b>Aprendizaje</b>', msg || `Ingresa con tu cuenta institucional${CFG.dominio?` (@${esc(CFG.dominio)})`:''}. Solo el equipo de la unidad y la dirección del colegio tienen acceso.`,
    `<button class="btn primary gbtn" data-act="cloud-login">${G_ICON} Ingresar con Google</button><span class="small muted">Los datos de los estudiantes son sensibles (Ley 19.628 y Ley 21.719). No compartas tu sesión y ciérrala al terminar en computadores compartidos.</span>`);
}
async function cloudLogin(){
  const {error} = await sb.auth.signInWithOAuth({provider:'google', options:{redirectTo: location.origin + location.pathname, queryParams:{prompt:'select_account', ...(CFG.dominio?{hd:CFG.dominio}:{})}}});
  if(error) showLogin('No se pudo iniciar sesión: '+esc(error.message));
}
async function cloudLogout(){ await sb.auth.signOut(); location.reload(); }
async function startSession(session){
  const email = String(session.user?.email||'').toLowerCase();
  if(CFG.dominio && !email.endsWith('@'+CFG.dominio.toLowerCase())){ await sb.auth.signOut(); return showLogin(`La cuenta ${esc(email)} no pertenece al colegio. Ingresa con tu correo @${esc(CFG.dominio)}.`); }
  screen('Cargando…', 'Trayendo la información de la unidad.');
  const {data:perfil, error:pe} = await sb.from('perfiles').select('*').eq('email', email).maybeSingle();
  if(pe) return screen('No se pudo conectar', 'Revisa tu conexión a internet e intenta de nuevo.', `<button class="btn primary" data-act="cloud-retry">Reintentar</button>`);
  if(!perfil || !perfil.activo) return screen('Tu cuenta aún no tiene acceso', `Ingresaste como <b>${esc(email)}</b>, pero no estás habilitado en la plataforma. Pide a la coordinación de la unidad que te agregue con este correo.`, `<button class="btn" data-act="cloud-logout">Cerrar sesión</button>`);
  C.perfil = perfil;
  const {data:rows, error:re} = await sb.from('app_data').select('key,data,version,updated_at').range(0, 9999);
  if(re) return screen('No se pudo cargar la información', esc(re.message), `<button class="btn primary" data-act="cloud-retry">Reintentar</button>`);
  const map = {}; rows.forEach(r=>{ map[r.key] = r.data; C.rows[r.key] = {version:r.version, json:JSON.stringify(r.data)}; if(r.key==='dir_snapshot') C.snapTs = r.updated_at; });
  if(!map.core) return screen('Falta la configuración inicial', 'Todavía no se cargan los datos del colegio en la base. Quien administra la plataforma debe ejecutar el archivo de datos iniciales en Supabase.', `<button class="btn" data-act="cloud-logout">Cerrar sesión</button>`);
  const {data:logs} = await sb.from('auditoria').select('ts,sid,por,accion,detalle').order('id', {ascending:false}).limit(3000);
  S.data = {students:[], log:[], folio:0, ...loadPrefs()};
  Object.entries(map).forEach(([k, v])=>applyRow(k, v));
  S.data.log = (logs||[]).reverse().map(l=>({ts:l.ts, sid:l.sid||'', por:l.por||'', accion:l.accion, detalle:l.detalle||''}));
  S.data.log.forEach(l=>C.sent.add(l));
  S.data.students.sort((a,b)=>String(a._creado||'').localeCompare(String(b._creado||'')));
  migrate();
  document.body.classList.remove('prelogin');
  C.ready = true; S.view = 'panel';
  render(); initCloudCaps();
  if(isTeam()) cloudPersist();
  sb.channel('uaa-datos').on('postgres_changes', {event:'*', schema:'public', table:'app_data'}, onRemote).subscribe();
}
async function cloudBoot(){
  const faltan = [];
  if(!window.UAA_CONFIG) faltan.push('No se encontró el archivo <code>config.js</code> junto a <code>index.html</code>.');
  else if(!CFG.supabaseUrl || /TU-PROYECTO/.test(CFG.supabaseUrl) || !CFG.supabaseAnonKey || /PEGA-AQUI/.test(CFG.supabaseAnonKey)) faltan.push('El archivo <code>config.js</code> todavía tiene los valores de ejemplo. Súbelo de nuevo con la dirección y la clave de Supabase.');
  if(!window.supabase) faltan.push('No se encontró el archivo <code>supabase.js</code> junto a <code>index.html</code>.');
  if(faltan.length) return screen('Falta configurar la conexión', faltan.join('<br><br>') + '<br><br>Revisa que en GitHub estén todos los archivos de la carpeta, al mismo nivel que <code>index.html</code>.');
  sb = supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, flowType:'pkce'}});
  sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_OUT' && C.ready) location.reload(); });
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return showLogin();
  if(location.search.includes('code=')) history.replaceState(null, '', location.pathname);
  startSession(session).catch(e=>{ console.error(e); screen('Algo salió mal', 'No se pudo abrir la plataforma. Recarga la página.', `<button class="btn primary" data-act="cloud-retry">Recargar</button>`); });
}

/* interceptar acciones que en la versión compartida funcionan distinto */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if(!el) return; const act = el.dataset.act;
  const stop = () => { e.stopImmediatePropagation(); e.preventDefault(); };
  if(act==='cloud-login'){ stop(); cloudLogin(); return; }
  if(act==='cloud-logout'){ stop(); cloudLogout(); return; }
  if(act==='cloud-retry'){ stop(); location.reload(); return; }
  if(!C.ready) return;
  if(act==='whoami'){ stop(); const p = whoP(S.data.usuario) || {};
    S.modal = {title:'Tu sesión', html:`<ul class="rows"><li class="rowi"><span class="icw avatar md av2">${initials(p.nombre)}</span><div class="main"><span class="t">${esc(p.nombre||C.perfil.nombre)}</span><span class="d">${esc(p.cargo||'')} · ${esc(C.perfil.email)}</span></div></li></ul><p class="small muted" style="margin:12px 0">Todo lo que registres queda firmado con tu nombre y con la hora del servidor.</p><button class="btn" data-act="cloud-logout">Cerrar sesión</button>`}; renderModal(); return; }
  if(act==='setuser'){ stop(); return; }
  if(act==='wipe' || act==='reseed'){ stop(); toast('No disponible en la versión compartida', true); return; }
  if(act==='restore' && myRol()!=='coordinacion'){ stop(); toast('Solo la coordinación puede restaurar datos', true); return; }
}, true);

cloudBoot();
</script>
