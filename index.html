<title>Gestión UAA EDUCENTER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,400&display=swap">
<style>
:root{
  --navy:#002D82; --navy-2:#1646B4; --navy-deep:#001A52;
  --sun:#FFE600; --sun-soft:#FFF7B8; --sun-ink:#002D82;
  --bg:#ECEEF4; --wash-a:rgba(0,45,130,.13); --wash-b:rgba(255,230,0,.20); --wash-c:rgba(150,170,230,.22);
  --glass:rgba(255,255,255,.74); --glass-edge:rgba(255,255,255,.95); --solid:#FFFFFF;
  --row:#F1F3F8; --row-hover:#E7EBF4; --line:#E1E5EE;
  --ink:#0C1633; --muted:#5E6782; --faint:#9AA1B6;
  --brand:#002D82; --brand-text:#002D82; --brand-soft:#E3E9F7; --on-brand:#FFFFFF;
  --ok:#1F8A4C; --ok-soft:#DDF3E5; --warn:#B26A00; --warn-soft:#FFF0D2; --crit:#D1283A; --crit-soft:#FDE1E4; --info:#3E55A8; --info-soft:#E5EAFA;
  --av1:#DCE5FB; --av2:#FFF4B3; --av3:#D9F1E3; --av4:#FBE0E6; --av5:#E8E1FA; --av6:#DDF1F6;
  --shadow:0 1px 2px rgba(12,22,51,.04),0 10px 30px rgba(12,22,51,.07);
  --shadow-lg:0 20px 60px rgba(12,22,51,.18);
  --hatch-a:#9FB2E6; --hatch-b:#E4EAF8;
  --f:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0A0F1F; --wash-a:rgba(40,80,200,.22); --wash-b:rgba(255,230,0,.07); --wash-c:rgba(90,110,200,.14);
  --glass:rgba(22,29,52,.72); --glass-edge:rgba(255,255,255,.07); --solid:#161D34;
  --row:rgba(255,255,255,.05); --row-hover:rgba(255,255,255,.09); --line:rgba(255,255,255,.09);
  --ink:#E8ECF7; --muted:#A3ABC4; --faint:#6E7794;
  --brand:#2A55CF; --brand-text:#A9BEF7; --brand-soft:rgba(90,130,240,.18); --on-brand:#FFFFFF;
  --ok:#5FD08F; --ok-soft:rgba(95,208,143,.14); --warn:#F2B454; --warn-soft:rgba(242,180,84,.15); --crit:#FF7A86; --crit-soft:rgba(255,122,134,.15); --info:#9FB2F5; --info-soft:rgba(159,178,245,.14);
  --av1:rgba(120,150,240,.22); --av2:rgba(255,230,0,.18); --av3:rgba(95,208,143,.18); --av4:rgba(255,122,160,.18); --av5:rgba(170,140,255,.2); --av6:rgba(100,200,230,.18);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3); --shadow-lg:0 20px 60px rgba(0,0,0,.5);
  --hatch-a:#4E6BC2; --hatch-b:rgba(120,150,240,.12);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A0F1F; --wash-a:rgba(40,80,200,.22); --wash-b:rgba(255,230,0,.07); --wash-c:rgba(90,110,200,.14);
  --glass:rgba(22,29,52,.72); --glass-edge:rgba(255,255,255,.07); --solid:#161D34;
  --row:rgba(255,255,255,.05); --row-hover:rgba(255,255,255,.09); --line:rgba(255,255,255,.09);
  --ink:#E8ECF7; --muted:#A3ABC4; --faint:#6E7794;
  --brand:#2A55CF; --brand-text:#A9BEF7; --brand-soft:rgba(90,130,240,.18); --on-brand:#FFFFFF;
  --ok:#5FD08F; --ok-soft:rgba(95,208,143,.14); --warn:#F2B454; --warn-soft:rgba(242,180,84,.15); --crit:#FF7A86; --crit-soft:rgba(255,122,134,.15); --info:#9FB2F5; --info-soft:rgba(159,178,245,.14);
  --av1:rgba(120,150,240,.22); --av2:rgba(255,230,0,.18); --av3:rgba(95,208,143,.18); --av4:rgba(255,122,160,.18); --av5:rgba(170,140,255,.2); --av6:rgba(100,200,230,.18);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3); --shadow-lg:0 20px 60px rgba(0,0,0,.5);
  --hatch-a:#4E6BC2; --hatch-b:rgba(120,150,240,.12);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{font-family:var(--f);color:var(--ink);font-size:15px;line-height:1.5;
  background-color:var(--bg);
  background-image:radial-gradient(900px 600px at 0% 0%,var(--wash-a),transparent 60%),radial-gradient(800px 600px at 100% 100%,var(--wash-b),transparent 60%),radial-gradient(700px 500px at 100% 0%,var(--wash-c),transparent 60%);
  background-attachment:fixed}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.15;letter-spacing:-.015em}
h1{font-size:clamp(1.8rem,1.2rem + 2.2vw,2.6rem);font-weight:400}
h1 b,.big b{font-weight:800}
h2{font-size:1.12rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand-text);outline-offset:2px}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.eyebrow{font-size:.82rem;color:var(--muted);font-weight:500}
.ic{width:20px;height:20px;flex:none;display:block}
.sm .ic,.ic.sm{width:16px;height:16px}

/* barra superior */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-inline:clamp(16px,3.5vw,40px);padding-block:18px 6px;max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:40px;height:auto;flex:none;filter:drop-shadow(0 4px 10px rgba(0,45,130,.25))}
.brand b{display:block;font-weight:800;font-size:.98rem;line-height:1.15}
.brand span{display:block;font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:10px;align-items:center}
.iconbtn{width:46px;height:46px;border-radius:50%;border:1px solid var(--glass-edge);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);position:relative;color:var(--ink);flex:none}
.iconbtn:hover{background:var(--solid)}
.iconbtn.sm{width:34px;height:34px;box-shadow:none;background:var(--row);border-color:transparent}
.iconbtn.sm:hover{background:var(--row-hover)}
.iconbtn .badge{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;border-radius:99px;background:var(--crit);color:#fff;font-size:.7rem;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.9rem;flex:none;color:var(--ink)}
.avatar.lg{width:84px;height:84px;font-size:1.6rem;border:4px solid var(--glass-edge);box-shadow:var(--shadow)}
.avatar.md{width:42px;height:42px;font-size:.82rem}
.av1{background:var(--av1)} .av2{background:var(--av2)} .av3{background:var(--av3)} .av4{background:var(--av4)} .av5{background:var(--av5)} .av6{background:var(--av6)}

main{max-width:1240px;margin:0 auto;padding-inline:clamp(16px,3.5vw,40px);padding-block:14px 140px}

/* navegación inferior flotante */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;gap:6px;padding:7px;border-radius:99px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--glass-edge);box-shadow:var(--shadow-lg);max-width:calc(100% - 24px)}
.dock button{height:48px;min-width:48px;border-radius:99px;border:0;background:var(--solid);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:var(--ink);position:relative;padding:0 13px;transition:background .15s}
.dock button:hover{background:var(--row-hover)}
.dock button span.lbl{display:none;font-weight:700;font-size:.9rem;white-space:nowrap}
.dock button[aria-current="page"]{background:linear-gradient(135deg,var(--navy-2),var(--navy));color:#fff;padding:0 20px 0 16px}
.dock button[aria-current="page"] span.lbl{display:inline}
.dock button[aria-current="page"] .ic{color:var(--sun)}
.dock .dotc{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--crit);border:2px solid var(--solid)}

/* superficies */
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--glass-edge);border-radius:28px;box-shadow:var(--shadow)}
.card{padding:22px}
.card > header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:18px 0 22px}
.pagehead .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:18px}
.demo{display:flex;gap:12px;align-items:center;padding:10px 12px 10px 10px;border-radius:99px;background:var(--glass);border:1px solid var(--glass-edge);font-size:.86rem;margin-top:10px;width:fit-content;max-width:100%}
.demo b{background:var(--sun);color:var(--sun-ink);padding:3px 12px;border-radius:99px;font-size:.78rem;flex:none}

/* botones */
.btn{border:0;border-radius:99px;padding:11px 20px;font-weight:700;font-size:.92rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;background:var(--solid);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn:hover{background:var(--row-hover)}
.btn.primary{background:linear-gradient(135deg,var(--navy-2),var(--navy));color:#fff;box-shadow:0 8px 20px rgba(0,45,130,.28)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.primary .ic{color:var(--sun)}
.btn.sun{background:var(--sun);color:var(--sun-ink);box-shadow:none}
.btn.danger{color:var(--crit);box-shadow:inset 0 0 0 1px var(--crit-soft)}
.btn.danger.armed{background:var(--crit);color:#fff}
.btn.sm{padding:7px 14px;font-size:.84rem}
.btn.link{background:none;box-shadow:none;padding:4px 6px;color:var(--brand-text)}
.btn.xl{padding:15px 26px;font-size:1rem}

/* chips y pills */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;padding:4px 11px;border-radius:99px;background:var(--row);white-space:nowrap;font-weight:600}
.chip.tea{background:var(--sun);color:var(--sun-ink)}
.chip .ic{width:13px;height:13px}
.chip.ico{display:inline-flex;gap:5px;align-items:center;background:var(--solid);box-shadow:inset 0 0 0 1px var(--line);font-weight:500}
.pill{font-size:.74rem;font-weight:700;padding:4px 11px;border-radius:99px;white-space:nowrap;display:inline-block}
.pill.ok{background:var(--ok);color:#fff} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit);color:#fff} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.none{background:var(--row);color:var(--muted)} .pill.soft-ok{background:var(--ok-soft);color:var(--ok)}
.seg{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:var(--solid);box-shadow:inset 0 0 0 1px var(--line);border-radius:99px;padding:10px 18px;font-weight:600;cursor:pointer;white-space:nowrap;display:flex;gap:7px;align-items:center;color:var(--ink)}
.seg button:hover{background:var(--row-hover)}
.seg button[aria-selected="true"]{background:var(--navy);color:#fff;box-shadow:none}
.seg .dot{width:7px;height:7px;border-radius:50%}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.crit{background:var(--crit)} .dot.none,.dot.na{background:var(--faint)}
.seg button[aria-selected="true"] .dot.ok{background:#7EE2A8}

.strip{display:inline-flex;gap:4px}
.strip span{font-size:.66rem;font-weight:800;padding:4px 8px;border-radius:99px;letter-spacing:.02em}
.s-ok{background:var(--ok-soft);color:var(--ok)} .s-warn{background:var(--warn-soft);color:var(--warn)} .s-crit{background:var(--crit);color:#fff}
.s-none{color:var(--faint);box-shadow:inset 0 0 0 1px var(--line)} .s-na{background:var(--row);color:var(--faint)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted);margin-top:14px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}

/* héroes del panel */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;margin-bottom:18px}
.welcome{position:relative;overflow:hidden;padding:28px;display:flex;flex-direction:column;gap:14px;min-height:260px}
.welcome .big{font-size:clamp(1.7rem,1.1rem + 2vw,2.5rem);line-height:1.1;font-weight:400;letter-spacing:-.02em;max-width:14ch;position:relative}
.welcome p{max-width:40ch;color:var(--muted);position:relative}
.welcome .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;position:relative}
.arcs{position:absolute;right:-70px;top:-70px;width:280px;height:280px;pointer-events:none}
.arcs i{position:absolute;border-radius:50%;border-style:solid;inset:0}
.arcs i:nth-child(1){border-width:26px;border-color:var(--brand-soft)}
.arcs i:nth-child(2){inset:38px;border-width:26px;border-color:var(--sun);opacity:.85}
.arcs i:nth-child(3){inset:76px;border-width:26px;border-color:var(--navy);opacity:.9}
.next{padding:22px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.live{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--muted)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.next .who{font-size:1.45rem;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.progress{display:flex;flex-direction:column;gap:6px}
.progress .lbl{font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between}
.bar{height:8px;border-radius:99px;background:var(--row);position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--navy-2),var(--navy))}
.bar b{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--sun);border:3px solid var(--navy);transform:translate(-50%,-50%)}
.next .go{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:10px}
.playbtn{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--navy-2),var(--navy));color:var(--sun);display:grid;place-items:center;border:0;cursor:pointer;box-shadow:0 8px 20px rgba(0,45,130,.3);flex:none}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.stat{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:24px}
.stat .icw{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none}
.stat .v{font-size:1.6rem;font-weight:800;line-height:1;letter-spacing:-.02em}
.stat .v small{font-size:.9rem;color:var(--muted);font-weight:500}
.stat .l{font-size:.8rem;color:var(--muted);line-height:1.3;margin-top:3px}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}

/* filas estilo "Last Lessons" */
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rowi{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 10px;border-radius:22px;background:var(--row)}
.rowi.click{cursor:pointer}
.rowi.click:hover{background:var(--row-hover)}
.rowi .icw{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--solid)}
.rowi .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rowi .t{font-weight:700;font-size:.93rem;line-height:1.3}
.rowi .d{font-size:.8rem;color:var(--muted);line-height:1.35}
.rowi .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.rowi .end{display:flex;gap:6px;align-items:center;flex:none}
.lv-crit .icw{background:var(--crit-soft);color:var(--crit)} .lv-warn .icw{background:var(--warn-soft);color:var(--warn)} .lv-info .icw{background:var(--info-soft);color:var(--info)}
.lvl{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;font-weight:800;margin-right:6px}
.lv-crit .lvl{color:var(--crit)} .lv-warn .lvl{color:var(--warn)} .lv-info .lvl{color:var(--info)}
.empty{padding:26px;text-align:center;color:var(--muted);border-radius:22px;background:var(--row)}

/* barras rayadas estilo analítica */
.bars{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px}
.barcol{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;text-align:center}
.track{width:100%;height:190px;border-radius:26px;background:var(--row);display:flex;align-items:flex-end;overflow:hidden}
.fillh{width:100%;border-radius:26px;background:repeating-linear-gradient(135deg,var(--hatch-a) 0 2px,var(--hatch-b) 2px 8px);min-height:0}
.barcol.top .fillh{background:repeating-linear-gradient(135deg,var(--navy) 0 2.5px,var(--sun-soft) 2.5px 8px)}
.barcol .icw{width:40px;height:40px;border-radius:50%;background:var(--solid);display:grid;place-items:center;margin-top:-30px;box-shadow:var(--shadow);font-weight:800;font-size:.78rem}
.barcol .nm{font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.barcol .vv{font-size:1.2rem;font-weight:800;line-height:1;letter-spacing:-.02em}
.barcol .vv small{font-size:.72rem;font-weight:600;color:var(--muted)}

/* estudiantes */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.search{display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--glass-edge);border-radius:99px;padding:0 18px;flex:1 1 260px;box-shadow:var(--shadow)}
.search input{border:0;background:none;padding:13px 0;flex:1;min-width:0;outline:none}
.search:focus-within{outline:2px solid var(--brand-text)}
.selpill{border:0;background:var(--solid);box-shadow:inset 0 0 0 1px var(--line);border-radius:99px;padding:11px 16px;font-weight:600;min-width:0}
.studs{display:flex;flex-direction:column;gap:10px}
.stud{display:grid;grid-template-columns:auto minmax(0,1.3fr) minmax(0,1.3fr) auto;gap:16px;align-items:center;padding:12px 18px 12px 12px;border-radius:26px;cursor:pointer}
.stud:hover{background:var(--solid)}
.stud .nm b{display:block;font-size:.98rem}
.stud .nm small{color:var(--muted);font-size:.82rem}

/* ficha */
.fichahead{display:flex;justify-content:space-between;gap:18px;align-items:center;margin:14px 0 20px;flex-wrap:wrap}
.fichahead .left{display:flex;flex-direction:column;gap:8px;min-width:0}
.fichahead h1{line-height:1.05}
.fichahead .meta{display:flex;flex-wrap:wrap;gap:6px}
.fichahead .right{display:flex;align-items:center;gap:12px}
.navrow{display:flex;align-items:center;gap:14px;margin-top:8px}
.navrow h2{font-size:1.15rem}

.doc{overflow:hidden}
.doc-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;padding:20px 22px}
.doc-head .actions{display:flex;gap:8px;flex-wrap:wrap}
.sec{padding:20px 22px;border-top:1px solid var(--line)}
.sec > h3{margin-bottom:4px;display:flex;align-items:center;gap:10px}
.sec > h3::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 3px var(--brand-soft)}
.sec > .note{font-size:.84rem;color:var(--muted);margin-bottom:14px;max-width:72ch}
.sec > h3 + .fields,.sec > h3 + dl{margin-top:14px}
dl.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 26px;margin:0}
dl.fields > div{min-width:0}
dl.fields .w2{grid-column:1/-1}
dt{font-size:.76rem;color:var(--muted);font-weight:600;margin-bottom:3px}
dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;max-width:75ch}
dd.empty-v{color:var(--faint);font-style:italic}
.listview{display:flex;flex-direction:column;gap:10px}
.listcard{border-radius:20px;padding:14px 16px;background:var(--row)}
.listcard dl.fields{gap:10px 20px}

.idcard{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 20px;margin:0 22px 20px;padding:16px 18px;background:var(--row);border-radius:22px}
.idcard div{min-width:0}
.idcard dt{font-size:.72rem}
.idcard dd{font-size:.9rem;font-weight:600}

/* plazo estilo barra de progreso con píldora */
.deadline{padding:22px;display:flex;flex-direction:column;gap:14px}
.deadline .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.meter{position:relative;height:12px;border-radius:99px;background:var(--row);margin:18px 0 6px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--navy-2),var(--navy))}
.deadline.warn .meter i{background:linear-gradient(90deg,#E8A43A,var(--warn))}
.deadline.crit .meter i{background:linear-gradient(90deg,#F06674,var(--crit));width:100%!important}
.meter b{position:absolute;top:50%;transform:translate(-50%,-50%);background:var(--ink);color:var(--bg);font-size:.74rem;font-weight:800;padding:4px 10px;border-radius:99px;white-space:nowrap;border:3px solid var(--bg)}
.meter-scale{display:flex;justify-content:space-between;font-size:.72rem;color:var(--faint)}

/* formularios */
.form .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.form .w2{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label,.field > .lbl{font-size:.8rem;font-weight:600;color:var(--muted)}
.field .req{color:var(--crit)}
.field input[type=text],.field input[type=date],.field input[type=time],.field input[type=number],.field select,.field textarea{border:0;background:var(--row);border-radius:16px;padding:11px 14px;width:100%;min-width:0}
.field textarea{min-height:84px;resize:vertical;line-height:1.45}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brand-text);outline-offset:0;background:var(--solid)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;gap:7px;align-items:center;border-radius:99px;padding:9px 15px;font-size:.87rem;cursor:pointer;background:var(--solid);box-shadow:inset 0 0 0 1px var(--line);font-weight:500}
.checks label:has(input:checked){background:var(--navy);color:#fff;box-shadow:none;font-weight:700}
.checks input{position:absolute;opacity:0;width:1px;height:1px}
.checks label:has(input:focus-visible){outline:2px solid var(--brand-text);outline-offset:2px}
.bool{display:flex;gap:12px;align-items:center;cursor:pointer;font-size:.92rem;padding:10px 14px;border-radius:16px;background:var(--row)}
.bool input{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:99px;background:var(--faint);position:relative;flex:none;margin:0;cursor:pointer;transition:background .15s}
.bool input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.bool input:checked{background:var(--navy)}
.bool input:checked::after{left:21px;background:var(--sun)}
.listedit{display:flex;flex-direction:column;gap:10px}
.listedit fieldset{border:0;border-radius:22px;padding:14px 16px;margin:0;background:var(--row)}
.listedit legend{font-size:.8rem;font-weight:700;color:var(--muted);padding:0;display:flex;gap:10px;align-items:center;float:left;width:100%;justify-content:space-between;margin-bottom:10px}
.listedit legend + *{clear:both}
.listedit .field input,.listedit .field select,.listedit .field textarea{background:var(--solid)}
.listedit .iconbtn.sm{background:var(--solid)}
.form-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.form-err{color:var(--crit);font-size:.88rem;margin-right:auto;font-weight:600}

/* registros */
.items{display:flex;flex-direction:column;gap:12px}
.item > header{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:14px 16px 12px;flex-wrap:wrap}
.item > header .t{display:flex;gap:12px;align-items:center;min-width:0}
.item > header .t > div{display:flex;flex-direction:column;gap:2px}
.item .body{padding:0 20px 18px}
.item .body dl.fields{gap:10px 22px}
.item .actions{display:flex;gap:6px;align-items:center}

/* agenda */
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.daypill{flex:none;width:58px;padding:10px 0 9px;border-radius:99px;border:0;background:var(--solid);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink)}
.daypill small{font-size:.72rem;color:var(--muted);text-transform:capitalize}
.daypill b{font-size:1.1rem;font-weight:700}
.daypill .dots{display:flex;gap:3px;height:6px;margin-top:2px}
.daypill .dots i{width:5px;height:5px;border-radius:50%;background:var(--brand-text)}
.daypill.today{box-shadow:inset 0 0 0 2px var(--sun)}
.daypill[aria-pressed="true"]{background:linear-gradient(180deg,var(--navy-2),var(--navy));color:#fff;box-shadow:0 8px 18px rgba(0,45,130,.28)}
.daypill[aria-pressed="true"] small{color:#C9D5FF}
.daypill[aria-pressed="true"] .dots i{background:var(--sun)}
.timeline{display:flex;flex-direction:column;gap:18px}
.tday h3{font-size:.95rem;margin-bottom:8px}
.tslot{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;align-items:start;padding:6px 0;border-top:1px dashed var(--line)}
.tslot:first-of-type{border-top:0}
.tslot .h{font-weight:700;font-size:.9rem;padding-top:12px;font-variant-numeric:tabular-nums}
.tchip{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 8px;border-radius:20px;background:var(--solid);box-shadow:inset 0 0 0 1px var(--line);flex-wrap:wrap}
.tchip .icw{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.tchip .main{flex:1;min-width:160px}
.tchip .t{font-weight:700;font-size:.9rem;background:none;border:0;padding:0;cursor:pointer;text-align:left;color:var(--ink)}
.tchip .t:hover{color:var(--brand-text)}
.tchip .d{font-size:.78rem;color:var(--muted)}

/* equipo y normativa */
.teamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.member{padding:20px;display:flex;flex-direction:column;gap:12px}
.member .hd{display:flex;gap:12px;align-items:center}
.member .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.member .nums div{background:var(--row);border-radius:16px;padding:8px 10px}
.member .nums b{display:block;font-size:1.15rem;font-weight:800}
.member .nums span{font-size:.72rem;color:var(--muted)}
.normas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.norma{padding:22px;display:flex;flex-direction:column;gap:12px}
.norma .code{align-self:flex-start;font-size:.76rem;font-weight:700;background:var(--sun);color:var(--sun-ink);padding:4px 12px;border-radius:99px}
.norma ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:.9rem}
.norma .inapp{font-size:.85rem;background:var(--row);border-radius:18px;padding:12px 14px}
.norma a{color:var(--brand-text);font-weight:700;display:inline-flex;gap:6px;align-items:center}
.norma.wide{grid-column:1/-1}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(6,12,30,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto;z-index:20}
.dialog{background:var(--solid);border-radius:30px;box-shadow:var(--shadow-lg);width:100%;max-width:780px;margin-block:auto;overflow:hidden}
.dialog > header{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;gap:12px}
.dialog .body{padding:4px 22px 22px;display:flex;flex-direction:column;gap:18px}
.dialog .field input[type=text],.dialog .field input[type=date],.dialog .field input[type=time],.dialog .field input[type=number],.dialog .field select,.dialog .field textarea{background:var(--row)}
.toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px 11px 14px;border-radius:99px;font-weight:700;font-size:.9rem;z-index:30;box-shadow:var(--shadow-lg);display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px);width:max-content;border-radius:22px}
.toast .ic{color:var(--sun)}
textarea.dump{width:100%;min-height:220px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;border:0;border-radius:18px;background:var(--row);padding:12px}
.estab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}


/* familia, informes y evidencia */
.ring{--p:0;--c:var(--ok);width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--row) 0);display:grid;place-items:center;flex:none;position:relative}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--solid)}
.ring b{position:relative;font-size:1.25rem;font-weight:800;letter-spacing:-.02em}
.ring.sm{width:68px;height:68px}.ring.sm::before{inset:7px}.ring.sm b{font-size:.98rem}
.quick{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.quick-actions{display:flex;gap:8px;flex-wrap:wrap}
.ob-ok .icw{background:var(--ok-soft);color:var(--ok)} .ob-partial .icw{background:var(--warn-soft);color:var(--warn)} .ob-pend .icw{background:var(--info-soft);color:var(--info)} .ob-late .icw{background:var(--crit-soft);color:var(--crit)}

/* ---------- utilidades ---------- */
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const pad = n => String(n).padStart(2,'0');
const isoOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const D = n => { const d = new Date(TODAY); d.setDate(d.getDate()+n); return isoOf(d); };
const parse = s => { if(!s) return null; const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return isoOf(d); };
const diffDays = s => Math.round((parse(s)-TODAY)/86400000);
const fmt = s => s ? parse(s).toLocaleDateString('es-CL',{day:'2-digit',month:'short',year:'numeric'}) : '—';
const fmtShort = s => s ? parse(s).toLocaleDateString('es-CL',{day:'2-digit',month:'short'}) : '—';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,9);
const clone = o => JSON.parse(JSON.stringify(o ?? {}));
const empty = v => v === undefined || v === null || v === '' || (Array.isArray(v) && !v.length);
function edad(f){ if(!f) return ''; const b = parse(f); let y = TODAY.getFullYear()-b.getFullYear(); let m = TODAY.getMonth()-b.getMonth(); if(TODAY.getDate()<b.getDate()) m--; if(m<0){y--; m+=12;} return y+' años'+(m ? ', '+m+(m===1?' mes':' meses') : ''); }
function getPath(o,p){ return p.split('.').reduce((a,k)=> a==null ? a : a[k], o); }
function setPath(o,p,v){ const ks = p.split('.'); let a = o; ks.slice(0,-1).forEach((k,i)=>{ if(a[k]==null) a[k] = /^\d+$/.test(ks[i+1]) ? [] : {}; a = a[k]; }); a[ks.at(-1)] = v; }

/* ---------- reglas de alerta ---------- */
function alertsFor(s){
  const a = []; const push = (lvl,t,d,tab) => a.push({lvl,t,d,tab,sid:s.id,nombre:s.nombre});
  const tea = teaDate(s);
  if(tea && !s.paec?.fechaElaboracion){ const due = addDays(tea,14), d = diffDays(due);
    push(d<0?'crit':d<=5?'warn':'info', d<0 ? `PAEC fuera de plazo hace ${-d} ${-d===1?'día':'días'}` : d===0 ? 'PAEC vence hoy' : `PAEC pendiente: quedan ${d} ${d===1?'día':'días'}`, `Plazo de dos semanas desde la recepción del diagnóstico (${fmt(tea)}). Vence el ${fmt(due)}.`, 'paec'); }
  if(s.paec?.fechaElaboracion){
    if(overdue(s.paec.proximaRevision)) push('warn','Revisión del PAEC vencida',`Estaba programada para el ${fmt(s.paec.proximaRevision)}.`,'paec');
    if(!s.paec.firmaApoderado && !s.paec.firmaSuplente) push('warn','PAEC sin firma de la familia','Debe firmarlo el apoderado y un integrante del equipo de gestión.','paec');
    else if(s.paec.firmaSuplente && !s.paec.firmaApoderado && !s.paec.poderSimple) push('warn','Falta poder simple del apoderado suplente','El PAEC fue firmado por el suplente sin poder simple adjunto.','paec');
  }
  (s.dec||[]).filter(x=>!x.apoderadoInformado).forEach(x=> push('crit','Desregulación sin informar a la familia',`Episodio del ${fmt(x.fecha)}, ${etapaTxt(x.etapa).toLowerCase()}.`,'dec'));
  (s.dec||[]).filter(x=>!x.analisis && diffDays(x.fecha)>=-30).forEach(x=> push('warn','Episodio sin análisis frente al PAEC',`Episodio del ${fmt(x.fecha)}. Revisa si el PAEC necesita ajustes.`,'dec'));
  if(s.pai?.fechaElaboracion && overdue(s.pai.proximaRevision)) push('warn','Revisión del PAI vencida',`Estaba programada para el ${fmt(s.pai.proximaRevision)}.`,'pai');
  if(s.paci?.fechaElaboracion && overdue(s.paci.proximaRevision)) push('warn','Revisión del PACI vencida',`Estaba programada para el ${fmt(s.paci.proximaRevision)}.`,'paci');
  if(!s.anamnesis?.fecha) push('info','Anamnesis sin registrar','Agenda la entrevista con la familia.','anamnesis');
  else if(!s.anamnesis.consentimiento) push('warn','Falta autorización para datos sensibles','La anamnesis no registra la autorización del apoderado (Ley 21.719).','anamnesis');
  if(s.pai?.fechaElaboracion){ const last = (s.sesiones||[]).filter(x=>x.estado==='Realizada').map(x=>x.fecha).sort().at(-1);
    if(!last || diffDays(last) < -21) push('info','Más de 3 semanas sin sesiones realizadas', last ? `Última sesión: ${fmt(last)}.` : 'No hay sesiones registradas.','sesiones'); }
  a.push(...oblAlerts(s)); a.push(...adapAlerts(s)); a.push(...refAlerts(s)); a.push(...riAlerts(s)); a.push(...medAlerts(s)); a.push(...derAlerts(s));
  return a;
}

function optsOf(f, ctx){ const o = typeof f.o === 'function' ? f.o(ctx) : (f.o||[]); return o.map(x => Array.isArray(x) ? x : [x,x]); }
function viewVal(f, v, ctx){
  if(empty(v) && f.t!=='bool') return null;
  switch(f.t){
    case 'date': return `<span class="mono">${fmt(v)}</span>`;
    case 'prof': return esc(profName(v));
    case 'bool': return v ? '<span class="pill ok">Sí</span>' : '<span class="pill none">No</span>';
    case 'checks': return `<div class="chips">${v.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`;
    case 'select': { const hit = optsOf(f,ctx).find(o=>String(o[0])===String(v)); return esc(hit ? hit[1] : v); }
    case 'number': return `<span class="mono">${esc(v)}</span>`;
    default: return esc(v);
  }
}
function viewFields(fields, data, ctx){
  return `<dl class="fields">${fields.map(f=>{
    const v = data?.[f.k];
    if(f.t==='list'){
      return `<div class="w2"><dt>${esc(f.l)}s</dt><dd>${(v&&v.length) ? `<div class="listview">${v.map((row,i)=>`<div class="listcard">${viewFields(f.sub,row,ctx)}</div>`).join('')}</div>` : '<span class="muted"><i>Sin registros</i></span>'}</dd></div>`;
    }
    const out = viewVal(f, v, ctx);
    return `<div class="${f.w===2||f.t==='textarea'&&f.w===2?'w2':''}"><dt>${esc(f.l)}</dt><dd class="${out===null?'empty-v':''}">${out===null?'Sin registrar':out}</dd></div>`;
  }).join('')}</dl>`;
}
function viewDoc(schema, data, ctx){ return schema.map(sec=>`<section class="sec"><h3>${esc(sec.sec)}</h3>${viewFields(sec.fields,data,ctx)}</section>`).join(''); }

function inputFor(f, path, v, ctx){
  const id = 'f-'+ctx.fid+'-'+path.replace(/\./g,'-');
  const lab = `<label for="${id}">${esc(f.l)}${f.req?' <span class="req">*</span>':''}</label>`;
  const cls = `field${f.w===2?' w2':''}`;
  switch(f.t){
    case 'textarea': return `<div class="${cls}">${lab}<textarea id="${id}" data-path="${path}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea></div>`;
    case 'select': case 'prof': {
      const o = f.t==='prof' ? profOpts() : optsOf(f,ctx);
      return `<div class="${cls}">${lab}<select id="${id}" data-path="${path}"><option value="">Seleccionar…</option>${o.map(([val,t])=>`<option value="${esc(val)}" ${String(v??'')===String(val)?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`; }
    case 'checks': {
      const arr = v||[];
      return `<div class="${cls}"><span class="lbl">${esc(f.l)}</span><div class="checks">${optsOf(f,ctx).map(([val,t],i)=>`<label><input type="checkbox" id="${id}-${i}" data-path="${path}" data-opt="${esc(val)}" ${arr.includes(val)?'checked':''}>${esc(t)}</label>`).join('')}</div></div>`; }
    case 'bool': return `<div class="${cls}"><label class="bool"><input type="checkbox" id="${id}" data-path="${path}" data-bool="1" ${v?'checked':''}><span>${esc(f.l)}</span></label></div>`;
    case 'list': {
      const arr = v||[];
      return `<div class="field w2"><div class="listedit">${arr.map((row,i)=>`<fieldset><legend>${esc(f.l)} ${i+1} <button type="button" class="iconbtn sm" data-act="list-del" data-path="${path}" data-i="${i}" aria-label="Quitar">${ic('trash')}</button></legend><div class="fields">${f.sub.map(sf=>inputFor(sf, path+'.'+i+'.'+sf.k, row?.[sf.k], ctx)).join('')}</div></fieldset>`).join('')}
        <div><button type="button" class="btn sm" data-act="list-add" data-path="${path}">${ic('plus')} Agregar ${esc(f.l.toLowerCase())}</button></div></div></div>`; }
    default: {
      const type = f.t==='date'?'date':f.t==='time'?'time':f.t==='number'?'number':'text';
      return `<div class="${cls}">${lab}<input type="${type}" id="${id}" data-path="${path}" value="${esc(v)}" placeholder="${esc(f.ph||'')}" ${type==='number'?'min="0"':''}></div>`; }
  }
}
function formBody(schema, draft, ctx){
  return schema.map(sec=>`<section class="sec"><h3>${esc(sec.sec)}</h3>${sec.note?`<p class="note">${esc(sec.note)}</p>`:''}<div class="fields">${sec.fields.map(f=>inputFor(f, f.k, draft[f.k], ctx)).join('')}</div></section>`).join('');
}
function missingReq(schema, draft){ return schema.flatMap(s=>s.fields).filter(f=>f.req && empty(draft[f.k])).map(f=>f.l); }

function toText(schema, data, ctx){
  const line = (f, v, ind='') => {
    if(f.t==='list') return `${ind}${f.l}s:\n` + ((v||[]).map((r,i)=>`${ind}  ${f.l} ${i+1}\n`+f.sub.map(sf=>line(sf,r?.[sf.k],ind+'    ')).join('')).join('') || `${ind}  Sin registros\n`);
    let o;
    if(f.t==='bool') o = v ? 'Sí' : 'No';
    else if(empty(v)) o = '—';
    else if(f.t==='date') o = fmt(v);
    else if(f.t==='prof') o = profName(v);
    else if(f.t==='checks') o = v.join(', ');
    else if(f.t==='select'){ const h = optsOf(f,ctx).find(x=>String(x[0])===String(v)); o = h ? h[1] : v; }
    else o = String(v);
    return `${ind}${f.l}: ${o}\n`;
  };
  return schema.map(sec=>`\n${sec.sec.toUpperCase()}\n`+sec.fields.map(f=>line(f,data?.[f.k])).join('')).join('');
}

/* ================= Qué debe recibir la familia ================= */
const OB_TXT = {ok:'Con acuse', partial:'Sin acuse', pend:'Pendiente', late:'Vencido'};
const OB_PILL = {ok:'ok', partial:'warn', pend:'info', late:'crit'};
const OB_IC = {ok:'check', partial:'clock', pend:'calendar', late:'alert'};
const evTxt = c => `${c.tipo} del ${fmt(c.fecha)} · ${c.respuesta}${c.verificacion?' · '+c.verificacion:''}`;
function commState(list){
  if(!list.length) return null;
  const ok = list.find(c=>ACUSE_OK.includes(c.respuesta)); if(ok) return {st:'ok', c:ok};
  const p = list.find(c=>ACUSE_PARCIAL.includes(c.respuesta)); if(p) return {st:'partial', c:p};
  return {st:'attempt', c:list[0]};
}
const findC = (s, m, doc, from, to) => (s.comunicaciones||[]).filter(c => (c.motivo===m || (doc && (c.documentos||[]).includes(doc))) && (!from || c.fecha>=from) && (!to || c.fecha<=to)).sort((a,b)=>b.fecha.localeCompare(a.fecha));
function judge(cs, plazo, extra){
  if(cs?.st==='ok') return {st:'ok', ev:evTxt(cs.c), c:cs.c};
  if(extra) return extra;
  if(cs?.st==='partial') return {st:'partial', ev:evTxt(cs.c), c:cs.c};
  return {st: plazo && diffDays(plazo)<0 ? 'late' : 'pend', ev: cs ? 'Intento registrado: '+evTxt(cs.c) : '', c:cs?.c};
}
function obligations(s){
  const L = []; const add = (o, r) => L.push({...o, ...r});
  const firstDate = [s.anamnesis?.fecha, ...(s.diagnosticos||[]).map(d=>d.fecha)].filter(Boolean).sort()[0];
  // 1. datos personales
  add({id:'datos', titulo:'Autorización para tratar datos personales y de salud', norma:'Ley 19.628 reformada por Ley 21.719', cuando:'Al ingresar a la unidad, antes de registrar datos de salud', plazo:firstDate, pre:{motivo:'Autorización de tratamiento de datos', documentos:['Formulario de consentimiento']}},
    judge(commState(findC(s,'Autorización de tratamiento de datos','Formulario de consentimiento')), firstDate, s.anamnesis?.consentimiento && !findC(s,'Autorización de tratamiento de datos','Formulario de consentimiento').some(c=>ACUSE_OK.includes(c.respuesta)) ? {st:'ok', ev:'Registrada en la anamnesis del '+fmt(s.anamnesis.fecha)} : null));
  // 2. autorización para evaluar
  const propias = (s.evaluaciones||[]).filter(e=>e.tipo!=='Informe externo recibido').sort((a,b)=>a.fecha.localeCompare(b.fecha));
  if(propias.length) add({id:'evalaut', titulo:'Autorización para evaluar', norma:'Buena práctica (obligatoria en PIE, Decreto 170)', cuando:'Antes de la primera evaluación', plazo:propias[0].fecha, pre:{motivo:'Autorización para evaluación', documentos:['Autorización de evaluación']}},
    judge(commState(findC(s,'Autorización para evaluación','Autorización de evaluación')), propias[0].fecha));
  // 3. devolución de cada evaluación
  propias.forEach(e=>{ const plazo = addDays(e.fecha,15);
    add({id:'dev-'+e.id, titulo:`Devolución de resultados: ${e.tipo} (${fmtShort(e.fecha)})`, norma:'Decreto 67/2018, art. 18 · plazo interno sugerido de 15 días', cuando:'Tras cada evaluación', plazo, pre:{motivo:'Devolución de resultados de evaluación', documentos:['Informe de evaluación']}},
      judge(commState(findC(s,'Devolución de resultados de evaluación','Informe de evaluación', e.fecha)), plazo, null)); });
  // 4. circular Ley TEA y PAEC
  const tea = teaDate(s);
  if(tea){ const ini = parse(S.data.estab.inicioAnio||TODAY.getFullYear()+'-03-04'); const lim = new Date(ini); lim.setMonth(lim.getMonth()+2); const plazo = [isoOf(lim), addDays(tea,14)].sort().at(-1);
    add({id:'circtea', titulo:'Circular informativa sobre la Ley TEA', norma:'Circular SIE 586/2023', cuando:'En los dos primeros meses del año escolar, o al recibir el diagnóstico', plazo, pre:{motivo:'Circular informativa Ley TEA', documentos:['Circular Ley TEA']}},
      judge(commState(findC(s,'Circular informativa Ley TEA','Circular Ley TEA', String(TODAY.getFullYear())+'-01-01')), plazo)); }
  if(tea || s.paec?.fechaElaboracion){ const p = s.paec||{}; const plazo = tea ? addDays(tea,14) : addDays(p.fechaElaboracion,14);
    const firmado = p.firmaApoderado || (p.firmaSuplente && p.poderSimple);
    const cs = commState(findC(s,'Entrega y firma de PAEC','PAEC', p.fechaElaboracion ? addDays(p.fechaElaboracion,-1) : null));
    const extra = firmado ? {st:'ok', ev:`PAEC firmado por el apoderado ${p.firmaApoderado?'titular':'suplente con poder simple'}`+(cs?.c?' · '+evTxt(cs.c):'')} : (cs?.st!=='ok' && p.fechaInformado ? {st:'partial', ev:'Informado el '+fmt(p.fechaInformado)+', sin firma de la familia'+(cs?.c?' · '+evTxt(cs.c):'')} : null);
    add({id:'paec', titulo:'Entrega y firma del PAEC', norma:'Ley 21.545 · Circular 586 · Orientaciones Mineduc 2025', cuando:'Máximo dos semanas desde el diagnóstico, y al inicio de cada año escolar', plazo, pre:{motivo:'Entrega y firma de PAEC', documentos:['PAEC','Protocolo DEC del Reglamento Interno']}},
      firmado ? extra : judge(cs, plazo, extra));
    const rev = (p.revisiones||[]).filter(r=>r.fecha).sort((a,b)=>b.fecha.localeCompare(a.fecha))[0];
    if(rev){ const pl = addDays(rev.fecha,7); add({id:'paecrev', titulo:`Modificación del PAEC informada (${fmtShort(rev.fecha)})`, norma:'Orientaciones Mineduc 2025', cuando:'Cada vez que se modifica el plan', plazo:pl, pre:{motivo:'Revisión o modificación de PAEC', documentos:['PAEC']}}, judge(commState(findC(s,'Revisión o modificación de PAEC',null, rev.fecha)), pl)); }
  }
  // 5. PAI y PACI
  if(s.pai?.fechaElaboracion){ const pl = addDays(s.pai.fechaElaboracion,15);
    add({id:'pai', titulo:'Entrega del PAI', norma:'Buena práctica · compromisos de la familia', cuando:'Al elaborarlo y en cada revisión', plazo:pl, pre:{motivo:'Entrega de PAI', documentos:['PAI']}}, judge(commState(findC(s,'Entrega de PAI','PAI', s.pai.fechaElaboracion)), pl)); }
  if(s.paci?.fechaElaboracion){ const pl = addDays(s.paci.fechaElaboracion,15);
    add({id:'paci', titulo:'Entrega del PACI', norma:'Decreto 83/2015 · Decreto 67/2018', cuando:'Al elaborarlo, antes de evaluar con adecuaciones', plazo:pl, pre:{motivo:'Entrega de PACI', documentos:['PACI']}}, judge(commState(findC(s,'Entrega de PACI','PACI', s.paci.fechaElaboracion)), pl, s.paci.informado ? null : null)); }
  // 6. informes de avance semestrales
  if(s.pai?.fechaElaboracion || (s.sesiones||[]).some(x=>x.estado==='Realizada')){ const Y = TODAY.getFullYear();
    const sems = [{n:'primer semestre', from:Y+'-06-01', to:Y+'-08-31', plazo:Y+'-07-31'},{n:'segundo semestre', from:Y+'-11-15', to:Y+'-12-31', plazo:Y+'-12-18'}];
    sems.forEach((m,i)=>{ if(firstDate && firstDate > m.to) return; if(i===0 && firstDate && firstDate > Y+'-06-15') return;
      add({id:'avance'+i, titulo:`Informe de avance del ${m.n}`, norma:'Decreto 67/2018, art. 18 m · según Reglamento de Evaluación', cuando:'Al cierre de cada semestre', plazo:m.plazo, pre:{motivo:'Informe de avance del período', documentos:['Informe de avance']}}, judge(commState(findC(s,'Informe de avance del período','Informe de avance', m.from, m.to)), m.plazo)); }); }
  // 7. episodios DEC
  (s.dec||[]).forEach(x=>{
    const cs = commState(findC(s,'Aviso de episodio de desregulación',null, x.fecha, addDays(x.fecha,1)));
    const extra = x.apoderadoInformado ? {st: (!x.fechaInforme || x.fechaInforme<=x.fecha) ? 'ok' : 'partial', ev:'Registrado en el episodio: familia informada '+(x.fechaInforme?'el '+fmt(x.fechaInforme):'')} : null;
    add({id:'decav-'+x.id, titulo:`Aviso a la familia del episodio del ${fmtShort(x.fecha)}`, norma:'Circular 586 · protocolo DEC del Reglamento Interno', cuando:'El mismo día del episodio', plazo:x.fecha, pre:{motivo:'Aviso de episodio de desregulación', documentos:[]}}, cs?.st==='ok' ? judge(cs) : (extra || judge(cs, x.fecha)));
    if(+x.etapa>=2){ const pl = addDays(x.fecha,5);
      add({id:'decent-'+x.id, titulo:`Entrevista de seguimiento tras el episodio del ${fmtShort(x.fecha)}`, norma:'Protocolo DEC · plazo según Reglamento Interno (sugerido 5 días)', cuando:'Después de episodios en etapa 2 o 3', plazo:pl, pre:{motivo:'Entrevista posterior a episodio DEC', documentos:['PAEC']}}, judge(commState(findC(s,'Entrevista posterior a episodio DEC',null, x.fecha)), pl)); }
  });
  // 8. inasistencias reiteradas
  const aus = (s.sesiones||[]).filter(x=>x.estado==='Ausente' && diffDays(x.fecha)>=-60).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  if(aus.length>=2){ const pl = addDays(aus.at(-1).fecha,7);
    add({id:'ausencias', titulo:`Citación por ${aus.length} inasistencias a sesiones`, norma:'Buena práctica · respaldo ante reclamos', cuando:'Tras dos inasistencias en dos meses', plazo:pl, pre:{motivo:'Citación a entrevista', documentos:[]}}, judge(commState(findC(s,'Citación a entrevista',null, aus[0].fecha)), pl)); }
  return L;
}
function respaldo(s){ const L = obligations(s); if(!L.length) return {pct:100, L, ok:0, partial:0, late:0, pend:0};
  const n = k => L.filter(o=>o.st===k).length; const due = L.filter(o=>o.st!=='pend').length;
  const pct = due ? Math.round((n('ok') + n('partial')*.5)/due*100) : 100;
  return {pct, L, ok:n('ok'), partial:n('partial'), late:n('late'), pend:n('pend')}; }
function oblAlerts(s){ return obligations(s).filter(o=>o.st==='late' && !/^(datos|paec|decav-)/.test(o.id)).map(o=>({lvl:'warn', t:'Familia: '+o.titulo, d:`Vencía el ${fmt(o.plazo)}. ${o.norma}.`, tab:'familia', sid:s.id, nombre:s.nombre})); }
function obRec(o){ const p = o.plazo ? fmt(o.plazo) : '';
  if(o.st==='late') return `${o.titulo}: vencido${p?' el '+p:''}. Entregar a la familia y registrar el acuse de recibo${o.ev?' ('+o.ev+')':''}.`;
  if(o.st==='partial') return `${o.titulo}: entregado sin acuse. Obtener firma o confirmación escrita; si la familia se niega, registrar un testigo.`;
  return `${o.titulo}: programar la entrega antes del ${p}.`; }

/* ================= Recomendaciones ================= */
function genRecs(s, kind, desde, hasta){
  const inR = f => f && f>=desde && f<=hasta; const out = [];
  const ses = (s.sesiones||[]).filter(x=>inR(x.fecha)); const real = ses.filter(x=>x.estado==='Realizada'); const aus = ses.filter(x=>x.estado==='Ausente');
  const decs = (s.dec||[]).filter(x=>inR(x.fecha)); const obj = s.pai?.objetivos||[];
  const evs = (s.evaluaciones||[]).slice().sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const fam = [];
  const lastSug = evs.find(e=>e.sugerencias); if(lastSug) fam.push(`Sugerencias de la última evaluación (${lastSug.tipo.toLowerCase()}): ${lastSug.sugerencias}`);
  if(s.paec?.apoyos?.length) fam.push(`Mantener en casa los apoyos acordados en el PAEC: ${s.paec.apoyos.join(', ').toLowerCase()}.`);
  if(s.paec?.bienestar) fam.push(`Actividades que le ayudan a calmarse: ${s.paec.bienestar}`);
  if(s.paec?.gatillantes) fam.push(`Avisar al colegio si en casa aparecen nuevas situaciones que le generan malestar. Hoy sabemos que le afectan: ${s.paec.gatillantes}`);
  if(s.pai?.compromisos) fam.push(`Compromiso acordado con la familia: ${s.pai.compromisos}`);
  if(aus.length) fam.push(`Hubo ${aus.length} ${aus.length===1?'sesión':'sesiones'} a las que no asistió en el período. La asistencia regular es clave para su avance.`);
  fam.push('Mantener actualizados los teléfonos de contacto en el colegio.');
  if(kind==='familia') return fam.join('\n');
  const trab = [];
  obj.forEach((o,i)=>{ const n = real.filter(x=>String(x.objetivo)===String(i)).length; const area = o.area||'objetivo '+(i+1);
    if(o.estado==='Logrado') trab.push(`Objetivo logrado en ${area}: proponer un nuevo objetivo o aumentar el nivel de exigencia.`);
    else if(o.estado==='No iniciado') trab.push(`Objetivo sin iniciar en ${area}: calendarizar sesiones o revisar su pertinencia.`);
    else if(!n) trab.push(`Objetivo de ${area} sin sesiones vinculadas en el período: vincular las sesiones para mostrar el trabajo realizado.`); });
  const sinObj = real.filter(x=>x.objetivo===''||x.objetivo==null).length; if(sinObj && obj.length) trab.push(`${sinObj} ${sinObj===1?'sesión realizada no está vinculada':'sesiones realizadas no están vinculadas'} a un objetivo del PAI.`);
  const sinResp = real.filter(x=>!x.respuesta).length; if(sinResp) trab.push(`${sinResp} ${sinResp===1?'sesión no registra':'sesiones no registran'} la respuesta del estudiante. Completar ese campo fortalece la evidencia.`);
  if(!real.length) trab.push('No hay sesiones realizadas en el período. Registrar cada intervención con fecha, objetivo y respuesta del estudiante.');
  if(decs.length>=2) trab.push(`Se registraron ${decs.length} episodios de desregulación en el período. Revisar gatillantes y actualizar el eje reactivo del PAEC con la familia.`);
  if(decs.some(x=>x.etapa==='3')) trab.push('Hubo un episodio en etapa 3. Verificar que el registro indique adultos que intervinieron, medidas adoptadas y aviso inmediato a la familia.');
  if(evs[0] && diffDays(evs[0].fecha) < -365) trab.push('La última evaluación tiene más de un año. Programar una reevaluación o pedir un informe actualizado al especialista tratante.');
  if(!evs.length) trab.push('No hay evaluaciones registradas. Registrar la evaluación de ingreso o el informe externo recibido.');
  if(teaDate(s) && !s.paec?.fechaElaboracion) trab.push(`Elaborar el PAEC antes del ${fmt(addDays(teaDate(s),14))}.`);
  if(s.paec?.proximaRevision && diffDays(s.paec.proximaRevision)>=0 && diffDays(s.paec.proximaRevision)<=30) trab.push(`La revisión del PAEC vence el ${fmt(s.paec.proximaRevision)}: coordinar la reunión con la familia.`);
  if(s.pai?.proximaRevision && diffDays(s.pai.proximaRevision)<0) trab.push(`La revisión del PAI venció el ${fmt(s.pai.proximaRevision)}.`);
  const adp = (s.adaptadas||[]).filter(x=>inR(x.fecha) && x.estado==='Aplicada');
  const noAc = adp.filter(x=>x.cumplimiento && x.cumplimiento!=='Se aplicó según lo acordado');
  if(noAc.length) trab.push(`${noAc.length} ${noAc.length===1?'evaluación no aplicó':'evaluaciones no aplicaron'} completas las adecuaciones acordadas (${noAc.map(x=>x.asignatura).join(', ')}). Revisar con los docentes cómo asegurar su aplicación.`);
  const sinInf = adp.filter(x=>!x.informado); if(sinInf.length) trab.push(`${sinInf.length} ${sinInf.length===1?'resultado de evaluación adaptada no ha sido informado':'resultados de evaluaciones adaptadas no han sido informados'} a la familia.`);
  if(teaDate(s) && s.paec?.fechaElaboracion && !(s.paec.evalAdapt||[]).length) trab.push('El PAEC no define adecuaciones para evaluaciones. Acordarlas con la familia y la jefatura técnica.');
  const evi = obligations(s).filter(o=>o.st!=='ok' && (o.st!=='pend' || diffDays(o.plazo)<=30)).map(obRec);
  const blocks = [];
  if(evi.length) blocks.push('# Respaldo documental\n'+evi.join('\n'));
  if(trab.length) blocks.push('# Trabajo con el estudiante\n'+trab.join('\n'));
  if(kind==='expediente') blocks.push('# Para la familia\n'+fam.join('\n'));
  return blocks.join('\n');
}

    h += `<div class="ack"><b>Acuse de recibo</b><p>Declaro haber recibido y conocido el presente informe${meta.folio?' (folio '+esc(meta.folio)+')':''} sobre ${esc(s.nombre)}.</p>${signs([[ap.nombre||'Nombre del apoderado', (ap.parentesco||'Apoderado')+' · RUN: ____________'],['Fecha de recepción','____ / ____ / ______'],[profName(s.referente),'Profesional UAA']])}</div>`;

    h += `<h2>Sesiones del período</h2>${sesTable()}`;
    h += `<h2>Evaluaciones adaptadas</h2>${adTable(false)}`;

    h += signs([[whoName(S.data.usuario),'Emite'],['Coordinación UAA',''],['Jefatura técnica','']]);
  }
  if(kind==='acta'){
    const c = (s.comunicaciones||[]).find(x=>x.id===o.item) || {};

    h += rHead(presencial?'Acta de entrevista con la familia':'Constancia de comunicación con la familia', esc(s.nombre)+' · '+esc(cursoOf(s)), meta);
    h += rkv([['Fecha', fmt(c.fecha)+(c.hora?' · '+c.hora:'')],['Medio',c.tipo],['Motivo',c.motivo,1],['Profesional a cargo',profName(c.profesional)],['Otros participantes del colegio',c.otros],['Asistentes por la familia',c.familiares,1]]);
    h += `<h2>Temas tratados</h2><p class="pre">${esc(c.temas||'—')}</p><h2>Acuerdos y compromisos</h2><p class="pre">${esc(c.acuerdos||'—')}</p>`;
    h += `<h2>Documentos entregados</h2>${(c.documentos||[]).length?`<ul>${c.documentos.map(d=>`<li>${esc(d)}</li>`).join('')}</ul>`:'<p class="muted">Ninguno.</p>'}`;
    h += `<h2>Recepción</h2>${rkv([['Respuesta de la familia',c.respuesta],['Fecha del acuse',c.fechaAcuse?fmt(c.fechaAcuse):''],['Medio de verificación',c.verificacion,1],['Testigo',c.testigo],['Observaciones',c.observaciones,1]])}`;

  if(kind==='decr'){

    h += rkv([['Fecha', fmt(x.fecha)+(x.hora?' · '+x.hora:'')],['Lugar',x.lugar],['Etapa alcanzada', {'1':'1 · Inicio','2':'2 · Aumento, sin riesgo','3':'3 · Riesgo para sí o terceros'}[x.etapa]||x.etapa],['Adultos que intervinieron',x.responsables]]);
    h += `<h2>Gatillante probable</h2><p class="pre">${esc(x.gatillante||'—')}</p><h2>Descripción</h2><p class="pre">${esc(x.descripcion||'—')}</p><h2>Acciones de acompañamiento</h2><p class="pre">${esc(x.acciones||'—')}</p>`;
    const avisos = (s.comunicaciones||[]).filter(c=>c.fecha>=x.fecha && c.fecha<=addDays(x.fecha,10) && ['Aviso de episodio de desregulación','Entrevista posterior a episodio DEC'].includes(c.motivo));
    h += `<h2>Comunicación con la familia</h2>${rkv([['Familia informada', x.apoderadoInformado?'Sí':'No'],['Fecha del aviso', x.fechaInforme?fmt(x.fechaInforme):'']])}${avisos.length?`<ul>${avisos.map(c=>`<li>${fmt(c.fecha)} · ${esc(c.motivo)} · ${esc(c.tipo)} · ${esc(c.respuesta)}</li>`).join('')}</ul>`:''}`;
    h += `<h2>Aprendizajes y ajustes al PAEC</h2><p class="pre">${esc(x.ajustePAEC||'—')}</p>`;
    if(x.analisis){ const A = x.analisis; const ap = new Set(A.aplicados||[]);
      h += `<h2>Análisis del episodio frente al PAEC</h2><p class="muted">Realizado el ${esc(fmtTs(A.fecha))} por ${esc(whoName(A.por))}${A.aplicadoEn?' · ajustes aplicados al PAEC el '+esc(fmtTs(A.aplicadoEn)):''}.</p>`;
      if((A.hallazgos||[]).length) h += `<table><thead><tr><th>Hallazgo</th><th>Origen</th><th>Nivel</th><th>Resultado</th></tr></thead><tbody>${A.hallazgos.map(z=>`<tr><td><b>${esc(z.titulo)}</b><br>${esc(z.detalle||'')}</td><td>${z.origen==='claude'?'Sugerido por Claude':'Detectado por la app'}</td><td>${esc({alta:'Prioritario',media:'Revisar',info:'Observación'}[z.nivel]||'')}</td><td>${ap.has(z.id)?'Aplicado al PAEC':'Revisado'}</td></tr>`).join('')}</tbody></table>`;
      if(A.claudeResumen) h += `<p class="note">Síntesis sugerida por Claude y revisada por el equipo: ${esc(A.claudeResumen)}</p>`; }
    if(s.paec?.fechaElaboracion) h += `<p class="note">Respuesta acordada en el PAEC para la etapa ${esc(x.etapa)}: ${esc(s.paec['etapa'+x.etapa]||'no registrada')}</p>`;
    h += signs([['Adulto a cargo del episodio',''],[profName(s.referente),'Profesional referente'],['Equipo de gestión','Toma conocimiento']]);
  }
  if(kind==='docf') h += docForSign(s, o.item, meta);
  return `<div class="rpt">${h}${rFoot(meta)}</div>`;
}

async function emitReport(mode){
  const r = S.rep, s = stu(r.sid), K = {...RKINDS[r.kind]}; if(r.kind==='docf') K.t = DOC_LONG[r.item];
  S.data.folio = (S.data.folio||0) + 1; const folio = `UAA-${TODAY.getFullYear()}-${String(S.data.folio).padStart(4,'0')}`;
  const ts = nowIso(); const inner = buildReport(r.kind, s, r, {folio, ts});
  const who = s ? s.nombre : r.kind==='bitacora' ? profName(String(r.item).split('|')[0])+' '+String(r.item).split('|')[1] : (r.kind==='direccion' ? kpiRange().lbl : r.kind==='reunion' ? 'reunión '+((S.data.reuniones||[]).find(x=>x.id===r.item)?.fecha||'') : (grp(r.item)?.nombre||'')); const title = `${K.t} · ${who}`;
  const detalle = `${K.t} · folio ${folio}${K.periodo?` · ${fmtShort(r.desde)} a ${fmtShort(r.hasta)}`:''} · ${mode==='save'?'descargado':'copiado'}`;
  const done = () => { logEv(s ? s.id : '', 'Emitió informe', detalle); persist(); };
  if(mode==='save'){
    try{ await S.dl.save({filename:`${slug(K.t)}_${slug(who)}_${D(0)}.html`, data: fullDoc(inner, title)}); done(); S.rep = null; render(); toast('Informe '+folio+' descargado. Ábrelo y usa Imprimir'); }
    catch(e){ S.data.folio--; toast(e?.code==='declined' ? 'Descarga cancelada' : 'No se pudo descargar. Usa Copiar para Word', true); }
    return;
  }
  const htmlDoc = `<html><head><meta charset="utf-8"><style>${RPT_CSS}</style></head><body>${inner}</body></html>`;
  const tmp = document.createElement('div'); tmp.innerHTML = inner; const plain = tmp.innerText;
  try{ await navigator.clipboard.write([new ClipboardItem({'text/html': new Blob([htmlDoc],{type:'text/html'}), 'text/plain': new Blob([plain],{type:'text/plain'})})]); done(); S.rep = null; render(); toast('Informe '+folio+' copiado. Pégalo en Word o Docs'); }
  catch(e){ try{ await navigator.clipboard.writeText(plain); done(); S.rep = null; render(); toast('Copiado como texto (folio '+folio+')'); } catch(e2){ S.data.folio--; toast('No se pudo copiar. Selecciona el texto de la vista previa', true); } }
}

function acordadas(s){
  const p = s.paec||{}, c = s.paci||{}; const src = {};
  const put = (a, o) => { (src[a] = src[a] || new Set()).add(o); };
  (p.evalAdapt||[]).forEach(a=>put(a,'PAEC'));
  if(!(p.evalAdapt||[]).length) (p.apoyos||[]).forEach(ap=>(MAP_APOYO[ap]||[]).forEach(a=>put(a,'Apoyos del PAEC')));
  (c.acceso||[]).forEach(ac=>(MAP_PACI[ac]||[]).forEach(a=>put(a,'PACI')));
  if((c.asignaturas||[]).length) put('Objetivos priorizados según PACI','PACI');
  return Object.entries(src).map(([a,set])=>({a, src:[...set]}));
}

function vAdaptadas(s){
  const acc = acordadas(s); const L = (s.adaptadas||[]); const Y = String(TODAY.getFullYear());
  const apl = L.filter(x=>x.estado==='Aplicada' && x.fecha.startsWith(Y)); const ok = apl.filter(x=>x.cumplimiento==='Se aplicó según lo acordado').length;
  const prox = L.filter(x=>x.estado!=='Aplicada' && diffDays(x.fecha)>=0).length;
  const pct = apl.length ? Math.round(ok/apl.length*100) : null; const col = pct==null?'var(--faint)':pct>=85?'var(--ok)':pct>=60?'var(--warn)':'var(--crit)';
  const sinAcuerdo = !(s.paec?.evalAdapt||[]).length;
  return `<div class="stack">
  <section class="glass card"><div class="quick">
    <div class="ring sm" style="--p:${pct??0};--c:${col}"><b>${pct==null?'—':pct+'%'}</b></div>
    <div style="flex:1;min-width:220px"><p class="eyebrow">Evaluaciones ${Y}</p><h2 style="margin:2px 0 6px">${apl.length} aplicadas con adecuaciones</h2><div class="chips"><span class="pill ok">${ok} según lo acordado</span><span class="pill warn">${apl.length-ok} con diferencias</span><span class="pill info">${prox} próximas</span></div></div>
    <button class="btn primary" data-act="add-item" data-coll="adaptadas">${ic('plus')} Registrar evaluación</button></div></section>
  <section class="glass card"><header><h2>Adecuaciones acordadas para evaluar</h2>${s.paec?.fechaElaboracion?`<button class="btn sm" data-act="tab" data-tab="paec">${ic('edit','sm')} Editar en el PAEC</button>`:''}</header>
    ${acc.length?`<div class="chips">${acc.map(o=>`<span class="chip ico" title="Origen: ${esc(o.src.join(', '))}">${ic('check')}${esc(o.a)} <span class="muted small">· ${esc(o.src.join(', '))}</span></span>`).join('')}</div>`:'<p class="empty">No hay adecuaciones acordadas. Defínelas en el PAEC (sección Adecuaciones para evaluaciones) o en el PACI.</p>'}
    ${sinAcuerdo && acc.length?'<p class="small muted" style="margin-top:10px">El PAEC no define adecuaciones para evaluar; estas se sugieren a partir de sus apoyos y del PACI. Conviene acordarlas explícitamente con la familia.</p>':''}
    ${s.paec?.evalDetalle?`<p class="small" style="margin-top:10px">${esc(s.paec.evalDetalle)}</p>`:''}</section>
  <section>${vColl(s,'adaptadas',true)}</section></div>`;
}

function medCheck(x){
  const falta = [], graves = [];
  const dur = x.fechaInicio && x.fechaTermino ? Math.round((parse(x.fechaTermino)-parse(x.fechaInicio))/86400000) : null;
  if(x.finalidad==='Disciplinaria' && x.asociadaCondicion!=='No') graves.push('No puede aplicarse como sanción a conductas asociadas a la condición (Circular 586)');
  if(!x.fundamento) falta.push('Fundamento');
  if(!x.fechaTermino) falta.push('Fecha de término');
  if(!x.acuerdoEscrito) falta.push('Acuerdo escrito con la familia');
  if(!x.planReintegro) falta.push('Plan de reincorporación');
  if(!x.revision) falta.push('Fecha de revisión');
  if(x.tipo==='Acompañamiento en aula por el apoderado' && !x.voluntaria) falta.push('Aceptación voluntaria de la familia');
  if(dur!=null && dur>30 && !x.especialista) falta.push('Recomendación del especialista (más de 30 días)');
  return {falta, graves, dur};
}
function medAlerts(s){
  const out = []; const push = (lvl,t,d) => out.push({lvl, t, d, tab:'medidas', sid:s.id, nombre:s.nombre});
  (s.medidas||[]).filter(x=>x.estado!=='Finalizada' && x.estado!=='Suspendida').forEach(x=>{
    const c = medCheck(x);
    c.graves.forEach(g=>push('crit', `${x.tipo}: medida no permitida`, g));
    if(c.falta.length) push('crit', `${x.tipo} sin los requisitos obligatorios`, 'Falta: '+c.falta.join(', ')+'.');

  });
  return out;
}

/* ================= Análisis de episodios DEC frente al PAEC ================= */
const nrm = t => String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const STOPW = new Set('para como cuando donde desde esta este estos estas pero porque sobre entre hasta tiene tienen hacer estaba estuvo durante antes despues otro otra otros otras muy mas menos todo toda todos todas sus una unos unas del las los con sin por que ante tras cada ser son fue han hay cuando mientras luego'.split(' '));
const toks = t => new Set(nrm(t).split(/[^a-z0-9ñ]+/).filter(w=>w.length>=4 && !STOPW.has(w)).map(w=>w.slice(0,6)));
const overlapN = (a,b) => { const B = toks(b); let n = 0; toks(a).forEach(w=>{ if(B.has(w)) n++; }); return n; };
const hasAny = (t, arr) => { const x = nrm(t); return arr.some(k=>x.includes(k)); };
const hmin = h => { const m = /^(\d{1,2}):(\d{2})/.exec(h||''); return m ? (+m[1])*60+(+m[2]) : null; };
const PAEC_LBL = Object.fromEntries(SCHEMA.paec.flatMap(s=>s.fields).map(f=>[f.k,f.l]));
const AN_TEXT_FIELDS = ['apoyosDetalle','fortalezas','disfrute','bienestar','habilidades','antecedentes','gatillantes','precursores','manifestacion','resguardo','etapa1','etapa2','etapa3','reincorporacion'];
const NIVEL_TXT = {alta:'Prioritario', media:'Revisar', info:'Observación'};
const NIVEL_PILL = {alta:'crit', media:'warn', info:'info'};

function analyzeDEC(s, x){
  const p = s.paec || {}; const H = []; const add = h => H.push({origen:'reglas', ...h});
  const tag = `[${fmtShort(x.fecha)}]`;
  const all = (s.dec||[]).filter(y=>y.fecha).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const win = all.filter(y=>y.fecha<=x.fecha && y.fecha>=addDays(x.fecha,-60));
  const others = win.filter(y=>y.id!==x.id);
  const pat = [];
  if(!p.fechaElaboracion){
    add({id:'sin-paec', nivel:'alta', titulo:'El estudiante no tiene PAEC', detalle: teaDate(s) ? `Es obligatorio para estudiantes autistas y el plazo vence el ${fmt(addDays(teaDate(s),14))}.` : 'Las orientaciones Mineduc recomiendan un PAEC para cualquier estudiante que necesite acompañamiento en su regulación.', campo:null, propuesta:'Elaborar el PAEC con la familia usando lo aprendido en este episodio: gatillante, señales previas y acciones que funcionaron.'});
  } else {
    // gatillante
    if(x.gatillante){
      const ov = overlapN(x.gatillante, p.gatillantes);
      if(!p.gatillantes || ov===0) add({id:'gat-nuevo', nivel:'media', titulo:'El gatillante no está previsto en el PAEC', detalle:`Episodio: "${trunc(x.gatillante,140)}". PAEC: ${p.gatillantes?'"'+trunc(p.gatillantes,140)+'"':'sin gatillantes registrados'}.`, campo:'gatillantes', propuesta:x.gatillante});
      else add({id:'gat-conocido', nivel:'media', titulo:'Gatillante conocido, pero el episodio ocurrió igual', detalle:'El PAEC ya identifica este gatillante. Conviene revisar si las medidas preventivas se aplicaron o si no bastan.', campo:'apoyosDetalle', propuesta:`Reforzar la prevención ante: ${String(x.gatillante).trim().replace(/[.\s]+$/,'')}. Definir quién anticipa y cómo.`});
    }
    // respuesta por etapa
    const et = String(x.etapa||''); const plan = p['etapa'+et];
    if(et && !plan) add({id:'etapa-vacia', nivel:'alta', titulo:`El PAEC no define la respuesta para: ${etapaTxt(et).toLowerCase()}`, detalle:'El equipo actuó sin una respuesta acordada con la familia para esta etapa.', campo:'etapa'+et, propuesta: x.acciones ? `Según lo que funcionó: ${x.acciones}` : 'Definir con la familia qué hacer en esta etapa, quién lo hace y dónde.'});
    else if(et && x.acciones && overlapN(x.acciones, plan) < 2) add({id:'etapa-difiere', nivel:'media', titulo:`Las acciones difieren de la respuesta prevista (${etapaTxt(et).toLowerCase()})`, detalle:`Previsto: "${trunc(plan,140)}". Realizado: "${trunc(x.acciones,140)}". Puede que el plan no se haya aplicado (difundirlo al equipo) o que haya que actualizarlo.`, campo:'etapa'+et, propuesta:`Incorporar lo realizado en el episodio: ${x.acciones}`});
    // señales tempranas y resguardo
    if(!p.precursores) add({id:'precursores', nivel:'media', titulo:'El PAEC no registra señales tempranas', detalle:'Sin señales previas identificadas, el equipo no puede intervenir en la etapa 1.', campo:'precursores', propuesta: x.descripcion ? `Observado antes o al inicio del episodio: ${x.descripcion}` : 'Registrar las conductas observadas antes del episodio.'});
    if(!p.resguardo) add({id:'resguardo', nivel:'media', titulo:'El PAEC no indica espacios de resguardo', detalle:'Conviene dejar escrito dónde y con quién se acompaña al estudiante.', campo:'resguardo', propuesta: x.acciones ? `Lo que funcionó en este episodio: ${x.acciones}` : 'Definir un espacio de calma y el adulto que acompaña.'});
    // gatillantes típicos
    const txt = (x.gatillante||'')+' '+(x.descripcion||'');
    if(hasAny(txt,['ruido','sonid','timbre','grit','volumen','luz','luces','olor','textur','multitud','aglomer']) && !(p.apoyos||[]).includes('Reducción de estímulos sensoriales'))
      add({id:'sens', nivel:'media', titulo:'Gatillante sensorial sin apoyo de reducción de estímulos', detalle:'El episodio se asocia a estímulos sensoriales y el PAEC no incluye reducción de estímulos entre los apoyos.', campo:'apoyos', propuesta:'Reducción de estímulos sensoriales'});
    if(hasAny(txt,['cambio','sin aviso','imprevist','transic','reemplaz','suplente','rutina']) && !(p.apoyos||[]).includes('Anticipación de cambios'))
      add({id:'cambios', nivel:'media', titulo:'Gatillante asociado a cambios sin anticipación', detalle:'El episodio se vincula a un cambio de rutina y el PAEC no incluye anticipación de cambios.', campo:'apoyos', propuesta:'Anticipación de cambios'});
    if(hasAny(txt,['esper','turno','fila']))
      add({id:'espera', nivel:'info', titulo:'Episodio asociado a tiempos de espera', detalle:'Las esperas largas aparecen como detonante.', campo:'apoyosDetalle', propuesta:'Anticipar las esperas con un apoyo visual (temporizador o pictograma) y ofrecer una tarea breve mientras espera.'});
    if(hasAny(txt,['perd','error','frustr','corregi','nota ','no le result']))
      add({id:'frustr', nivel:'info', titulo:'Episodio asociado a frustración', detalle:'El detonante se relaciona con perder, equivocarse o ser corregido.', campo:'habilidades', propuesta:'Trabajar tolerancia a la frustración con situaciones graduadas y un guion para pedir ayuda.'});
    if(hasAny(txt,['compañer','pelea','conflict','burla','empuj','molest']))
      add({id:'social', nivel:'info', titulo:'Episodio asociado a una interacción con pares', detalle:'Conviene revisar el acompañamiento en espacios compartidos.', campo:'apoyosDetalle', propuesta:'Acompañamiento de un adulto en recreos o trabajos grupales y mediación breve con los compañeros involucrados.'});
    if(hasAny(txt+' '+(x.lugar||''),['prueba','evaluaci','examen','disertaci','control'])){
      const ea = p.evalAdapt||[]; const need = ['Anticipación de la evaluación','Sala o espacio alternativo','Pausas durante la evaluación'].find(a=>!ea.includes(a));
      add({id:'eval', nivel:'media', titulo:'Episodio asociado a una evaluación', detalle: ea.length ? `El PAEC acuerda para evaluar: ${ea.join(', ')}. Revisa en la pestaña Evaluaciones adaptadas si se aplicaron.` : 'El PAEC no define adecuaciones para evaluaciones.', campo: need ? 'evalAdapt' : null, propuesta: need || 'Verificar con el docente que las adecuaciones acordadas se apliquen en cada evaluación.'});
    }
    // revisión
    if(x.ajustePAEC && !(p.revisiones||[]).some(r=>r.fecha>=x.fecha)) add({id:'ajuste-pend', nivel:'media', titulo:'El registro propone un ajuste que no se incorporó al PAEC', detalle:`Ajuste anotado en el episodio: "${trunc(x.ajustePAEC,160)}".`, campo:'apoyosDetalle', propuesta:x.ajustePAEC});
  }
  // etapa 3
  if(x.etapa==='3') add({id:'etapa3', nivel:'alta', titulo:'Episodio con riesgo para sí o para terceros', detalle:`Verificar que el registro indique adultos que intervinieron (${x.responsables?'registrado':'no registrado'}), medidas adoptadas y aviso inmediato a la familia. Revisar las señales tempranas para intervenir antes.`, campo: p.fechaElaboracion ? 'etapa2' : null, propuesta:'Intervenir antes de que escale: al observar las primeras señales, retirar la demanda y acompañar al espacio de calma.'});
  // recurrencia y patrones
  if(win.length>=2){
    pat.push(`${win.length} episodios en 60 días`);
    add({id:'recurrencia', nivel: win.length>=3?'alta':'media', titulo:`${win.length} episodios en los últimos 60 días`, detalle:'La repetición indica que el plan preventivo no está siendo suficiente o que hay un gatillante no identificado.', campo: p.fechaElaboracion ? 'apoyosDetalle' : null, propuesta:'Revisar el PAEC con la familia y el equipo de aula, y registrar las condiciones de cada episodio para encontrar el patrón.'});
    const sameL = others.filter(y=>y.lugar && x.lugar && overlapN(y.lugar,x.lugar)>0);
    if(sameL.length){ pat.push(`Lugar repetido: ${x.lugar}`); add({id:'lugar', nivel:'media', titulo:`Se repite el lugar: ${x.lugar}`, detalle:`${sameL.length+1} episodios en el mismo espacio.`, campo: p.fechaElaboracion ? 'apoyosDetalle' : null, propuesta:`Ajustar el entorno en ${x.lugar}: anticipación, acompañamiento de un adulto o una alternativa a ese espacio.`}); }
    const hm = hmin(x.hora); const sameH = hm==null ? [] : others.filter(y=>{ const o = hmin(y.hora); return o!=null && Math.abs(o-hm)<=45; });
    if(sameH.length){ pat.push(`Horario frecuente: cerca de las ${x.hora}`); add({id:'hora', nivel:'media', titulo:`Los episodios ocurren cerca de las ${x.hora}`, detalle:`${sameH.length+1} episodios en la misma franja horaria.`, campo: p.fechaElaboracion ? 'apoyosDetalle' : null, propuesta:`Anticipar la transición de las ${x.hora} y ofrecer una pausa o apoyo antes de ese momento.`}); }
    const sameG = others.filter(y=>overlapN(y.gatillante, x.gatillante)>0);
    if(sameG.length) pat.push(`Gatillante repetido en ${sameG.length+1} episodios`);
    const last30 = all.filter(y=>y.fecha>addDays(x.fecha,-30) && y.fecha<=x.fecha).length, prev30 = all.filter(y=>y.fecha>addDays(x.fecha,-60) && y.fecha<=addDays(x.fecha,-30)).length;
    if(last30>prev30 && prev30>0){ pat.push('Tendencia al alza'); add({id:'tendencia', nivel:'media', titulo:'Aumentan los episodios', detalle:`${last30} en los últimos 30 días frente a ${prev30} en los 30 anteriores.`, campo:null, propuesta:'Solicitar a la familia información reciente (cambios en casa, sueño, tratamiento) y, si corresponde, coordinar con el especialista tratante.'}); }
  } else pat.push(win.length===1 ? 'Primer episodio en 60 días' : 'Sin episodios previos');
  // familia y revisión
  if(!x.apoderadoInformado) add({id:'familia', nivel:'alta', titulo:'La familia no ha sido informada', detalle:'El protocolo exige avisar el mismo día. Sin ese aviso el registro queda incompleto como evidencia.', campo:null, propuesta:'Llamar a la familia hoy y registrar la comunicación con su acuse en la pestaña Familia.'});
  if(p.fechaElaboracion && H.some(h=>h.nivel!=='info' && h.campo) && (!p.proximaRevision || diffDays(p.proximaRevision)>14))
    add({id:'revision', nivel:'info', titulo:'Adelantar la revisión del PAEC', detalle:`La próxima revisión está fijada ${p.proximaRevision?'para el '+fmt(p.proximaRevision):'sin fecha'}. Con estos hallazgos conviene revisarlo antes con la familia.`, campo:'proximaRevision', propuesta:addDays(D(0),7)});
  const ord = {alta:0, media:1, info:2};
  return {hall: H.sort((a,b)=>ord[a.nivel]-ord[b.nivel]), pat};
}

/* ---------- abrir, guardar y aplicar ---------- */
function openAnalysis(sid, did){
  const s = stu(sid), x = (s.dec||[]).find(y=>y.id===did); if(!x) return;
  const {hall, pat} = analyzeDEC(s, x); const prevA = x.analisis || {};
  const sel = {}, prop = {};
  const applied = new Set(prevA.aplicados||[]);
  hall.forEach(h=>{ if(h.campo && !applied.has(h.id) && h.nivel!=='info') sel[h.id] = true; });
  (prevA.claude||[]).forEach(h=>hall.push({...h}));
  S.an = {sid, did, hall, pat, sel, prop, applied, cl: prevA.claudeResumen ? {resumen:prevA.claudeResumen, preguntas:prevA.preguntas||[]} : null, chat: (prevA.chat||[]).slice(), chatBusy:false};
  S.form = null; S.modal = null; S.rep = null; render();
}
function anSnapshot(){
  const a = S.an; const s = stu(a.sid), x = s.dec.find(y=>y.id===a.did);
  x.analisis = {...(x.analisis||{}), fecha:nowIso(), por:S.data.usuario||'',
    hallazgos: a.hall.map(h=>({id:h.id, origen:h.origen, nivel:h.nivel, titulo:h.titulo, detalle:h.detalle})),
    claude: a.hall.filter(h=>h.origen==='claude'), claudeResumen: a.cl?.resumen||'', preguntas: a.cl?.preguntas||[],
    chat: a.chat.filter(m=>m.content).map(m=>({role:m.role, content:m.content, ts:m.ts})), aplicados:[...a.applied]};
  return {s, x};
}
function anSave(){ const {s, x} = anSnapshot(); stamp(x); logEv(s.id,'Analizó episodio',`episodio del ${fmt(x.fecha)} frente al PAEC · ${S.an.hall.length} hallazgos`); persist(); S.an = null; keepScroll(render); toast('Análisis guardado en el registro del episodio'); }
function anApply(){
  const a = S.an; const s = stu(a.sid), x = s.dec.find(y=>y.id===a.did); const p = s.paec;
  const chosen = a.hall.filter(h=>a.sel[h.id] && h.campo && !a.applied.has(h.id));
  if(!p?.fechaElaboracion || !chosen.length) return;
  const tag = `[${fmtShort(x.fecha)}]`;
  chosen.forEach(h=>{ const val = String(a.prop[h.id] ?? h.propuesta).trim(); if(!val) return;
    if(['apoyos','evalAdapt'].includes(h.campo)) p[h.campo] = [...new Set([...(p[h.campo]||[]), val])];
    else if(h.campo==='proximaRevision') p.proximaRevision = val;
    else p[h.campo] = (p[h.campo] ? p[h.campo]+'\n' : '') + `${tag} ${val}`;
    a.applied.add(h.id); });
  const resumen = `Ajustes tras el episodio del ${fmt(x.fecha)}: ${chosen.map(h=>h.titulo+(h.campo?' ('+(PAEC_LBL[h.campo]||h.campo).toLowerCase()+')':'')).join('; ')}.`;
  p.revisiones = p.revisiones||[]; p.revisiones.push({fecha:D(0), cambios:resumen});
  stamp(p); x.ajustePAEC = (x.ajustePAEC ? x.ajustePAEC+'\n' : '') + resumen;
  const snap = anSnapshot(); snap.x.analisis.aplicadoEn = nowIso(); stamp(snap.x);
  logEv(s.id,'Ajustó PAEC',resumen); persist(); S.an = null; keepScroll(render);
  toast('PAEC actualizado. Informa el cambio a la familia');
}

function weekSummary(prof, mon){
