/* ---------- abrir, guardar y aplicar ---------- */
function openAnalysis(sid, did){
  const s = stu(sid), x = (s.dec||[]).find(y=>y.id===did); if(!x) return;
  const {hall, pat} = analyzeDEC(s, x); const prevA = x.analisis || {};
  const sel = {}, prop = {};
  const applied = new Set(prevA.aplicados||[]);
  hall.forEach(h=>{ if(h.campo && !applied.has(h.id) && h.nivel!=='info') sel[h.id] = true; });
  (prevA.claude||[]).forEach(h=>hall.push({...h}));
  S.an = {sid, did, hall, pat, sel, prop, applied, cl: prevA.claudeResumen ? {resumen:prevA.claudeResumen, preguntas:prevA.preguntas||[]} : null, chat: (prevA.chat||[]).slice(), chatBusy:false};
  S.form = null; S.modal = null; S.rep = null; render();
}
function anSnapshot(){
  const a = S.an; const s = stu(a.sid), x = s.dec.find(y=>y.id===a.did);
  x.analisis = {...(x.analisis||{}), fecha:nowIso(), por:S.data.usuario||'',
    hallazgos: a.hall.map(h=>({id:h.id, origen:h.origen, nivel:h.nivel, titulo:h.titulo, detalle:h.detalle})),
    claude: a.hall.filter(h=>h.origen==='claude'), claudeResumen: a.cl?.resumen||'', preguntas: a.cl?.preguntas||[],
    chat: a.chat.filter(m=>m.content).map(m=>({role:m.role, content:m.content, ts:m.ts})), aplicados:[...a.applied]};
  return {s, x};
}
function anSave(){ const {s, x} = anSnapshot(); stamp(x); logEv(s.id,'Analizó episodio',`episodio del ${fmt(x.fecha)} frente al PAEC · ${S.an.hall.length} hallazgos`); persist(); S.an = null; keepScroll(render); toast('Análisis guardado en el registro del episodio'); }
function anApply(){
  const a = S.an; const s = stu(a.sid), x = s.dec.find(y=>y.id===a.did); const p = s.paec;
  const chosen = a.hall.filter(h=>a.sel[h.id] && h.campo && !a.applied.has(h.id));
  if(!p?.fechaElaboracion || !chosen.length) return;
  const tag = `[${fmtShort(x.fecha)}]`;
  chosen.forEach(h=>{ const val = String(a.prop[h.id] ?? h.propuesta).trim(); if(!val) return;
    if(['apoyos','evalAdapt'].includes(h.campo)) p[h.campo] = [...new Set([...(p[h.campo]||[]), val])];
    else if(h.campo==='proximaRevision') p.proximaRevision = val;
    else p[h.campo] = (p[h.campo] ? p[h.campo]+'\n' : '') + `${tag} ${val}`;
    a.applied.add(h.id); });
  const resumen = `Ajustes tras el episodio del ${fmt(x.fecha)}: ${chosen.map(h=>h.titulo+(h.campo?' ('+(PAEC_LBL[h.campo]||h.campo).toLowerCase()+')':'')).join('; ')}.`;
  p.revisiones = p.revisiones||[]; p.revisiones.push({fecha:D(0), cambios:resumen});
  stamp(p); x.ajustePAEC = (x.ajustePAEC ? x.ajustePAEC+'\n' : '') + resumen;
  const snap = anSnapshot(); snap.x.analisis.aplicadoEn = nowIso(); stamp(snap.x);
  logEv(s.id,'Ajustó PAEC',resumen); persist(); S.an = null; keepScroll(render);
  toast('PAEC actualizado. Informa el cambio a la familia');
}

function weekSummary(prof, mon){
  const auto = weekAuto(prof, mon); const b = bitRec(prof, mon); const man = b?.items||[];
  const dir = auto.filter(a=>a.directa).reduce((t,a)=>t+(a.min||0),0);
  const manMin = man.reduce((t,i)=>t+(+i.minutos||0),0);
  const est = new Set([...auto.filter(a=>a.sid).map(a=>a.sid), ...man.filter(i=>i.sid).map(i=>i.sid)]);
  (S.data.refSesiones||[]).forEach(r=>{ const g = grp(r.gid); if(g && (r.profesional||g.profesional)===prof && r.fecha>=mon && r.fecha<=addDays(mon,6)) Object.entries(r.asis||{}).forEach(([k,v])=>{ if(v.a==='P') est.add(k); }); });
  const contr = (S.data.equipo.find(p=>p.id===prof)||{}).horas;
  return {auto, man, b, dir, manMin, total: dir+manMin+auto.filter(a=>a.cuenta).reduce((t,a)=>t+(a.min||0),0), est: est.size, fam: auto.filter(a=>a.tipo==='Comunicación con familia').length, contr};
}

  h += `<h2>Registro de sesiones</h2>${L.length?`<table><thead><tr><th>Fecha</th><th>Contenido</th><th>Actividades</th><th>Asistencia</th></tr></thead><tbody>${L.map(r=>{ const v = Object.values(r.asis||{}); return `<tr><td>${fmtShort(r.fecha)}</td><td>${esc(r.contenido||'')}</td><td>${esc(r.actividades||'')}${r.obs?'<br><i>'+esc(r.obs)+'</i>':''}</td><td>${v.filter(x=>x.a==='P').length} de ${v.length}</td></tr>`; }).join('')}</tbody></table>`:'<p class="muted">Sin sesiones en el período.</p>'}`;
  h += signs([[profName(g.profesional),'Profesional a cargo'],['Coordinación UAA',''],['Jefatura técnica','']]);

function buildBitacora(o, meta){
  const [prof, mon] = String(o.item).split('|'); const W = weekSummary(prof, mon); const b = W.b; const p = S.data.equipo.find(x=>x.id===prof)||{};

  const rows = [...W.auto.map(a=>({...a, origen:'Automático'})), ...W.man.map(i=>({fecha:i.fecha, tipo:i.tipo, desc:bitDesc(i)+(i.sid&&stu(i.sid)?' · '+stu(i.sid).nombre:''), min:+i.minutos||0, origen:'Manual'}))].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  h += `<h2>Actividades</h2>${rows.length?`<table><thead><tr><th>Fecha</th><th>Tipo</th><th>Descripción</th><th>Tiempo</th><th>Origen</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${fmtShort(r.fecha)}</td><td>${esc(r.tipo)}</td><td>${esc(r.desc)}</td><td>${r.min?hrs(r.min):'—'}</td><td>${r.origen}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">Sin actividades.</p>'}`;

  h += signs([[p.nombre||'Profesional', p.cargo||''],['Coordinación UAA','Toma conocimiento']]);

    case 'rs-new': { const g = grp(S.gid); S.rs = {gid:g.id, draft:{fecha:D(0), hora:g.hora||'', duracion:g.duracion||'', profesional:g.profesional, asis:{}}}; renderModal(); break; }

    case 'rs-save': { const r = S.rs, d = r.draft; if(!d.fecha || !d.contenido){ r.err = 'Completa la fecha y el contenido.'; renderModal(); break; }
      const g = grp(r.gid); const valid = new Set(gEst(g).map(x=>x.id)); Object.keys(d.asis).forEach(k=>{ if(!valid.has(k)) delete d.asis[k]; });
      S.data.refSesiones = S.data.refSesiones||[];

      else S.data.refSesiones.push(stamp({...d, gid:r.gid, id:uid()}, true));
      gEst(g).filter(x=>x.uaa).forEach(x=>logEv(x.sid, d.id?'Editó':'Registró', `sesión de reforzamiento del ${fmt(d.fecha)} · ${g.nombre} · ${({P:'presente',A:'ausente',J:'justificado'})[d.asis[x.id]?.a]||''}`));

      S.data.refSesiones = S.data.refSesiones.filter(x=>x.id!==id); S.arm = null; persist(); rerender(); toast('Sesión eliminada'); break; }
    case 'bw': S.bweek = +el.dataset.d===0 ? monday(D(0)) : addDays(S.bweek, +el.dataset.d); S.arm = null; rerender(); break;

    case 'bit-save': { const b = bitEnsure(S.bprof, S.bweek); b.logros = document.getElementById('bt-logros').value; b.dificultades = document.getElementById('bt-dif').value; b.pendientes = document.getElementById('bt-pend').value; stamp(b); logEv('','Editó',`bitácora de ${profName(S.bprof)} · semana del ${weekLbl(S.bweek)}`); persist(); rerender(); toast('Síntesis guardada'); break; }

      const b = bitEnsure(S.bprof, S.bweek); b.logros = document.getElementById('bt-logros').value; b.dificultades = document.getElementById('bt-dif').value; b.pendientes = document.getElementById('bt-pend').value;
      b.estado = 'Cerrada'; b.cerradaEn = nowIso(); b.cerradaPor = S.data.usuario||''; stamp(b); logEv('','Cerró bitácora',`${profName(S.bprof)} · semana del ${weekLbl(S.bweek)}`); S.arm = null; persist(); rerender(); toast('Semana cerrada'); break; }

  }

const COORD_CARGOS = ['Coordinación UAA','Equipo de gestión'];
const isCoord = pid => (!!S.admin && !!pid && pid===S.data.usuario && !S.adminDir) || COORD_CARGOS.includes((S.data.equipo.find(p=>p.id===pid)||{}).cargo);
function myStudents(pid){
  const set = new Set(); if(!pid) return set;
  S.data.students.forEach(s=>{
    if(s.referente===pid || s.pai?.responsable===pid || s.paci?.responsable===pid || (s.pai?.objetivos||[]).some(o=>o.responsable===pid) || (s.paec?.equipo||[]).some(e=>e.prof===pid)
      || (s.sesiones||[]).some(x=>x.profesional===pid && diffDays(x.fecha)>=-90) || (s.adaptadas||[]).some(x=>x.adaptadaPor===pid && diffDays(x.fecha)>=-90)) set.add(s.id);
  });
  (S.data.grupos||[]).filter(g=>g.profesional===pid).forEach(g=>(g.estudiantes||[]).forEach(e=>{ if(e.sid) set.add(e.sid); }));
  return set;
}
const wdName = f => DIAS[(parse(f).getDay()+6)%7];
function daySchedule(pid, f){
  const out = [];
  S.data.students.forEach(s=>{
    (s.sesiones||[]).forEach(x=>{ if(x.profesional===pid && x.fecha===f) out.push({hora:x.hora||'', t:s.nombre, d:(x.grupoNombre?x.grupoNombre+' · ':'')+(x.modalidad||'Sesión'), estado:x.estado, act:`data-act="open" data-sid="${s.id}" data-tab="sesiones"`, ic:'activity', av:AREA_AV(s.nombre), ini:initials(s.nombre)}); });
    (s.adaptadas||[]).forEach(x=>{ if(x.adaptadaPor===pid && x.fecha===f) out.push({hora:'', t:`Evaluación adaptada: ${x.asignatura}`, d:s.nombre, estado:x.estado, act:`data-act="open" data-sid="${s.id}" data-tab="adaptadas"`, ic:'layers', av:'av2'}); });
  });
  (S.data.grupos||[]).forEach(g=>{ const wd = wdName(f);
    if(g.profesional===pid && (g.dias||[]).includes(wd) && (!g.fechaInicio || f>=g.fechaInicio) && (!g.fechaFin || f<=g.fechaFin)){
      const done = (S.data.refSesiones||[]).some(r=>r.gid===g.id && r.fecha===f);
      out.push({hora:g.hora||'', t:g.nombre, d:`Reforzamiento · ${gEst(g).length} estudiantes${g.sala?' · '+g.sala:''}`, estado: done?'Registrada':'Programada', act:`data-act="go-grupo" data-id="${g.id}"`, ic:'users', av:'av3'}); } });
  return out.sort((a,b)=>(a.hora||'99').localeCompare(b.hora||'99'));
}
function myTasks(pid, mine){
  const T = [];
  const al = allAlerts().filter(a=>mine.has(a.sid));
  S.data.students.forEach(s=>(s.sesiones||[]).forEach(x=>{ if(x.profesional===pid && x.estado==='Programada' && diffDays(x.fecha)<0) T.push({lvl:'warn', t:`Actualizar la sesión del ${fmtShort(x.fecha)}`, d:`${s.nombre} · sigue como programada. Márcala como realizada, suspendida o ausente.`, act:`data-act="open" data-sid="${s.id}" data-tab="sesiones"`}); }));
  (S.data.grupos||[]).filter(g=>g.profesional===pid).forEach(g=>{ for(let i=-7;i<0;i++){ const f = D(i); const wd = (parse(f).getDay()+6)%7; if(wd<5 && (g.dias||[]).includes(DIAS[wd]) && (!g.fechaInicio||f>=g.fechaInicio) && !(S.data.refSesiones||[]).some(r=>r.gid===g.id && r.fecha===f)) T.push({lvl:'warn', t:`Registrar el reforzamiento del ${fmtShort(f)}`, d:`${g.nombre}: no hay asistencia registrada para esa sesión.`, act:`data-act="go-grupo" data-id="${g.id}"`}); } });
  S.data.students.forEach(s=>(s.adaptadas||[]).forEach(x=>{ const d = diffDays(x.fecha); if(x.adaptadaPor===pid && x.estado==='Por adaptar' && d>3 && d<=10) T.push({lvl:'info', t:`Adaptar la evaluación de ${x.asignatura}`, d:`${s.nombre} · se aplica el ${fmt(x.fecha)}.`, act:`data-act="open" data-sid="${s.id}" data-tab="adaptadas"`}); }));
  acuerdosDe(pid).filter(a=>a.estado!=='Cumplido' && a.r.estado==='Realizada' && (!a.plazo || diffDays(a.plazo)<=7)).forEach(a=>{ const late = a.plazo && diffDays(a.plazo)<0; T.push({lvl: late?'crit':'info', t:`Acuerdo de reunión: ${trunc(a.acuerdo,70)}`, d:`${a.r.tipo} del ${fmt(a.r.fecha)}${a.plazo?(late?' · venció el ':' · plazo ')+fmt(a.plazo):''}.`, act:`data-act="go-reu"`}); });
  const prev = addDays(monday(D(0)),-7); const b = bitRec(pid, prev);
  if(b?.estado!=='Cerrada') T.push({lvl:'info', t:`Cerrar la bitácora del ${weekLbl(prev)}`, d: b ? 'Está en borrador.' : 'No tiene registros.', act:`data-act="go-bit" data-w="${prev}"`});
  const ord = {crit:0, warn:1, info:2};
  return {al, T: T.sort((a,b)=>ord[a.lvl]-ord[b.lvl])};
}

  const comOk = coms.filter(c=>ACUSE_OK.includes(c.respuesta)).length;
  const resp = studs.length ? Math.round(studs.reduce((t,s)=>t+respaldo(s).pct,0)/studs.length) : null;
  const adap = S.data.students.flatMap(s=>(s.adaptadas||[]).filter(x=>x.adaptadaPor===pid && inR(x.fecha) && x.estado==='Aplicada'));
  const adapOk = adap.filter(x=>x.cumplimiento==='Se aplicó según lo acordado').length;
  const porAdaptar = S.data.students.flatMap(s=>(s.adaptadas||[]).filter(x=>x.adaptadaPor===pid && x.estado==='Por adaptar' && diffDays(x.fecha)<=3)).length;
  const decs = studs.flatMap(s=>(s.dec||[]).filter(x=>inR(x.fecha)));
  const decAn = decs.filter(x=>x.analisis).length;
  const weeks = [1,2,3,4].map(i=>addDays(monday(D(0)), -7*i));
  const bitOk = weeks.filter(w=>bitRec(pid,w)?.estado==='Cerrada').length;
  const W = weekSummary(pid, monday(D(0)));
  const horasPct = W.contr ? Math.round(W.total/60/W.contr*100) : null;
  const G = (S.data.grupos||[]).filter(g=>g.profesional===pid && g.clase!=='trabajo');
  const gst = G.flatMap(g=>gEst(g).map(e=>gStats(g,e.id,R.from,R.to)));
  const gTot = gst.reduce((t,x)=>t+x.tot,0), gP = gst.reduce((t,x)=>t+x.P,0);
  const RR = (S.data.reuniones||[]).filter(r=>r.estado==='Realizada' && inR(r.fecha));
  const reuPct = pctOf(RR.filter(r=>(r.asistentes||[]).includes(pid)).length, RR.length);
  const ACU = acuerdosDe(pid).filter(a=>a.r.estado==='Realizada'); const acuDue = ACU.filter(a=>a.estado==='Cumplido' || (a.plazo && diffDays(a.plazo)<0));
  const acuPct = pctOf(ACU.filter(a=>a.estado==='Cumplido').length, acuDue.length);
  const {al, T} = myTasks(pid, mine);
  const urg = al.filter(a=>a.lvl==='crit').length + T.filter(t=>t.lvl==='crit').length;
  const pend = al.filter(a=>a.lvl!=='info').length + T.filter(t=>t.lvl!=='info').length;
  return {pid, mine, studs, real:real.length, minDir, agendaPct:pctOf(real.length, agendadas.length), agendadas:agendadas.length,
    calidadPct:pctOf(calidad, real.length), coms:coms.length, comPct:pctOf(comOk, coms.length), resp,
    adap:adap.length, adapPct:pctOf(adapOk, adap.length), porAdaptar, decs:decs.length, decPct:pctOf(decAn, decs.length),
    bitOk, horasPct, W, reuPct, reuN:RR.length, acuPct, acuN:ACU.length, acuOk:ACU.filter(a=>a.estado==='Cumplido').length, refPct:pctOf(gP, gTot), grupos:G.length, urg, pend, al, T};
}

function autRecs(s, k){ return (s.autorizaciones||[]).filter(x=>x.tipo===k).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha))); }
function autVigente(x, en){
  if(!x || x.decision==='No autoriza') return false;
  const f = en || D(0);
  if(x.fecha > f) return false;
  if(x.revocada && (!x.fechaRevocacion || x.fechaRevocacion <= f)) return false;
  if(x.vigencia!=='Hasta que la familia la revoque' && String(x.fecha).slice(0,4) !== String(f).slice(0,4)) return false;

}
function autState(s, k, en){
  const L = autRecs(s, k).filter(x=>!en || x.fecha<=en); const x = L[0];
  if(!x) return {st:'none', lbl:'Sin registrar', x:null};
  if(k==='contencion'){ const f = en || D(0);
    if(x.revocada && (!x.fechaRevocacion || x.fechaRevocacion <= f)) return {st:'warn', lbl:'Actualizar con la familia', x};
    if(x.vigencia!=='Hasta que la familia la revoque' && String(x.fecha).slice(0,4) !== String(f).slice(0,4)) return {st:'warn', lbl:'Vencida', x};
    return {st:'ok', lbl: x.decision==='Toma conocimiento con observaciones' ? 'Informada, con observaciones' : 'Informada a la familia', x}; }

}
const needsCont = s => !!(teaDate(s) || s.paec?.fechaElaboracion);

  const ing = autState(s,'ingreso');
  if(ing.st==='none') push('warn','Falta la autorización de ingreso a la unidad','Imprime el formulario y regístralo firmado por el apoderado.');
  else if(ing.st==='warn') push('warn','Autorización de ingreso vencida', `La última es del ${fmt(ing.x.fecha)}. Renuévala para este año escolar.`);
  else if(ing.st==='crit') push('crit', ing.lbl==='Revocada' ? 'La familia revocó el ingreso a la unidad' : 'La familia no autorizó el ingreso a la unidad', 'Solo corresponden los apoyos generales del aula. Revisa con la coordinación las sesiones y registros vigentes.');
  const propias = (s.evaluaciones||[]).filter(e=>e.tipo!=='Informe externo recibido');
  const sinAut = propias.filter(e=>!autRecs(s,'evaluacion').some(a=>a.decision!=='No autoriza' && a.fecha<=e.fecha && autVigente(a, e.fecha)));
  if(sinAut.length) push('warn', sinAut.length===1 ? 'Evaluación sin autorización previa de la familia' : `${sinAut.length} evaluaciones sin autorización previa`, 'Evaluación del '+sinAut.map(e=>fmt(e.fecha)).join(', ')+'. Registra la autorización firmada antes de evaluar.');
  const ev = autState(s,'evaluacion'); if(ev.st==='crit') push('crit', 'La familia no autorizó evaluar al estudiante', 'No se deben aplicar evaluaciones propias de la unidad sin una nueva autorización.');

    h += `<p class="note">Este documento no es una autorización ni un veto. La contención física es un último recurso ante un peligro inminente para el estudiante o para otras personas, y el colegio mantiene su deber de proteger la vida y la integridad de todos. Lo que informa la familia orienta cómo hacerlo de la forma más segura. Si llegara a ser necesaria, se informará a la familia de inmediato.</p>`;

  h += `<h2>Vigencia y revocación</h2><div class="aut-txt"><p>${x?.vigencia==='Hasta que la familia la revoque' ? 'Esta decisión se mantiene vigente hasta que la familia la revoque.' : 'Esta decisión rige durante el año escolar en curso y se renueva cada año.'} La familia puede revocarla en cualquier momento, por escrito, ante la coordinación de la unidad. ${k==='contencion' ? 'La información entregada se puede actualizar en cualquier momento y se revisa junto al PAEC.' : 'Revocarla o no autorizar no afecta los derechos del estudiante ni su permanencia en el colegio, y se mantienen los apoyos generales del aula.'}</p></div>`;

// Solo datos mínimos para crear fichas: identificación, curso, apoderados y contactos de emergencia.
const NOM_CAMPOS = ['RUN','nombre','nombre social','curso','fecha de nacimiento','apoderado titular y suplente','contactos de emergencia'];
const ORD = {Primer:1, Segundo:2, Tercer:3, Cuarto:4, Quinto:5, Sexto:6, 'Séptimo':7, Septimo:7, Octavo:8};
function nomCurso(txt){
  const t = String(txt||'').replace(/\s+/g,' ').trim(); const letra = (t.match(/\s([A-Z])$/)||[])[1] || '';
  if(/^pre-?k/i.test(t)) return {curso:'Pre-kínder', letra};
  if(/^k[ií]nder/i.test(t)) return {curso:'Kínder', letra};
  const w = t.split(' ')[0]; const n = ORD[w];
  if(n) return {curso: /medio/i.test(t) ? `${n}° medio` : `${n}° básico`, letra};
  return {curso:'', letra};
}
function parseCSV(txt, sep){
  const out = []; let row = [], f = '', q = false;
  for(let i=0; i<txt.length; i++){ const c = txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){ f+='"'; i++; } else q = false; } else f += c; }
    else if(c==='"') q = true;
    else if(c===sep){ row.push(f); f=''; }
    else if(c==='\n'){ row.push(f.replace(/\r$/,'')); out.push(row); row=[]; f=''; }
    else f += c; }
  if(f || row.length){ row.push(f.replace(/\r$/,'')); out.push(row); }
  return out;
}
const isoDMY = v => { const m = String(v||'').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); return m ? `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}` : ''; };
const telOf = (...v) => v.map(x=>String(x||'').trim()).find(x=>x && x!=='-') || '';
function nomFromRows(rows){
  const h = rows[0].map(x=>x.trim()); const ix = n => h.indexOf(n); const g = (r, n) => { const i = ix(n); return i<0 ? '' : String(r[i]||'').trim(); };
  const need = ['Número Rut','Nombre Curso','Nombres Alumno','Apellido Paterno'];
  const miss = need.filter(n=>ix(n)<0); if(miss.length) throw new Error('El archivo no tiene las columnas: '+miss.join(', ')+'. Usa la exportación de matrícula de Notas Net.');
  const L = [];
  rows.slice(1).forEach(r=>{
    if(r.length < h.length/2) return;
    const est = g(r,'Estado Matrícula'); if(est && !/^matriculad/i.test(est)) return;
    const rut = g(r,'Número Rut'); if(!rut) return;
    const {curso, letra} = nomCurso(g(r,'Nombre Curso'));
    const ap = [];
    const t = g(r,'Nombre Apoderado'); if(t) ap.push({nombre:t, parentesco:g(r,'Relación Apoderado'), telefono:telOf(g(r,'Móvil Apoderado'), g(r,'Telefono Apoderado')), email:g(r,'Email Apoderado'), tipo:'Titular'});
    const s = g(r,'Nombre Apoderado Suplente'); if(s) ap.push({nombre:s, parentesco:g(r,'Relación Apoderado Suplente'), telefono:telOf(g(r,'Móvil Apoderado Suplente'), g(r,'Telefono Apoderado Suplente')), tipo:'Suplente'});
    [1,2].forEach(n=>{ const e = g(r,'Emergencias Avisar '+n); if(e && !ap.some(a=>a.nombre===e)) ap.push({nombre:e, parentesco:'', telefono:telOf(g(r,'Emergencias Telefonos '+n)), tipo:'Contacto de emergencia'}); });
    L.push({rut, nombre:[g(r,'Nombres Alumno'), g(r,'Apellido Paterno'), g(r,'Apellido Materno')].filter(Boolean).join(' '), nombreSocial:g(r,'Nombre Social'),
      curso, letra, cursoOrig:g(r,'Nombre Curso').replace(/\s+/g,' '), fnac:isoDMY(g(r,'Nacimiento')), lista:+g(r,'Número Lista')||null, apoderados:ap});
  });
  return L;
}
async function readCSVFile(file){
  const buf = await file.arrayBuffer();
  let txt = new TextDecoder('utf-8').decode(buf);
  if(txt.includes('\uFFFD')) txt = new TextDecoder('windows-1252').decode(buf);
  const first = txt.split('\n')[0]; const sep = (first.match(/;/g)||[]).length >= (first.match(/,/g)||[]).length ? ';' : ',';
  return parseCSV(txt, sep);
}
const nom = () => S.data.nomina?.lista || [];
const normTxt = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const rutKey = r => String(r||'').replace(/[^0-9kK]/g,'').toUpperCase().replace(/^0+/,'');
function nomBuscar(q){
  const t = normTxt(q).trim(); if(t.length<2) return [];
  const rk = rutKey(q); const words = t.split(/\s+/);
  return nom().filter(n => (rk.length>=4 && rutKey(n.rut).startsWith(rk)) || words.every(w=>normTxt(n.nombre).includes(w))).slice(0, 30);
}

function dashData(){
  const st = S.data.students; const inR = (f,a,b) => f && f>=a && f<=b;
  const A = [D(-29), D(0)], P = [D(-59), D(-30)];
  const cnt = (fn, R) => st.reduce((t,s)=>t+fn(s).filter(x=>inR(x.fecha, R[0], R[1])).length, 0);
  const M = [
    ['Sesiones realizadas', s=>(s.sesiones||[]).filter(x=>x.estado==='Realizada')],
    ['Comunicaciones con familias', s=>s.comunicaciones||[]],
    ['Episodios de desregulación', s=>s.dec||[]],
    ['Evaluaciones adaptadas', s=>s.adaptadas||[]],
    ['Autorizaciones firmadas', s=>s.autorizaciones||[]]
  ].map(([l, fn])=>({l, v:cnt(fn, A), p:cnt(fn, P)}));
  const R = S.data.reuniones||[]; const rr = rg => R.filter(r=>r.estado==='Realizada' && inR(r.fecha, rg[0], rg[1])).length;
  M.splice(4, 0, {l:'Reuniones de equipo', v:rr(A), p:rr(P)});

}
function distData(mode){
  const st = S.data.students;
  let cats;
  if(mode==='prof'){
    const order = S.data.equipo.map(p=>p.id);
    const m = {}; st.forEach(s=>{ const k = s.referente && order.includes(s.referente) ? s.referente : '_'; m[k] = (m[k]||0)+1; });
    cats = order.filter(id=>m[id]).map(id=>({k:id, l:profName(id), ini:initials(profName(id)), n:m[id]}));
    if(m._) cats.push({k:'_', l:'Sin referente', ini:'—', n:m._});
  } else {
    const order = [...CONDICIONES, 'Sin diagnóstico'];
    const m = {}; st.forEach(s=>{ const c = (s.diagnosticos||[])[0]?.condicion || 'Sin diagnóstico'; m[c] = (m[c]||0)+1; });
    cats = order.filter(c=>m[c]).map(c=>({k:c, l:c, ini:c==='Autismo (TEA)'?'TEA':initials(c), n:m[c]}));
    Object.keys(m).filter(c=>!order.includes(c)).forEach(c=>cats.push({k:c, l:c, ini:initials(c), n:m[c]}));
  }
  // color fijo por entidad (orden estable); más de 4 se agrupa en "Otros"
  cats = cats.map((c,i)=>({...c, i}));
  if(cats.length > 4){ const keep = cats.slice(0,3); const rest = cats.slice(3); cats = [...keep, {k:'otros', l:`Otros (${rest.length})`, ini:'+', n:rest.reduce((t,c)=>t+c.n,0), i:3}]; }
  const tot = cats.reduce((t,c)=>t+c.n,0) || 1;
  return {cats: cats.map(c=>({...c, pct: c.n/tot*100, col: DPAL[c.i%4]})), tot};
}

const SAFE_ID = /^[A-Za-z0-9_-]{1,64}$/;
function sanitizeIds(o, depth){
  depth = depth || 0; if(!o || typeof o!=='object' || depth>8) return o;
  if(Array.isArray(o)){ o.forEach(x=>sanitizeIds(x, depth+1)); return o; }
  if('id' in o && o.id!=null && !SAFE_ID.test(String(o.id))) o.id = uid();
  Object.keys(o).forEach(k=>{ const v = o[k]; if(v && typeof v==='object') sanitizeIds(v, depth+1); });
  return o;
}

function pendGroups(al, T){
  const G = new Map(); const ord = {crit:0, warn:1, info:2};
  al.forEach(a=>{ const t = a.t.replace(/ por \d+ /,' por '); const k = a.lvl+'|'+t; if(!G.has(k)) G.set(k, {lvl:a.lvl, t:a.t, items:[]}); else G.get(k).t = t; G.get(k).items.push(alertRow(a)); });
  T.forEach(x=>{ const t = x.t.replace(/ del \d.*$| de .+$/,'').replace(/ por \d+ /,' por '); const k = x.lvl+'|T|'+t; if(!G.has(k)) G.set(k, {lvl:x.lvl, t:x.t, items:[]}); else G.get(k).t = t; G.get(k).items.push(taskRow(x)); });
  return [...G.values()].sort((a,b)=>ord[a.lvl]-ord[b.lvl] || b.items.length-a.items.length);
}
function pendHTML(al, T){
  const gs = pendGroups(al, T); const n = al.length + T.length;
  if(!n) return '<p class="empty">Todo al día.</p>';
  return gs.map(g=>`<details class="pgroup lv-${g.lvl}" ${g.lvl==='crit'?'open':''}><summary><span class="icw">${ic(g.lvl==='crit'?'alert':g.lvl==='warn'?'clock':'info')}</span><span class="t"><span class="lvl">${g.lvl==='crit'?'Urgente':g.lvl==='warn'?'Por revisar':'Aviso'}</span> ${esc(g.items.length>1 ? g.t.replace(/ del \d.*$/,'') : g.t)}</span><span class="n">${g.items.length} ${g.items.length===1?'caso':'casos'}</span><span class="chev">${ic('arrow','sm')}</span></summary><ul class="rows">${g.items.join('')}</ul></details>`).join('');
}

function psiEvol(ses){
  return PSI_AREAS.map(([k,l])=>{ const pts = ses.filter(x=>x.estado==='Realizada' && x['psi_'+k]).map(x=>({f:x.fecha, v:+x['psi_'+k]}));
    const a = pts[0], z = pts[pts.length-1];
    return {k, l, pts, ini:a?.v, act:z?.v, tend: !pts.length ? '' : pts.length<2 ? 'Un registro' : z.v>a.v ? 'Avanza' : z.v<a.v ? 'Retrocede' : 'Se mantiene'}; });
}
function sparkSVG(pts, w, h){
  w = w||200; h = h||40; if(!pts.length) return '';
  const X = i => pts.length===1 ? w/2 : 6 + i*(w-12)/(pts.length-1), Y = v => h-6 - (v-1)*(h-12)/3;
  const grid = [1,2,3,4].map(v=>`<line x1="0" x2="${w}" y1="${Y(v)}" y2="${Y(v)}" stroke="#D9DEEA" stroke-width="1"/>`).join('');
  const line = pts.length>1 ? `<polyline fill="none" stroke="#1646B4" stroke-width="2" stroke-linejoin="round" points="${pts.map((p,i)=>X(i)+','+Y(p.v)).join(' ')}"/>` : '';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Evolución: ${pts.map(p=>PSI_TXT[p.v]).join(', ')}">${grid}${line}${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.v)}" r="4" fill="#1646B4" stroke="#fff" stroke-width="2"><title>${fmtShort(p.f)}: ${PSI_TXT[p.v]}</title></circle>`).join('')}</svg>`;
}

  const sols = s.solicitudes||[];

function psiSintesis(s, desde, hasta){

  const E = psiEvol(ses).filter(a=>a.pts.length);

}

saveBitItem = function(d, f){
  const keep = new Set(bitGuia(d.tipo).map(g=>g.k));
  BIT_KEYS.forEach(k=>{ if(!keep.has(k)) delete d[k]; });
  bitGuia(d.tipo).forEach(g=>{ if(g.one && Array.isArray(d[g.k])) d[g.k] = d[g.k].slice(-1); });
  if(d.tipo!==BIT_AT) delete d.bh_ficha;
  const prev = d.id ? (bitRec(S.bprof, S.bweek)?.items||[]).find(x=>x.id===d.id) : null;
  if(!d.id) d.id = uid();
  const wasNew = !prev;
  /* sesión vinculada en la ficha */
  const quitar = (sid, sesId) => { const t = sid && stu(sid); if(t && sesId) t.sesiones = (t.sesiones||[]).filter(x=>x.id!==sesId); };
  if(prev?.sesId && (!d.bh_ficha || prev.sid!==d.sid)){ quitar(prev.sid, prev.sesId); delete d.sesId; }
  if(d.bh_ficha && d.sid && stu(d.sid)){
    const t = stu(d.sid); t.sesiones = t.sesiones||[];
    const mod = (d.bh_mod||[]);
    const ses = {fecha:d.fecha, duracion:+d.minutos||0, profesional:S.bprof, estado:'Realizada', bitId:d.id,
      modalidad: mod.includes('Apoyo dentro del aula') ? 'Apoyo en aula común' : mod.includes('Intervención en grupo pequeño') ? 'Grupal fuera del aula' : 'Individual fuera del aula',

      respuesta: (d.bh_resp||[])[0]||''};
    const i = d.sesId ? t.sesiones.findIndex(x=>x.id===d.sesId) : -1;

const _weekAutoT = weekAuto;
weekAuto = function(prof, mon){
  const linked = new Set(); (S.data.bitacora||[]).forEach(b=>(b.items||[]).forEach(i=>{ if(i.sesId) linked.add(i.sesId); }));
  S.data.students.forEach(s=>(s.sesiones||[]).forEach(x=>{ if(x.bitId) linked.add(x.id); }));
  if(!linked.size) return _weekAutoT(prof, mon);
  const keep = S.data.students.map(s=>[s, s.sesiones]);
  S.data.students.forEach(s=>{ if(s.sesiones) s.sesiones = s.sesiones.filter(x=>!linked.has(x.id)); });

};

const _inputForU = inputFor;

    const g = isGrp(d);

    if(f.k==='sid' && sch==='bitItem' && f!==SID_AT && d.tipo===BIT_AT) return '';

function gtEnsure(d, prof){

  const g = stamp({id:uid(), clase:'trabajo', nombre:d.g_nombre.trim(), objetivo:d.g_foco||'', profesional:prof, asignatura:GT, estudiantes:(d.g_est||[]).map(sid=>({id:sid, sid}))}, true);

function gtPresentes(d, g){ const M = gtMembers(g); if(d.g_asis) return M.filter(sid=>(d.g_asis[sid]||'P')==='P'); return d.grupo==='__new' ? M : (d.g_pres||[]).filter(sid=>M.includes(sid)); }
function gtSesionCopias(g, base, pres, extra){

/* ================= A quién le corresponde cada instrumento ================= */
/* Cada instrumento tiene una regla. El equipo puede confirmarla o cambiarla en la ficha (Editar datos).
   Lo que no corresponde no aparece como pendiente ni en la franja de documentos. */
const INSTR = [
  ['anamnesis','Anamnesis'], ['evaluaciones','Evaluación'], ['pai','PAI'], ['paci','PACI'], ['paec','PAEC']];
const INSTR_REGLA = {
  anamnesis: 'Todos los estudiantes que ingresan a la unidad: es la entrevista inicial con la familia.',
  evaluaciones: 'Todos los estudiantes de la unidad: evaluación al ingresar y reevaluación cada año.',
  pai: 'Estudiantes que reciben apoyos directos de la unidad (sesiones, aula de recursos, codocencia).',
  paci: 'Solo estudiantes que necesitan adecuaciones curriculares de objetivos o contenidos (Decreto 83/2015).',
  paec: 'Obligatorio para estudiantes autistas (Ley 21.545). Recomendado para quienes presentan desregulación emocional y conductual.'
};
const hasCond = (s, c) => (s.diagnosticos||[]).some(d=>d.condicion===c);
const docHecho = (s, k) => k==='anamnesis' ? !!s.anamnesis?.fecha : k==='evaluaciones' ? (s.evaluaciones||[]).length>0 : !!s[k]?.fechaElaboracion;
const lastEval = s => (s.evaluaciones||[]).filter(e=>e.tipo!=='Informe externo recibido').map(e=>e.fecha).filter(Boolean).sort().at(-1) || (s.evaluaciones||[]).map(e=>e.fecha).filter(Boolean).sort().at(-1);
/* resultado: on (corresponde), why (motivo), fixed (no se puede desmarcar), sug (sugerido sin ser exigido) */
function aplica(s, k){
  const m = s['ins_'+k] || '';
  if(k==='paec' && teaDate(s)) return {on:true, fixed:true, why:'Diagnóstico de autismo: obligatorio por la Ley 21.545.'};
  if(m==='si') return {on:true, why:'El equipo indicó que le corresponde.'};
  if(m==='no') return {on:false, why:'El equipo indicó que no le corresponde.'};
  if(docHecho(s, k) && k!=='anamnesis' && k!=='evaluaciones') return {on:true, why:'Ya tiene el documento elaborado.'};
  switch(k){
    case 'anamnesis': return {on:true, why:INSTR_REGLA.anamnesis};
    case 'evaluaciones': return {on:true, why:INSTR_REGLA.evaluaciones};
    case 'pai': return {on:true, why:INSTR_REGLA.pai};
    case 'paci': return hasCond(s,'Discapacidad intelectual') ? {on:true, why:'Discapacidad intelectual: suele requerir adecuaciones curriculares.'} : {on:false, why:INSTR_REGLA.paci};
    case 'paec': { const dec = (s.dec||[]).filter(x=>diffDays(x.fecha) >= -365).length;
      return dec ? {on:false, sug:true, why:`Tuvo ${dec} ${dec===1?'episodio':'episodios'} de desregulación en el último año: se recomienda evaluar si necesita un PAEC.`} : {on:false, why:INSTR_REGLA.paec}; }
  }
  return {on:true, why:''};
}
const instrOff = s => INSTR.filter(([k])=>!aplica(s,k).on);

/* en la ficha del estudiante: elegir qué le corresponde */
SCHEMA.student.push({sec:'Instrumentos que le corresponden', note:'Por defecto se aplica la regla de cada instrumento. Cámbiala solo si el caso lo requiere: lo que no corresponde deja de aparecer como pendiente.', fields:
  INSTR.map(([k,l])=>({k:'ins_'+k, l, t:'select', o:()=>{ const d = S.form?.draft || {}; const a = aplica({...d, ['ins_'+k]:''}, k);
    if(a.fixed) return [['', 'Corresponde (obligatorio por diagnóstico TEA)']];
    return [['', `Según la regla: ${a.on?'corresponde':'no corresponde'}`], ['si','Sí corresponde'], ['no','No corresponde']]; }}))});

/* estado de documentos: solo lo que corresponde; evaluación al día = en los últimos 12 meses */
const _docStatusV = docStatus;
docStatus = function(s){
  return _docStatusV(s).filter(([,,k])=>aplica(s,k).on).map(row=>{
    const [ab,n,k,st] = row;
    if(k==='evaluaciones'){ const l = lastEval(s); return [ab, n, k, !l ? 'none' : diffDays(l) < -365 ? 'warn' : 'ok']; }
    if(st==='na') return [ab, n, k, 'none'];
    return row;
  });
};
/* pendientes: no se alerta por instrumentos que no corresponden */
const _alertsForV = alertsFor;
alertsFor = function(s){
  const off = new Set(instrOff(s).map(([k])=>k));
  const A = _alertsForV(s).filter(a=>!(off.has(a.tab) && !/autorizaci/i.test(a.t)));
  if(aplica(s,'pai').on && !docHecho(s,'pai') && (docHecho(s,'evaluaciones'))) A.push({lvl:'info', t:'PAI sin elaborar', d:'Ya tiene evaluación: define objetivos, estrategias y responsables.', tab:'pai', sid:s.id, nombre:s.nombre});
  if(aplica(s,'paci').on && !docHecho(s,'paci')) A.push({lvl:'info', t:'PACI sin elaborar', d:'Le corresponde por tener adecuaciones curriculares.', tab:'paci', sid:s.id, nombre:s.nombre});
  if(aplica(s,'evaluaciones').on){ const l = lastEval(s);
    if(!l) A.push({lvl:'info', t:'Evaluación sin registrar', d:'Registra la evaluación de ingreso para definir los apoyos.', tab:'evaluaciones', sid:s.id, nombre:s.nombre});
    else if(diffDays(l) < -365) A.push({lvl:'info', t:'Reevaluación pendiente', d:`La última evaluación es del ${fmt(l)}. Corresponde reevaluar cada año.`, tab:'evaluaciones', sid:s.id, nombre:s.nombre}); }
  return A;
};

function adapMail(s, x){

  const to = okMail(x.docenteCorreo) ? [x.docenteCorreo.trim()] : (c && okMail(c.correo) ? [c.correo.trim()] : []);

    `• Fecha de aplicación: ${fmt(x.fecha)}`,
    x.docente ? `• Docente: ${x.docente}` : '',
    x.contenido ? `• Unidad u objetivos evaluados: ${x.contenido}` : '',
    `• Estado: ${x.estado||'—'}`, '',
    (x.adaptaciones||[]).length ? 'Adecuaciones realizadas:' : '',
    ...(x.adaptaciones||[]).map(a=>`  – ${a}`),
    x.detalle ? `\nQué se adaptó en el instrumento: ${x.detalle}` : '',
    x.enlace ? `\nEvidencia: ${x.enlace}` : '',
    x.estado==='Aplicada' && x.cumplimiento ? `\nAplicación: ${x.cumplimiento}${x.nota?' · Resultado: '+x.nota:''}` : '',
    '', 'Las adecuaciones responden a los acuerdos registrados en el plan de apoyo del estudiante (Decreto 67/2018 y Decreto 83/2015). Quedo atento/a a cualquier consulta o ajuste.', '',

  const body = L.filter((l,i)=>l!=='' || L[i-1]!=='').join('\n').replace(/\n{3,}/g,'\n\n');
  return {to, cc, su, body, ciclo:c, U};
}

/* ================= Tabulación automática de pruebas (TabulaTest) ================= */
/* Cada prueba define áreas, subtests y puntaje máximo. La profesional escribe solo el puntaje obtenido:
   la plataforma calcula el % de logro por subtest y por área (suma obtenidos / suma máximos) y el nivel de desempeño. */
const TAB_NIV = [['L','Logrado'],['ML','Medianamente Logrado'],['PL','Por lograr']];
const TAB_COL = {L:'#1e7d45', ML:'#b07800', PL:'#c62828'};
const PRUEBA_DEF = {id:'ppi-1b', nombre:'Prueba Psicopedagógica Informal para primero básico', nivel:'1° básico', areas:[
  {area:'Área Cognitiva', subtests:[{n:'Memoria y Atención', max:20},{n:'Series', max:12},{n:'Clasificación', max:6},{n:'Capacidades Espaciales', max:2},{n:'Organización Perceptiva', max:18}]},
  {area:'Área Lectura y Escritura', subtests:[{n:'Comprensión Lectora', max:21},{n:'Exactitud Lectora', max:27},{n:'Ortografía visual y reglada', max:64},{n:'Grafomotricidad', max:12}]},
  {area:'Área Matemática', subtests:[{n:'Cálculo y Numeración', max:74},{n:'Resolución de Problemas', max:8}]}]};
const pruebas = () => (S.data.inst?.pruebas?.length ? S.data.inst.pruebas : [PRUEBA_DEF]);
const umbrales = () => ({L:75, ML:40, ...(S.data.inst?.umbrales||{})});
const nivelDe = (pct, U) => pct==null ? '' : pct >= U.L ? 'L' : pct >= U.ML ? 'ML' : 'PL';
const tabPct = (o, m) => (m>0 && o!=='' && o!=null && !isNaN(o)) ? o/m*100 : null;
const tabKey = (ai, si) => `a${ai}s${si}`;
function tabCalc(t){ /* t = {areas:[{area, filas:[{n,max,obt}]}], U} */
  const U = t.U || umbrales();
  return t.areas.map(a=>{ const F = a.filas.map(f=>{ const p = tabPct(+f.obt, +f.max); return {...f, pct:p, niv:nivelDe(p, U)}; });
    const done = F.filter(f=>f.pct!=null); const so = done.reduce((s,f)=>s + +f.obt, 0), sm = done.reduce((s,f)=>s + +f.max, 0);
    const p = sm ? so/sm*100 : null; return {area:a.area, filas:F, pct:p, niv:nivelDe(p, U), so, sm}; });
}
const fmtPct = p => p==null ? '—' : Math.round(p)+'%';
function tabTable(t, opts={}){
  const A = tabCalc(t); const nv = k => k ? `<span style="color:${TAB_COL[k]};font-weight:700">${(TAB_NIV.find(x=>x[0]===k)||[])[1]}</span>` : '—';
  const th = 'background:#002D82;color:#fff;padding:5px 7px;border:1px solid #c9d1e3;font-size:9.5pt', td = 'padding:5px 7px;border:1px solid #c9d1e3;font-size:9.5pt;vertical-align:middle';
  return `<table class="tabtest" style="border-collapse:collapse;width:100%;margin:8px 0"><thead>${opts.title!==false?`<tr><th colspan="8" style="${th}">RESUMEN PERFIL DE SUBTESTS</th></tr>`:''}<tr><th style="${th}">Habilidad</th><th style="${th}">Subtest</th><th style="${th}">Puntaje Máximo</th><th style="${th}">Puntaje Obtenido</th><th style="${th}">Porcentaje de Logro</th><th style="${th}">Nivel de Desempeño</th><th style="${th}">Porcentaje de Logro</th><th style="${th}">Nivel de Desempeño</th></tr></thead><tbody>${A.map(a=>a.filas.map((f,i)=>`<tr>${i===0?`<td rowspan="${a.filas.length}" style="${td}">${esc(a.area)}</td>`:''}<td style="${td}">${esc(f.n)}</td><td style="${td};text-align:center">${esc(f.max)}</td><td style="${td};text-align:center">${f.pct==null?'—':esc(f.obt)}</td><td style="${td};text-align:center">${fmtPct(f.pct)}</td><td style="${td};text-align:center">${nv(f.niv)}</td>${i===0?`<td rowspan="${a.filas.length}" style="${td};text-align:center">${fmtPct(a.pct)}</td><td rowspan="${a.filas.length}" style="${td};text-align:center">${nv(a.niv)}</td>`:''}</tr>`).join('')).join('')}</tbody></table>`;
}
/* tabla guardada en la evaluación */
function tabHTML(e, rep){
  const T = e?.tabulacion; if(!T) return '';

async function unzipEntry(buf, name){

  for(let k=0; k<n; k++){ const method = dv.getUint16(p+10, true), csize = dv.getUint32(p+20, true), nl = dv.getUint16(p+28, true), el = dv.getUint16(p+30, true), cl = dv.getUint16(p+32, true), off = dv.getUint32(p+42, true);
    const fn = dec.decode(new Uint8Array(buf, p+46, nl));
    if(fn===name){ const ln = dv.getUint16(off+26, true), le = dv.getUint16(off+28, true); const data = new Uint8Array(buf, off+30+ln+le, csize);
      if(method===0) return dec.decode(data);
      if(method===8){ const st = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw')); return await new Response(st).text(); }
      throw new Error('Formato de compresión no soportado.'); }
    p += 46 + nl + el + cl; }

}
function docxBlocks(xml){

    if(c.localName==='tbl'){ const rows = [...c.children].filter(r=>r.localName==='tr').map(r=>[...r.children].filter(x=>x.localName==='tc').map(tc=>[...tc.children].filter(x=>x.localName==='p').map(txt).join('\n').trim())); out.push({t:rows}); } });

  const head = t => { const n = norm(t);
    if(n.length>70) return null;
    if(/^(\d+\s*)?IDENTIFICACION/.test(n)) return 'ident'; if(/^(\d+\s*)?INSTRUMENTOS?( APLICADOS)?$/.test(n) || /^\d+\s*INSTRUMENTO/.test(n)) return 'instr'; if(/^(\d+\s*)?MOTIVO DE (LA )?(EVALUACION|DERIVACION|CONSULTA)/.test(n)) return 'motivo';

/* ---------- 2. Horas comparadas con lo esperado a la fecha ---------- */
function horasEsperadas(contrH, mon){
  if(!contrH) return null; const hoy = D(0), cur = monday(hoy);
  let dias; if(mon < cur) dias = 5; else if(mon > cur) dias = 0;
  else { const wd = (parse(hoy).getDay()+6)%7; dias = Math.min(wd+1, 5); }
  return {dias, min: Math.round(contrH*60*dias/5)};
}

  if(!verTodasBit()){ const p = S.data.equipo.find(x=>x.id===prof); h = h.replace(/<select id="bprof"[\s\S]*?<\/select>/, `<span class="selpill bitme">${ic('team','sm')} ${esc(p?.nombre||'')}</span>`); }

  const E = horasEsperadas(W.contr, mon); const regH = W.total;

/* ---------- 3. Síntesis propuesta a partir de lo registrado ---------- */
function bitPropuesta(prof, mon){
  const W = weekSummary(prof, mon), fin = addDays(mon, 6), inR = f => f && f>=mon && f<=fin;
  const ses = W.auto.filter(a=>a.directa), grupal = ses.filter(a=>a.tipo==='Atención grupal' || a.tipo==='Reforzamiento');
  const man = W.man; const temas = {}; man.forEach(i=>(i.bh_tem||[]).forEach(t=>temas[t]=(temas[t]||0)+1));
  S.data.students.forEach(s=>(s.sesiones||[]).forEach(x=>{ if(x.profesional===prof && x.estado==='Realizada' && inR(x.fecha)) sesObjTxt(x, s).forEach(t=>{ const k = t.replace(/^PAI · /,'').split(':')[0]; temas[k]=(temas[k]||0)+1; }); }));
  const top = Object.entries(temas).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0].toLowerCase());
  const informes = (S.data.log||[]).filter(l=>l.por===prof && inR(l.ts.slice(0,10)) && /Cerró informe|Emitió informe/.test(l.accion)).length;
  const coord = man.filter(i=>i.tipo==='Coordinación con docentes').length;
  const nSes = ses.length + man.filter(i=>i.tipo===BIT_AT).length; const nGr = grupal.length + man.filter(i=>i.tipo===BIT_AT && i.gid).length;
  const logros = [
    nSes ? `${nSes} ${nSes===1?'sesión realizada':'sesiones realizadas'}${nGr?` (${nGr} ${nGr===1?'grupal':'grupales'})`:''} con ${W.est} ${W.est===1?'estudiante':'estudiantes'} (${hrs(W.dir)} de atención directa).` : '',
    top.length ? `Temas más trabajados: ${top.join(', ')}.` : '',
    W.fam ? `${W.fam} ${W.fam===1?'contacto':'contactos'} con familias.` : '',
    coord ? `${coord} ${coord===1?'instancia':'instancias'} de coordinación con docentes.` : '',
    informes ? `${informes} ${informes===1?'informe cerrado o emitido':'informes cerrados o emitidos'}.` : ''].filter(Boolean).join('\n');
  const aus = []; S.data.students.forEach(s=>(s.sesiones||[]).forEach(x=>{ if(x.profesional===prof && inR(x.fecha) && (x.estado==='Ausente' || x.estado==='Suspendida')) aus.push(x.estado); }));
  const dif = aus.length ? `${aus.length} ${aus.length===1?'sesión no se realizó':'sesiones no se realizaron'} por ausencia o suspensión.` : '';
  const nmon = addDays(mon, 7), nfin = addDays(mon, 13); let prox = 0;
  S.data.students.forEach(s=>(s.sesiones||[]).forEach(x=>{ if(x.profesional===prof && x.estado==='Programada' && x.fecha>=nmon && x.fecha<=nfin) prox++; }));
  const sinResp = S.data.students.flatMap(s=>(s.sesiones||[]).filter(x=>x.profesional===prof && x.estado==='Realizada' && inR(x.fecha) && !x.respuesta && !x.gses)).length;
  const pend = [prox ? `${prox} ${prox===1?'sesión programada':'sesiones programadas'} para la próxima semana.` : '', sinResp ? `Completar la respuesta del estudiante en ${sinResp} ${sinResp===1?'sesión':'sesiones'} de esta semana.` : ''].filter(Boolean).join('\n');
  return {logros, dif, pend};
}

  const count = f => all.filter(x=>x.fecha===f).length;

  if(S.fday) rows = all.filter(x=>x.fecha===S.fday);

  <section class="glass card"><header><h2>${S.fday?'Línea de tiempo':'Sesiones'}</h2>${S.fday?`<span class="chip">${cap(parse(S.fday).toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'}))}</span>`:`<div class="seg"><button aria-selected="${S.frange==='proximas'}" data-act="range" data-r="proximas">Próximas</button><button aria-selected="${S.frange==='pasadas'}" data-act="range" data-r="pasadas">Últimos 30 días</button><button aria-selected="${S.frange==='todas'}" data-act="range" data-r="todas">Todas</button></div>`}</header>${agendaExtraBar()}

function formFoot(){ return `<div class="form-foot">${S.form?.err?`<span class="form-err">Falta completar: ${esc(S.form.err.join(', '))}</span>`:''}<button type="button" class="btn" data-act="cancel">Cancelar</button><button type="submit" class="btn primary">${ic('check','sm')} Guardar</button></div>`; }
function renderModal(){
  const m = document.getElementById('modal');

  if(S.an){ const y = m.querySelector('.dialog .body')?.scrollTop; const cy = m.querySelector('.chatlog')?.scrollTop; m.innerHTML = renderAnalysis(); const b = m.querySelector('.dialog .body'); if(b && y) b.scrollTop = y; return; }
  if(S.rep){ m.innerHTML = renderReportModal(); return; }
  if(S.form && S.form.where==='modal'){
    const ctx = {student: S.form.sid ? stu(S.form.sid) : (S.form.draft.sid ? stu(S.form.draft.sid) : null), fid:'m'};
    m.innerHTML = `<div class="scrim" data-act="scrim"><form class="dialog form" data-form="modal" role="dialog" aria-modal="true" aria-labelledby="dlg-t" novalidate><header><h2 id="dlg-t">${esc(S.form.title)}</h2><button type="button" class="iconbtn sm" data-act="cancel" aria-label="Cerrar">${ic('x')}</button></header>${formBody(SCHEMA[S.form.schema], S.form.draft, ctx)}${formFoot()}</form></div>`;

    m.innerHTML = `<div class="scrim" data-act="scrim"><div class="dialog" role="dialog" aria-modal="true"><header><h2>${esc(S.modal.title)}</h2><button class="iconbtn sm" data-act="close-modal" aria-label="Cerrar">${ic('x')}</button></header><div class="body">${S.modal.html}</div></div></div>`;
  } else m.innerHTML = '';
}
function render(){
  if(isDir(S.data.usuario) && !['panel','normativa'].includes(S.view)) S.view = 'panel';

function openForm(o){ S.form = {err:null, ...o}; render(); const el = document.querySelector(o.where==='modal' ? '#modal input, #modal select, #modal textarea' : '#tabbody input, #tabbody select, #tabbody textarea'); if(el) el.focus({preventScroll: o.where!=='modal'}); }
function saveForm(){
  const f = S.form, sch = SCHEMA[f.schema], d = f.draft;
  const miss = missingReq(sch, d); if(miss.length){ f.err = miss; render(); return; }
  const s = f.sid ? stu(f.sid) : null;
  if(f.sid && !s && f.kind!=='student'){ S.form = null; S.modal = null; render(); toast('Este estudiante fue eliminado por otra persona. No se guardaron los cambios.', true); return; }
  switch(f.kind){
    case 'student': if(f.isNew){ const id = uid(); S.data.students.push(stamp({id, sesiones:[], dec:[], evaluaciones:[], comunicaciones:[], ...d}, true)); S.sid = id; S.view = 'ficha'; S.tab = 'resumen'; logEv(id,'Creó','Ficha del estudiante'); } else { if(!s){ S.form = null; S.modal = null; render(); toast('Este estudiante fue eliminado por otra persona. No se guardaron los cambios.', true); return; } SCHEMA.student.flatMap(x=>x.fields).forEach(fl=>{ if(fl.k in d) s[fl.k] = d[fl.k]; }); stamp(s); logEv(s.id,'Editó','Datos del estudiante'); } break;
    case 'anamnesis': case 'pai': case 'paci': case 'paec': s[f.kind] = stamp(d, f.isNew); logEv(s.id, f.isNew?'Creó':'Editó', DOC_LONG[f.kind]); break;
    case 'evaluaciones': case 'sesiones': case 'dec': case 'comunicaciones': case 'adaptadas': case 'medidas': case 'derechos': case 'autorizaciones': { s[f.kind] = s[f.kind]||[]; const lbl = COLL[f.kind].label; const desc = x => `${lbl} del ${fmt(x.fecha)}${f.kind==='autorizaciones'?' · '+(AUT[x.tipo]?.c||x.tipo):x.motivo?' · '+x.motivo:x.tipo?' · '+x.tipo:x.modalidad?' · '+x.modalidad:''}`;
      if(d.id){ const i = s[f.kind].findIndex(x=>x.id===d.id); if(i<0){ s[f.kind].push(stamp(d)); toast('Otra persona había eliminado este registro. Se volvió a guardar con tus cambios.'); } else s[f.kind][i] = stamp(d); logEv(s.id,'Editó',desc(d)); } else { const n = stamp({...d, id:uid()}, true); s[f.kind].push(n); logEv(s.id,'Registró',desc(n)); if(f.kind==='dec') S._openAn = {sid:s.id, did:n.id}; } break; }
    case 'agenda': { const t = stu(d.sid); const {sid, ...rest} = d; t.sesiones = t.sesiones||[]; t.sesiones.push(stamp({...rest, id:uid()}, true)); logEv(t.id,'Registró',`sesión del ${fmt(rest.fecha)} · ${rest.modalidad||''}`); break; }
    case 'grupo': saveGrupo(d, f); break;
    case 'reunion': saveReunion(d); break;
    case 'instCirc': case 'capac': saveInst(f.kind, d); break;
    case 'bitItem': saveBitItem(d, f); break;
    case 'equipo': if(d.id){ const i = S.data.equipo.findIndex(p=>p.id===d.id); S.data.equipo[i] = d; } else S.data.equipo.push({...d, id:uid()}); break;
  }
  const msg = f.isNew ? 'Guardado' : 'Cambios guardados';
  S.form = null; persist(); render(); toast(msg);
  if(S._openAn){ const o = S._openAn; S._openAn = null; openAnalysis(o.sid, o.did); }
}
function doCopy(text, title){
  const fallback = () => { S.modal = {title, html:`<p class="muted">Selecciona el texto y cópialo.</p><textarea class="dump" id="copytxt" readonly>${esc(text)}</textarea>`}; render(); const t = document.getElementById('copytxt'); t.focus(); t.select(); };
  try{ navigator.clipboard.writeText(text).then(()=>toast('Copiado al portapapeles'), fallback); }catch(e){ fallback(); }
}

    case 'reg-ob': { const o = obligations(s).find(b=>b.id===el.dataset.ob); const ap = (s.apoderados||[])[0];

    case 'whoami': S.modal = {title:'¿Quién está trabajando?', html:`<img class="lockup" src="${document.getElementById('lockup-src')?.src||''}" alt="Unidad de Apoyo al Aprendizaje · Colegio EDUCENTER"><p class="muted">Elige tu nombre para ver tu panel. Cada registro, cambio e informe queda firmado con este nombre. En la versión con usuarios esto se hará con inicio de sesión.</p><ul class="rows">${S.data.equipo.map(p=>`<li class="rowi click" data-act="setuser" data-id="${p.id}"><span class="icw avatar md ${AREA_AV(p.cargo)}">${initials(p.nombre)}</span><div class="main"><span class="t">${esc(p.nombre)}</span><span class="d">${esc(p.cargo)}</span></div>${S.data.usuario===p.id?'<span class="pill ok">Actual</span>':''}</li>`).join('')}</ul>${(S.data.direccion||[]).length?`<h3 style="margin:16px 0 6px;font-size:.95rem">Dirección · visión general</h3><ul class="rows">${S.data.direccion.map(p=>`<li class="rowi click" data-act="setuser" data-id="${p.id}"><span class="icw avatar md av2">${initials(p.nombre)}</span><div class="main"><span class="t">${esc(p.nombre)}</span><span class="d">${esc(p.cargo)}</span></div>${S.data.usuario===p.id?'<span class="pill ok">Actual</span>':''}</li>`).join('')}</ul>`:''}`}; renderModal(); break;
    case 'setuser': S.data.usuario = el.dataset.id; S.modal = null; S.fmine = undefined; S.pview = undefined; S.bprof = undefined; S.view = 'panel'; persist(); keepScroll(render); toast('Trabajando como '+profName(el.dataset.id)); break;

      openForm({kind:k, schema:c.schema, where:'modal', sid:s.id, draft, isNew:true, title:(k==='dec'?'Nuevo ':'Nueva ')+c.label}); break; }
    case 'edit-item': { const k = el.dataset.coll, c = COLL[k]; const it = s[k].find(x=>x.id===el.dataset.id);

    case 'edit-prof': openForm({kind:'equipo', schema:'equipo', where:'modal', draft:clone(S.data.equipo.find(p=>p.id===el.dataset.id)), title:'Editar integrante'}); break;
    case 'copy-doc': { const k = el.dataset.tab; const head = `${DOC_LONG[k].toUpperCase()}\n${S.data.estab.nombre} · RBD ${S.data.estab.rbd}\nEstudiante: ${s.nombre}${s.nombreSocial?' ('+s.nombreSocial+')':''} · ${cursoOf(s)} · ${edad(s.fnac)}\n`;
      doCopy(head + toText(SCHEMA[k], s[k], {student:s}), DOC_LONG[k]); break; }

function onField(e){
  const el = e.target;
  if(S.an && el.dataset.anchk){ if(e.type==='change'){ S.an.sel[el.dataset.anchk] = el.checked; renderModal(); } return; }
  if(S.an && el.dataset.anprop){ S.an.prop[el.dataset.anprop] = el.value; return; }
  if(S.an && el.id==='an-input') return;
  if(el.id==='q'){ S.q = el.value; const pos = el.selectionStart; keepScroll(render); const q = document.getElementById('q'); q.focus(); q.setSelectionRange(pos,pos); return; }
  if(S.rep && el.id && el.id.startsWith('rep-')){
    if(el.id==='rep-recs'){ S.rep.recs = el.value; S.rep.edited = true; if(e.type==='change') refreshPreview(); return; }
    if(e.type!=='change') return;
    if(el.id==='rep-full') S.rep.full = el.checked;
    if(el.id==='rep-desde' && el.value) S.rep.desde = el.value;
    if(el.id==='rep-hasta' && el.value) S.rep.hasta = el.value;
    if(el.id!=='rep-full' && !S.rep.edited) { S.rep.recs = genRecs(stu(S.rep.sid), S.rep.kind, S.rep.desde, S.rep.hasta); const t = document.getElementById('rep-recs'); if(t) t.value = S.rep.recs; }
    refreshPreview(); return; }
  if(el.id==='fprof'){ if(e.type==='change'){ S.fprof = el.value; keepScroll(render); } return; }
  if(el.id==='importfile' && e.type==='change'){ const f = el.files[0]; if(!f) return; const r = new FileReader(); r.onload = () => { document.getElementById('importtxt').value = r.result; toast('Archivo cargado. Presiona Restaurar'); }; r.readAsText(f); return; }
  if(!el.dataset.path || !S.form) return;
  if(el.type==='checkbox' && e.type!=='change') return;
  const p = el.dataset.path, d = S.form.draft;
  if(el.dataset.bool) setPath(d, p, el.checked);
  else if(el.dataset.opt!==undefined){ const arr = (getPath(d,p)||[]).filter(x=>x!==el.dataset.opt); if(el.checked) arr.push(el.dataset.opt); setPath(d, p, arr); }
  else if(el.type==='number') setPath(d, p, el.value==='' ? '' : Number(el.value));
  else setPath(d, p, el.value);
  if(p==='sid' && e.type==='change') renderModal();
}

const COLL_KEYS = ['bitacora','grupos','refSesiones','reuniones','inst','nomina','directorio'];
const TEAM_ROLES = ['coordinacion','profesional','administrador'];

/* ---- reparto de los datos en filas ---- */
function splitData(d){
  const out = {core:{}};
  Object.keys(d).forEach(k=>{ if(!LOCAL_KEYS.includes(k) && !COLL_KEYS.includes(k)) out.core[k] = d[k]; });
  COLL_KEYS.forEach(k=>{ if(k==='nomina' && !d.nomina) return; out[k] = d[k] ?? (k==='inst' ? {} : []); });
  (d.students||[]).forEach(s=>{ out['st:'+s.id] = s; });
  return out;
}
function applyRow(k, data){
  if(k==='dir_snapshot'){ S.snap = data; return; }
  if(data && typeof data==='object'){
    if(k.startsWith('st:') && (!SAFE_ID.test(k.slice(3)) || data.id!==k.slice(3))) return; // fila inconsistente: se ignora
    sanitizeIds(data); }
  if(k==='core'){ Object.keys(data||{}).forEach(x=>{ if(!LOCAL_KEYS.includes(x)) S.data[x] = data[x]; }); return; }
  if(COLL_KEYS.includes(k)){ S.data[k] = data ?? (k==='inst' ? {} : k==='nomina' ? null : []); return; }
  if(k.startsWith('st:')){ const id = k.slice(3), L = S.data.students, i = L.findIndex(s=>s.id===id);
    if(data==null){ if(i>=0) L.splice(i,1); if(S.sid===id && S.view==='ficha'){ S.view = 'estudiantes'; } }
    else if(i>=0) L[i] = data; else L.push(data); }
}
const myRol = () => C.perfil?.rol;
const canWrite = k => coordRol() || (myRol()==='profesional' && k!=='core' && k!=='nomina' && !(C.perfil?.alcance && ['directorio','dir_snapshot'].includes(k))) || (myRol()==='reforzamiento' && ['grupos','refSesiones','bitacora'].includes(k));
const isTeam = () => TEAM_ROLES.includes(myRol());
const snapOk = () => isTeam() && !(C.perfil?.alcance);

/* ---- combinación de cambios simultáneos (3 vías: base conocida, remoto, local) ---- */
const J = x => JSON.stringify(x);
const isObj = x => x && typeof x==='object' && !Array.isArray(x);
const byId = a => Array.isArray(a) && a.every(x=>isObj(x) && x.id);
function merge3(b, r, l){
  if(J(l) === J(b)) return r;          // solo cambió el remoto
  if(J(r) === J(b) || J(r) === J(l)) return l;  // solo cambió lo local
  if(Array.isArray(r) && Array.isArray(l)){
    if(byId(r) && byId(l) && (b===undefined || byId(b))){
      const B = new Map((b||[]).map(x=>[x.id,x])), R = new Map(r.map(x=>[x.id,x])), L = new Map(l.map(x=>[x.id,x]));
      const ids = [...new Set([...r.map(x=>x.id), ...l.map(x=>x.id)])]; const out = [];
      ids.forEach(id=>{ const bb = B.get(id), rr = R.get(id), ll = L.get(id);
        if(rr && ll) out.push(merge3(bb, rr, ll));
        else if(rr){ if(!bb || J(rr)!==J(bb)) out.push(rr); }       // borrado local: se respeta si el remoto no lo editó
        else if(ll){ if(!bb || J(ll)!==J(bb)) out.push(ll); }       // borrado remoto: se respeta si no lo editaste
      });
      return out;
    }
    return l;
  }
  if(isObj(r) && isObj(l)){
    const bo = isObj(b) ? b : {}; const out = {};
    new Set([...Object.keys(r), ...Object.keys(l), ...Object.keys(bo)]).forEach(k=>{
      const v = merge3(bo[k], r[k], l[k]); if(v !== undefined) out[k] = v; });
    return out;
  }
  return l;
}
const mergeVal = (r, l, b) => merge3(b, r, l);

/* ---- resumen anónimo para Dirección ---- */
function computeSnap(){
  const keep = S.kper; const p = {};
  ['semana','mes','anio'].forEach(x=>{ S.kper = x; p[x] = _dirDataC(kpiRange()); });
  S.kper = keep; return {p, inst: _instItemsC().map(i=>({t:i.t, norma:i.norma, st:i.st, d:i.d, id:i.id}))};
}

/* ---- guardado ---- */
function cloudPersist(){
  savePrefs();
  if(!C.ready) return;
  try{ dirSync(); }catch(e){}
  const parts = splitData(S.data);
  if(C.snap && snapOk()) parts.dir_snapshot = C.snap;
  Object.entries(parts).forEach(([k, v])=>{ const j = JSON.stringify(v); if(C.rows[k]?.json === j) return; if(canWrite(k)) C.dirty.add(k); });
  if(coordRol()) Object.keys(C.rows).filter(k=>k.startsWith('st:') && !(k in parts)).forEach(k=>C.dirty.add(k));
  schedule(300);
}
function schedule(ms, keepErr){ clearTimeout(C.timer); C.timer = setTimeout(flush, ms); if(C.dirty.size && !keepErr) setStatus('saving'); }
async function flush(){
  if(C.saving) return schedule(400);
  C.saving = true;
  try{
    const nl = (S.data.log||[]).filter(l=>!C.sent.has(l));
    for(let i=0; i<nl.length; i+=400){ const chunk = nl.slice(i, i+400);
      const {error} = await sb.from('auditoria').insert(chunk.map(l=>({sid:l.sid||null, accion:String(l.accion||'').slice(0,80), detalle:String(l.detalle||'').slice(0,500), ts_cliente:l.ts||null})));
      if(error) throw error; chunk.forEach(l=>C.sent.add(l)); }
    const parts = splitData(S.data);
    if(snapOk() && (!C.snapAt || Date.now()-C.snapAt > 20000)){ try{ C.snap = computeSnap(); C.snapAt = Date.now(); if(J(C.snap)!==C.rows.dir_snapshot?.json) C.dirty.add('dir_snapshot'); }catch(e){} }
    if(C.snap && snapOk()) parts.dir_snapshot = C.snap;
    for(const k of [...C.dirty]) await saveKey(k, parts);
    setStatus(C.dirty.size ? 'saving' : 'ok');
  }catch(e){ console.error(e); C.saving = false; setStatus(navigator.onLine===false ? 'error' : 'error'); return schedule(8000, true); }
  C.saving = false; if(C.dirty.size) schedule(300);
}
async function saveKey(k, parts){
  const cur = parts[k], row = C.rows[k];
  if(cur === undefined){
    if(row){ const {error} = await sb.from('app_data').delete().eq('key', k); if(error) throw error; delete C.rows[k]; }
    C.dirty.delete(k); return;
  }
  const json = JSON.stringify(cur);
  if(row && row.json === json){ C.dirty.delete(k); return; }
  if(!row){
    const {data, error} = await sb.from('app_data').insert({key:k, data:cur}).select('version').single();
    if(error){ if(error.code==='23505') return resolveConflict(k); if(error.code==='42501') return denied(k); throw error; }
    C.rows[k] = {version:data.version, json}; doneKey(k, json); return;
  }
  const {data, error} = await sb.from('app_data').update({data:cur, version:row.version+1}).eq('key', k).eq('version', row.version).select('version');
  if(error){ if(error.code==='42501') return denied(k); if(error.code==='40001') return resolveConflict(k); throw error; }
  if(!data.length) return resolveConflict(k);
  C.rows[k] = {version:data[0].version, json}; doneKey(k, json);
}
// solo se da por guardado si nada cambió mientras viajaba el envío
function doneKey(k, json){ if(k==='dir_snapshot'){ C.dirty.delete(k); return; } const now = splitData(S.data)[k]; if(now===undefined || J(now)===json) C.dirty.delete(k); else C.dirty.add(k); }
async function resolveConflict(k){
  const {data, error} = await sb.from('app_data').select('data,version').eq('key', k).maybeSingle();
  if(error) throw error;
  if(!data){ // otra persona lo eliminó
    if(k.startsWith('st:')){ applyRow(k, null); delete C.rows[k]; C.dirty.delete(k); toast('La coordinación eliminó este estudiante. Se quitó de tu vista.', true); refreshSoon(); return; }
    delete C.rows[k]; return; }
  if(C.rows[k] && C.rows[k].version === data.version) return denied(k);
  const local = splitData(S.data)[k]; let base; try{ base = C.rows[k] ? JSON.parse(C.rows[k].json) : undefined; }catch(e){}
  C.rows[k] = {version:data.version, json:JSON.stringify(data.data)};
  if(k==='dir_snapshot') return; // se recalcula en el siguiente guardado
  applyRow(k, local === undefined ? data.data : merge3(base, data.data, local));
  toast('Otro integrante editó lo mismo al mismo tiempo. Se combinaron ambos cambios.');
  refreshSoon();
}
function denied(k){
  C.dirty.delete(k);
  sb.from('app_data').select('data,version').eq('key', k).maybeSingle().then(({data})=>{ if(data){ C.rows[k] = {version:data.version, json:JSON.stringify(data.data)}; applyRow(k, data.data); } else { delete C.rows[k]; applyRow(k, null); } refreshSoon(); });
  toast('Tu perfil no tiene permiso para modificar esto. Se restauró la versión guardada.', true);
}
function setStatus(s){ C.status = s; const el = document.getElementById('syncst'); if(el) el.outerHTML = syncChip(); }
const SYNC_TXT = {ok:['Guardado','check'], saving:['Guardando…','clock'], error:['Sin conexión, reintentando','alert']};
const syncChip = () => { const [t, i] = SYNC_TXT[C.status]; return `<span id="syncst" class="syncst st-${C.status}" role="status" title="${t}">${ic(i,'sm')}<span>${t}</span></span>`; };
window.addEventListener('beforeunload', e=>{ if(C.dirty.size || C.saving){ e.preventDefault(); e.returnValue = ''; } });

/* ---- cambios de otros integrantes en tiempo real ---- */
function onRemote(p){
  const k = p.new?.key || p.old?.key; if(!k) return;
  if(C.dirty.has(k) || C.saving) { setTimeout(()=>pullKey(k), 1500); return; }
  if(p.eventType==='DELETE'){ if(!C.rows[k]) return; delete C.rows[k]; applyRow(k, null); refreshSoon(); return; }
  const v = p.new?.version; if(C.rows[k] && C.rows[k].version >= v) return;
  if(p.new.data === undefined){ pullKey(k); return; }   // mensaje sobre el límite de tamaño: se pide la fila completa
  takeRemote(k, p.new.data, v, p.new.updated_at);
  refreshSoon();
}
function takeRemote(k, data, v, ts){
  const local = splitData(S.data)[k]; let base; try{ base = C.rows[k] ? JSON.parse(C.rows[k].json) : undefined; }catch(e){}
  const pending = local !== undefined && C.rows[k] && J(local) !== C.rows[k].json;
  C.rows[k] = {version:v, json:J(data)};
  if(k==='dir_snapshot'){ C.snapTs = ts; applyRow(k, data); return; }
  if(pending){ applyRow(k, merge3(base, data, local)); C.dirty.add(k); schedule(300); }
  else applyRow(k, data);
}
async function pullKey(k){
  const {data, error} = await sb.from('app_data').select('data,version,updated_at').eq('key', k).maybeSingle();
  if(error) return;
  if(!data){ if(C.rows[k] && !C.dirty.has(k)){ delete C.rows[k]; applyRow(k, null); refreshSoon(); } return; }
  if(C.rows[k] && C.rows[k].version >= data.version) return;
  if(C.dirty.has(k) || C.saving){ setTimeout(()=>pullKey(k), 1500); return; }
  takeRemote(k, data.data, data.version, data.updated_at); refreshSoon();
}
// al reconectar o volver a la pestaña: se comparan versiones y se traen las filas que cambiaron
async function resync(){
  if(!C.ready) return;
  const {data, error} = await sb.from('app_data').select('key,version').range(0, 9999);
  if(error || !data) return;
  const srv = new Map(data.map(r=>[r.key, r.version]));
  for(const [k, v] of srv) if(!C.rows[k] || C.rows[k].version < v) await pullKey(k);
  Object.keys(C.rows).forEach(k=>{ if(!srv.has(k) && !C.dirty.has(k)){ delete C.rows[k]; applyRow(k, null); } });
  refreshSoon();
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') resync(); });
window.addEventListener('online', ()=>{ resync(); schedule(200); });

function initCloudCaps(){
  S.dl = {save: async ({filename, data})=>{ const blob = new Blob([data], {type:'text/html;charset=utf-8'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500); }};
  if(!isTeam()) return;
  fetch('/api/claude').then(r=>r.ok?r.json():null).then(j=>{ if(!j?.enabled) return;
    const call = async (messages, signal) => { const {data:{session}} = await sb.auth.getSession();
      const r = await fetch('/api/claude', {method:'POST', signal, headers:{'Content-Type':'application/json', Authorization:'Bearer '+(session?.access_token||'')}, body:JSON.stringify({messages})});
      if(r.status===429) throw {code:'rate_limited'}; if(r.status===403 || r.status===401) throw {code:'not_granted'}; if(!r.ok) throw {code:'error'};
      return (await r.json()).text || ''; };
    const sm = async (turns, o={}) => { try{ const t = await call(turns, o.signal); o.onText?.({text:t}); return {text:t}; } catch(e){ if(e?.name==='AbortError') throw {code:'cancelled', text:''}; throw e; } };
    sm.json = async (prompt) => { const t = await call([{role:'user', content:prompt}]); const m = t.match(/\{[\s\S]*\}/); try{ return JSON.parse(m ? m[0] : t); }catch(e){ throw {code:'invalid_json'}; } };
    S.sm = sm; if(S.an) renderModal();
  }).catch(()=>{});
}

/* cierre automático por inactividad (computadores compartidos) */
const IDLE_MS = 30*60e3; let lastAct = Date.now();
['pointerdown','keydown','wheel','touchstart'].forEach(ev=>window.addEventListener(ev, ()=>{ lastAct = Date.now(); C.idleWarned = false; }, {passive:true, capture:true}));
setInterval(()=>{ if(!C.ready) return; const idle = Date.now() - lastAct;
  if(idle > IDLE_MS){ if(C.dirty.size || C.saving || (S.form && idle < 2*IDLE_MS)){ if(C.dirty.size && !C.saving) flush(); return; }
    try{ sessionStorage.setItem('uaa-idle','1'); }catch(e){} cloudLogout(); }
  else if(idle > IDLE_MS - 2*60e3 && !C.idleWarned){ C.idleWarned = true; toast('Por seguridad, la sesión se cerrará en 2 minutos si no hay actividad.'); }
}, 20e3);
/* restaurar en la versión compartida: solo agrega lo que falta, nunca borra */
function cloudRestore(){
  const ta = document.getElementById('importtxt'); const txt = (ta?.value||'').trim();
  if(!txt){ toast('Carga un archivo o pega el respaldo primero'); return; }
  let d; try{ d = JSON.parse(txt); if(!Array.isArray(d.students)) throw 0; }catch(e){ toast('El contenido no es un respaldo válido de esta app', true); return; }
  if(d.demo || d.students.some(x=>x.id==='s1')){ toast('Ese respaldo tiene datos de ejemplo. No se cargó para no mezclarlos con los reales.', true); return; }
  const have = new Set(S.data.students.map(x=>x.id)); const nuevos = d.students.filter(x=>x && x.id && !have.has(x.id));
  const KS = ['reuniones','grupos','refSesiones','bitacora']; const add = {}; let extra = 0;
  KS.forEach(k=>{ if(!Array.isArray(d[k])) return; const ids = new Set((S.data[k]||[]).map(x=>x.id)); add[k] = d[k].filter(x=>x && x.id && !ids.has(x.id)); extra += add[k].length; });
  if(S.arm!=='restore'){ S.arm = 'restore'; keepScroll(render); const t2 = document.getElementById('importtxt'); if(t2) t2.value = txt;
    toast(`Se agregarán ${nuevos.length} ${nuevos.length===1?'estudiante':'estudiantes'} y ${extra} registros que no existen. No se borra ni reemplaza nada. Presiona de nuevo para confirmar.`); return; }
  nuevos.forEach(x=>S.data.students.push(x)); Object.entries(add).forEach(([k,L])=>{ S.data[k] = (S.data[k]||[]).concat(L); }); S.arm = null;
  logEv('', 'Restauró respaldo', `${nuevos.length} estudiantes y ${extra} registros agregados desde un respaldo`);
  persist(); S.view = 'estudiantes'; render(); toast(`Respaldo cargado: ${nuevos.length} estudiantes y ${extra} registros agregados`);
}
async function startSession(session){
  const email = String(session.user?.email||'').toLowerCase();
  if(CFG.dominio && !email.endsWith('@'+CFG.dominio.toLowerCase())){ await sb.auth.signOut(); return showLogin(`La cuenta ${esc(email)} no pertenece al colegio. Ingresa con tu correo @${esc(CFG.dominio)}.`); }
  screen('Cargando…', 'Trayendo la información de la unidad.');
  const {data:perfil, error:pe} = await sb.from('perfiles').select('*').eq('email', email).maybeSingle();
  if(pe) return screen('No se pudo conectar', 'Revisa tu conexión a internet e intenta de nuevo.', `<button class="btn primary" data-act="cloud-retry">Reintentar</button>`);
  if(!perfil || !perfil.activo) return screen('Tu cuenta aún no tiene acceso', `Ingresaste como <b>${esc(email)}</b>, pero no estás habilitado en la plataforma. Pide a la coordinación de la unidad que te agregue con este correo.`, `<button class="btn" data-act="cloud-logout">Cerrar sesión</button>`);
  C.perfil = perfil; S.admin = perfil.rol==='administrador'; S.adminDir = false;
  const {data:rows, error:re} = await sb.from('app_data').select('key,data,version,updated_at').range(0, 9999);
  if(re) return screen('No se pudo cargar la información', esc(re.message), `<button class="btn primary" data-act="cloud-retry">Reintentar</button>`);
  const map = {}; rows.forEach(r=>{ map[r.key] = r.data; C.rows[r.key] = {version:r.version, json:JSON.stringify(r.data)}; if(r.key==='dir_snapshot') C.snapTs = r.updated_at; });
  if(!map.core) return screen('Falta la configuración inicial', 'Todavía no se cargan los datos del colegio en la base. Quien administra la plataforma debe ejecutar el archivo de datos iniciales en Supabase.', `<button class="btn" data-act="cloud-logout">Cerrar sesión</button>`);
  const {data:logs} = await sb.from('auditoria').select('ts,sid,por,accion,detalle').order('id', {ascending:false}).limit(3000);
  S.data = {students:[], log:[], folio:0, ...loadPrefs()};
  Object.entries(map).forEach(([k, v])=>applyRow(k, v));
  S.data.log = (logs||[]).reverse().map(l=>({ts:l.ts, sid:l.sid||'', por:l.por||'', accion:l.accion, detalle:l.detalle||''}));
  S.data.log.forEach(l=>C.sent.add(l));
  S.data.students.sort((a,b)=>String(a._creado||'').localeCompare(String(b._creado||'')));
  migrate();
  document.body.classList.remove('prelogin');
  C.ready = true; S.view = 'panel';
  render(); initCloudCaps();
  if(isTeam()) cloudPersist();
  let subs = 0; sb.channel('uaa-datos').on('postgres_changes', {event:'*', schema:'public', table:'app_data'}, onRemote).subscribe(st=>{ if(st==='SUBSCRIBED'){ if(subs++) resync(); } });
}
async function cloudBoot(){
  const faltan = [];
  if(!window.UAA_CONFIG) faltan.push('No se encontró el archivo <code>config.js</code> junto a <code>index.html</code>.');
  else if(!CFG.supabaseUrl || /TU-PROYECTO/.test(CFG.supabaseUrl) || !CFG.supabaseAnonKey || /PEGA-AQUI/.test(CFG.supabaseAnonKey)) faltan.push('El archivo <code>config.js</code> todavía tiene los valores de ejemplo. Súbelo de nuevo con la dirección y la clave de Supabase.');
  if(!window.supabase) faltan.push('No se encontró el archivo <code>supabase.js</code> junto a <code>index.html</code>.');
  if(faltan.length) return screen('Falta configurar la conexión', faltan.join('<br><br>') + '<br><br>Revisa que en GitHub estén todos los archivos de la carpeta, al mismo nivel que <code>index.html</code>.');
  sb = supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, flowType:'pkce'}});
  sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_OUT' && C.ready) location.reload(); });
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return showLogin();
  if(location.search.includes('code=')) history.replaceState(null, '', location.pathname);
  startSession(session).catch(e=>{ console.error(e); screen('Algo salió mal', 'No se pudo abrir la plataforma. Recarga la página.', `<button class="btn primary" data-act="cloud-retry">Recargar</button>`); });
}

/* interceptar acciones que en la versión compartida funcionan distinto */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if(!el) return; const act = el.dataset.act;
  const stop = () => { e.stopImmediatePropagation(); e.preventDefault(); };
  if(act==='cloud-login'){ stop(); cloudLogin(); return; }
  if(act==='cloud-logout'){ stop(); cloudLogout(); return; }
  if(act==='cloud-retry'){ stop(); location.reload(); return; }
  if(!C.ready) return;
  if(act==='whoami'){ stop(); const p = whoP(S.data.usuario) || {};
    S.modal = {title:'Tu sesión', html:`<ul class="rows"><li class="rowi"><span class="icw avatar md av2">${initials(p.nombre)}</span><div class="main"><span class="t">${esc(p.nombre||C.perfil.nombre)}</span><span class="d">${esc(p.cargo||'')} · ${esc(C.perfil.email)}</span></div></li></ul><p class="small muted" style="margin:12px 0">Todo lo que registres queda firmado con tu nombre y con la hora del servidor.</p><button class="btn" data-act="cloud-logout">Cerrar sesión</button>`}; renderModal(); return; }
  if(act==='setuser'){ stop(); return; }
  if(act==='wipe' || act==='reseed'){ stop(); toast('No disponible en la versión compartida', true); return; }
  if(act==='restore'){ stop(); if(!coordRol()){ toast('Solo la coordinación puede restaurar datos', true); return; } cloudRestore(); return; }
  if(act==='copy-dump'){ logEv('', 'Exportó respaldo', 'Copia completa de los datos de la unidad'); persist(); }
}, true);

/* ================= Google Calendar (versión compartida) ================= */
const GCAL_SCOPE = 'https://www.googleapis.com/auth/calendar.events';
const GAPI = 'https://www.googleapis.com/calendar/v3/calendars/primary/events';
const TZ = 'America/Santiago';
const G = {tok:null, exp:0, err:null, items:[], range:'', ts:0, busy:false, syncing:false, del:[]};
try{ const t = JSON.parse(sessionStorage.getItem('uaa-gtok')||'null'); if(t && t.exp > Date.now()){ G.tok = t.tok; G.exp = t.exp; } }catch(e){}
const gOk = () => !!G.tok && G.exp > Date.now();
function gSetTok(tok){ G.tok = tok; G.exp = Date.now() + 55*60*1000; G.err = null; try{ sessionStorage.setItem('uaa-gtok', JSON.stringify({tok, exp:G.exp})); }catch(e){} }
function gDrop(err){ G.tok = null; G.exp = 0; G.err = err; try{ sessionStorage.removeItem('uaa-gtok'); }catch(e){} }
const gPref = () => { try{ return JSON.parse(localStorage.getItem('uaa-gcal-'+(C.perfil?.email||''))||'{"ses":true}'); }catch(e){ return {ses:true}; } };

async function gFetch(url, opt={}){
  if(!gOk()) throw {code:'no_token'};
  const r = await fetch(url, {...opt, headers:{Authorization:'Bearer '+G.tok, 'Content-Type':'application/json', ...(opt.headers||{})}});
  if(r.status===401){ gDrop('expired'); refreshSoon(); throw {code:'expired'}; }
  if(r.status===403){ const j = await r.json().catch(()=>({})); const msg = JSON.stringify(j); if(/insufficient|scope|PERMISSION/i.test(msg)){ gDrop('scope'); refreshSoon(); } throw {code:'forbidden', msg}; }
  if(r.status===404 || r.status===410) return null;
  if(!r.ok) throw {code:'http', status:r.status};
  return r.status===204 ? null : r.json();
}

/* ---- lectura: eventos del calendario en la agenda ---- */
function agendaRange(){ const start = new Date(TODAY); const wd = (start.getDay()+6)%7; start.setDate(start.getDate()-wd-7); const end = new Date(start); end.setDate(end.getDate()+28); return [start, end]; }
async function gLoad(force){
  if(!gOk() || G.busy) return; const [a, b] = agendaRange(); const key = isoOf(a);
  if(!force && G.range===key && Date.now()-G.ts < 5*60*1000) return;
  G.busy = true;
  try{
    const q = new URLSearchParams({timeMin:a.toISOString(), timeMax:b.toISOString(), singleEvents:'true', orderBy:'startTime', maxResults:'250', timeZone:TZ});
    const j = await gFetch(GAPI+'?'+q);
    G.items = (j?.items||[]).filter(e=>e.status!=='cancelled' && !e.extendedProperties?.private?.uaa).map(e=>{
      const dt = e.start?.dateTime, d = e.start?.date; const f = dt ? isoOf(new Date(dt)) : d;
      const h = dt ? new Date(dt).toLocaleTimeString('es-CL',{hour:'2-digit', minute:'2-digit', hour12:false, timeZone:TZ}) : '';
      const hf = e.end?.dateTime ? new Date(e.end.dateTime).toLocaleTimeString('es-CL',{hour:'2-digit', minute:'2-digit', hour12:false, timeZone:TZ}) : '';
      return {g:true, id:e.id, fecha:f, hora:h, horaFin:hf, titulo:e.summary||'(Sin título)', lugar:e.location||'', link:safeUrl(e.htmlLink), meet:e.hangoutLink ? safeUrl(e.hangoutLink) : '', todoDia:!dt};
    });
    G.range = key; G.ts = Date.now(); G.err = null;
  }catch(e){ if(e.code==='forbidden' && !G.err) G.err = 'api'; }
  G.busy = false; if(S.view==='agenda') refreshSoon();
}
agendaExtra = function(){ if(!isTeam() || (S.fprof && S.fprof!==S.data.usuario)) return []; if(S.view==='agenda') gLoad(); return G.items.slice(); };
