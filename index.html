/* ---- escritura: sesiones y reuniones programadas ---- */
const addMin = (f, h, m) => { const d = new Date(`${f}T${h||'00:00'}:00`); d.setMinutes(d.getMinutes()+(+m||0)); return `${isoOf(d)}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:00`; };
function whenOf(f, h, fin, dur){
  if(!h) { const n = new Date(f+'T12:00:00'); n.setDate(n.getDate()+1); return {start:{date:f}, end:{date:isoOf(n)}}; }
  const end = fin ? `${f}T${fin}:00` : addMin(f, h, dur||45);
  return {start:{dateTime:`${f}T${h}:00`, timeZone:TZ}, end:{dateTime:end, timeZone:TZ}};
}
function sesEvent(s, x){
  return {summary:`Sesión UAA · ${initials(s.nombre)} · ${cursoOf(s)}`, description:`${x.modalidad||'Sesión'} de la Unidad de Apoyo al Aprendizaje.\nDetalle en la plataforma: ${location.origin}`,
    ...whenOf(x.fecha, x.hora, null, x.duracion), visibility:'private', reminders:{useDefault:true}, extendedProperties:{private:{uaa:'ses', ref:x.id}}};
}
function reuEvent(r){
  const mails = (r.asistentes||[]).filter(id=>id!==S.data.usuario).map(id=>S.data.equipo.find(p=>p.id===id)?.correo).filter(Boolean);
  return {summary:`Reunión UAA: ${r.tipo||'Reunión de equipo'}`, description:`${r.tabla ? 'Tabla:\n'+r.tabla+'\n\n' : ''}Acta y acuerdos en la plataforma: ${location.origin}`, location:r.lugar||'',
    ...whenOf(r.fecha, r.hora, r.horaTermino, 60), reminders:{useDefault:true}, extendedProperties:{private:{uaa:'reu', ref:r.id}},
    ...(r.invitarGcal ? {attendees: mails.map(email=>({email}))} : {})};
}
const gHash = ev => JSON.stringify([ev.summary, ev.start, ev.end, ev.location||'', (ev.attendees||[]).map(a=>a.email).sort(), ev.description]);
async function gUpsert(holder, ev, notify){
  const h = gHash(ev); const cur = holder.gcal;
  if(cur && cur.by===S.data.usuario && cur.h===h) return false;
  const qs = notify ? '?sendUpdates=all' : '';
  let res = null;
  if(cur && cur.by===S.data.usuario && cur.id) res = await gFetch(`${GAPI}/${encodeURIComponent(cur.id)}${qs}`, {method:'PATCH', body:JSON.stringify(ev)});
  if(!res){ // antes de crear, buscar si ya existe (otro dispositivo o un intento anterior) para no duplicar
    const ref = ev.extendedProperties?.private?.ref;
    const found = ref ? await gFetch(`${GAPI}?privateExtendedProperty=${encodeURIComponent('ref='+ref)}&maxResults=2&showDeleted=false`).catch(()=>null) : null;
    const prev = found?.items?.find(x=>x.status!=='cancelled' && x.extendedProperties?.private?.ref===ref);
    if(prev) res = await gFetch(`${GAPI}/${encodeURIComponent(prev.id)}${qs}`, {method:'PATCH', body:JSON.stringify(ev)});
  }
  if(!res) res = await gFetch(GAPI+qs, {method:'POST', body:JSON.stringify(ev)});
  if(res?.id){ holder.gcal = {id:res.id, by:S.data.usuario, h}; return true; }
  return false;
}
async function gRemove(g, notify){ if(!g?.id || g.by!==S.data.usuario) return; await gFetch(`${GAPI}/${encodeURIComponent(g.id)}${notify?'?sendUpdates=all':''}`, {method:'DELETE'}).catch(()=>{}); }
async function gSync(){
  if(!gOk() || !isTeam() || G.syncing) return; G.syncing = true; let changed = false; const me = S.data.usuario; const from = D(-1);
  try{
    while(G.del.length){ const d = G.del.shift(); await gRemove(d.g, d.n); }
    if(gPref().ses){
      for(const s of S.data.students) for(const x of (s.sesiones||[])){
        if(x.profesional!==me){ if(x.gcal?.by===me){ await gRemove(x.gcal); delete x.gcal; changed = true; } continue; }
        if(x.estado==='Programada' && x.fecha>=from){ if(await gUpsert(x, sesEvent(s, x), false)) changed = true; }
        else if(x.gcal && x.gcal.by===me && x.estado==='Suspendida'){ await gRemove(x.gcal); delete x.gcal; changed = true; }
      }
    }
    for(const r of (S.data.reuniones||[])){
      const own = r.gcal ? r.gcal.by===me : (r._por===me);
      if(!own) continue;
      if(r.estado==='Programada' && r.fecha>=from){ if(await gUpsert(r, reuEvent(r), !!r.invitarGcal)) { changed = true; } }
      else if(r.gcal && r.estado==='Suspendida'){ await gRemove(r.gcal, !!r.invitarGcal); delete r.gcal; changed = true; }
    }
    // limpieza: eventos de la plataforma en mi calendario cuyo registro ya no existe o dejó de estar programado
    if(!G.cleanAt || Date.now() - G.cleanAt > 10*60e3){ G.cleanAt = Date.now();
      const ok = new Set(); S.data.students.forEach(s=>(s.sesiones||[]).forEach(x=>{ if(x.profesional===me && x.estado==='Programada' && x.gcal?.id) ok.add(x.gcal.id); }));
      (S.data.reuniones||[]).forEach(r=>{ if(r.estado==='Programada' && r.gcal?.id) ok.add(r.gcal.id); });
      for(const tipo of ['ses','reu']){
        const L = await gFetch(`${GAPI}?privateExtendedProperty=${encodeURIComponent('uaa='+tipo)}&timeMin=${encodeURIComponent(new Date().toISOString())}&maxResults=250&singleEvents=true`).catch(()=>null);
        for(const ev of (L?.items||[])){ if(ev.status==='cancelled' || ok.has(ev.id) || ev.extendedProperties?.private?.uaa!==tipo) continue;
          await gFetch(`${GAPI}/${encodeURIComponent(ev.id)}${ev.attendees?.length?'?sendUpdates=all':''}`, {method:'DELETE'}).catch(()=>{}); }
      }
    }
  }catch(e){ console.warn('gcal', e); }
  G.syncing = false;
  if(changed){ cloudPersist(); if(S.view==='agenda') refreshSoon(); }
}
const _cloudPersistG = cloudPersist;
cloudPersist = function(){ _cloudPersistG(); clearTimeout(G.t); G.t = setTimeout(gSync, 1200); };

document.addEventListener('click', e=>{

  if(a==='gcal-connect'){ e.stopImmediatePropagation(); if(C.dirty.size || C.saving){ toast('Espera a que termine de guardar e intenta de nuevo', true); return; } cloudLogin(true); }
  if(a==='gcal-reload'){ gLoad(true); gSync(); toast('Actualizando calendario…'); }
}, true);
document.addEventListener('change', e=>{ if(e.target.dataset?.act==='gcal-pref'){ const p = gPref(); p.ses = e.target.checked; gSetPref(p); if(p.ses) gSync(); toast(p.ses?'Tus sesiones programadas se agregarán a tu calendario':'Las nuevas sesiones ya no se agregarán a tu calendario'); } });

cloudBoot();
